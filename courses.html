<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Boba Break Study - Courses</title>

    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- TARUH KODE CSS KHUSUS DI SINI -->
    <style>
        .section-header h1 {
            font-size: 36px;
            color: #b8865c; /* Warna cokelat lembut ala boba */
            font-weight: 700; /* Ketebalan huruf */
            margin-bottom: 8px;
        }

        .section-header p {
            font-size: 17px;
            color: #6e5c52; /* Warna teks deskripsi yang lembut */
            margin-bottom: 30px;
        }
        
    /* Styling Search Bar ala Gambar */
    .search-bar {
        position: relative;
        width: 100%;
        margin-bottom: 24px;
    }

    .search-bar i {
        position: absolute;
        left: 20px;
        top: 50%;
        transform: translateY(-50%);
        color: #b5a497; /* Warna ikon kaca pembesar yang lembut */
        font-size: 15px;
    }

    .search-bar input {
        width: 100%;
        padding: 14px 20px 14px 50px; /* Padding kiri lebih besar agar teks tidak menabrak ikon */
        background-color: #ffffff;
        border: 1px solid #e0d4c8; /* Garis tepi warna cokelat muda */
        border-radius: 50px; /* Membuat sudutnya melengkung total / bentuk kapsul */
        outline: none;
        font-size: 14px;
        color: #4a3b32;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.01);
        transition: border-color 0.2s;
    }

    .search-bar input::placeholder {
        color: #b5a497; /* Warna tulisan "Search" */
    }

    .search-bar input:focus {
        border-color: #b8865c; /* Warna garis tepi saat diklik */
    }
       .course-grid{
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 24px;
    margin-top: 20px;
}

.card{
    background: #fff;
    border-radius: 20px;
    padding: 24px;
    box-shadow: 0 8px 20px rgba(0,0,0,.08);
    display: flex;
    flex-direction: column;
}

.card-img-placeholder{
    width:100%;
    height:180px;
    background:#f8efe7;
    border-radius:16px;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    margin-bottom:18px;
}

/* Untuk ikon */
.card-img-placeholder i{
    font-size:60px;
    color:#b8865c;
}

/* Untuk gambar */
.card-img-placeholder img{
    width:100%;
    height:100%;
    object-fit:cover;
} 
        .card h3{
    font-size: 24px;       /* Lebih besar */
    color: #b8865c;        /* Warna boba */
    font-weight: 700;
    margin-top: 8px;       /* Jarak dari gambar */
    margin-bottom: 12px;   /* Jarak ke deskripsi */
    line-height: 1.3;
}
</style>

</head>

<body>

<div class="app-container">

    <!-- Sidebar -->
<div id="sidebar-container"></div>


    <!-- Main Content -->
    <main class="main-content">

        <div class="courses-section">

            <!-- Header -->
            <div class="section-header">

                <h1>
                    Explore Courses
                </h1>

                <p>
                    Your daily cup of Mandarin learning.
                </p>

            </div>


            <!-- Search Bar -->
            <div class="search-bar">

    <i class="fa-solid fa-magnifying-glass"></i>

    <input
        type="text"
        id="searchInput"
        placeholder="Search courses..."
    >

</div>



            <!-- Course Grid -->
<section class="course-grid">

    




</section>

                </div>


            </div>

        </div>

    </main>

</div>
    <!-- TAMBAHKAN KODE INI DI SINI -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const searchInput = document.getElementById("searchInput");
        const cards = document.querySelectorAll(".course-grid .card");

        searchInput.addEventListener("input", function (e) {
            const searchTerm = e.target.value.toLowerCase().trim();

            cards.forEach(card => {
                const title = card.querySelector("h3").textContent.toLowerCase();
                const description = card.querySelector("p").textContent.toLowerCase();

                if (title.includes(searchTerm) || description.includes(searchTerm)) {
                    card.style.display = "flex";
                } else {
                    card.style.display = "none";
                }
            });
        });
    });
</script>
<script src="script.js"></script>
</body>
</html>

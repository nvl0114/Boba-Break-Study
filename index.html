<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Boba Break Study Dashboard">
    <title>Boba Break Study - Dashboard</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" href="logo.png" type="image/png">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* CSS untuk Announcement Card */
        .announcement-card {
            width: 100%;
            box-sizing: border-box;
            padding: 24px 28px;
            margin-bottom: 20px;
            background: #fffdf9;
            border: 1px solid #eadfd3;
            border-radius: 18px;
            box-shadow: 0 5px 18px rgba(120, 85, 55, 0.08);
        }

        .post-header { display: flex; align-items: center; gap: 11px; margin-bottom: 16px; }
        .post-avatar { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; border: 2px solid #f0dfce; }
        .post-name { font-weight: 700; color: #4b3528; font-size: 15px; }
        .post-handle { color: #9b8b80; font-size: 13px; }
        .post-content p { color: #49372d; font-size: 15px; line-height: 1.7; white-space: pre-line; margin: 0; }
        .post-date { color: #9b8b80; font-size: 12px; margin-top: 15px; }
    </style>
</head>

<body>

<div class="app-container">
    <div id="sidebar-container"></div>

    <main class="main-content">
        <header class="top-header">
            <div class="welcome-text">
                <h1>Hello and welcome!!</h1>
                <p>Boba Break Study is your one-stop shop for learning Traditional Chinese. Grab a cup of boba and start exploring!</p>
            </div>
        </header>

        <section class="section-container">
            
            <!-- Tempat munculnya Announcement -->
            <div id="announcement-container"></div>

            <!-- MANDARIN MUSIC -->
            <article class="card video-card">
                <h3 class="video-title">🎵 Mandarin Music</h3>
                <div class="youtube-frame">
                    <iframe src="https://www.youtube.com/embed/fdQgPu3iUYk" title="Mandarin Music" frameborder="0" allowfullscreen></iframe>
                </div>
                <p>Enjoy Mandarin music while improving your listening skills.</p>
            </article>

            <!-- HANZI OF THE DAY -->
            <div class="card lesson-card">
                <h2>🧋 Hanzi of The Day</h2>
                <div class="flashcard" id="card">
                    <div class="card-inner">
                        <div class="card-front"><span id="hanzi"></span></div>
                        <div class="card-back"><span id="pinyin"></span><span id="meaning"></span></div>
                    </div>
                </div>
                <p class="instruction">👆 Tap to flip <br> 👈 Swipe for new</p>
            </div>
        </section>
    </main>
</div>

<script>
    // Data Pengumuman
    const announcements = [
        {
            text: "We’re still brewing new lessons! 🧋✨\nMore Mandarin learning materials are coming soon. Stay tuned!",
            time: "12:46 PM",
            date: "Aug 17, 2026"
        }
    ];

    const container = document.getElementById("announcement-container");

    announcements.forEach(ann => {
        const article = document.createElement("article");
        article.className = "announcement-card";
        article.innerHTML = `
            <div class="post-header">
                <img src="logo.png" class="post-avatar" alt="Admin">
                <div>
                    <div class="post-name">Admin ✓</div>
                    <div class="post-handle">@bobabreakstudy</div>
                </div>
            </div>
            <div class="post-content"><p>${ann.text}</p></div>
            <div class="post-date">${ann.time} · ${ann.date}</div>
        `;
        container.appendChild(article);
    });
</script>

<script src="flashcard.js"></script>
<script src="script.js"></script>

</body>
</html>

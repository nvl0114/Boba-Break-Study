<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boba Break Study - Ordering Drink</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --boba-brown: #b8865c;
            --boba-light: #fff8ef;
            --accent-gold: #ff9800;
        }

        body { font-family: 'Segoe UI', sans-serif; background-color: #fdfbf7; }

        /* General Layout */
        .app-container { max-width: 900px; margin: 0 auto; padding: 20px; }
        
        /* Chat Styling */
        .chat-container { margin-top: 30px; }
        .chat { display: flex; align-items: flex-start; gap: 15px; margin-bottom: 20px; }
        .chat.right { flex-direction: row-reverse; }
        .avatar { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; }
        .bubble { max-width: 70%; background: white; padding: 18px; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .right .bubble { background: #fff2d8; }
        
        /* Vocab Stickers */
        .vocab-container { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; margin-top: 25px; }
        .vocab-sticker {
            position: relative;
            background: var(--boba-light);
            border-radius: 20px;
            padding: 20px 10px;
            width: 140px;
            text-align: center;
            border: 2px dashed var(--boba-brown);
            transition: 0.3s;
        }
        .vocab-sticker:hover { transform: translateY(-5px); }
        .vocab-sticker::before { content: "🧋"; position: absolute; top: -15px; right: 5px; font-size: 20px; }
        
        /* Buttons & Utility */
        .play-btn { width: 30px; height: 30px; border-radius: 50%; background: var(--boba-brown); color: white; border: none; cursor: pointer; }
        .lesson-card { background: white; padding: 30px; border-radius: 25px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); margin-bottom: 30px; }
        .hanzi-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 5px; }
        .hanzi { font-size: 22px; font-weight: bold; color: var(--boba-brown); }
        .pinyin { color: #777; font-size: 14px; }
        .translation { color: #555; font-size: 14px; margin-top: 5px; }

        .nav-btn {
            display: inline-flex; align-items: center; gap: 10px;
            padding: 12px 25px; background: var(--boba-brown); color: white;
            border-radius: 50px; text-decoration: none; font-weight: bold;
        }
    </style>
</head>
<body>

<div class="app-container">
    
    <!-- Header Section -->
    <section class="lesson-card">
        <h1>Ordering Drink in Taiwan</h1>
        <p>Learn how to customize your drink order like a local: sugar, ice, size, and toppings.</p>
    </section>

    <!-- Chat Interaction -->
    <div class="chat-container">
        <!-- Example Chat Row -->
        <div class="chat left">
            <img src="https://img.icons8.com/?size=100&id=FDEQEnTnBVu2&format=png&color=000000" class="avatar">
            <div class="bubble">
                <div class="hanzi-row">
                    <div class="hanzi">你好！歡迎光臨！</div>
                    <button class="play-btn" onclick="speak('你好！歡迎光臨！')">🔊</button>
                </div>
                <div class="pinyin">Nǐ hǎo! Huānyíng guānglín!</div>
                <div class="translation">Hello! Welcome!</div>
            </div>
        </div>
        <!-- (Add other chat bubbles here following the same structure) -->
    </div>

    <!-- Vocabulary Section -->
    <div class="lesson-card">
        <h2>Vocabulary List</h2>
        <div class="vocab-container">
            <div class="vocab-sticker">
                <div class="hanzi">點</div>
                <div class="pinyin">diǎn</div>
                <div class="translation">to order</div>
            </div>
            <div class="vocab-sticker">
                <div class="hanzi">甜度</div>
                <div class="pinyin">tián dù</div>
                <div class="translation">sweetness</div>
            </div>
            <!-- Add remaining vocab -->
        </div>
    </div>

    <!-- Navigation -->
    <div style="text-align: center; margin: 40px 0;">
        <a href="#" class="nav-btn">Finish Lesson ✨</a>
    </div>
</div>

<script>
    function speak(text){
        let speech = new SpeechSynthesisUtterance(text);
        speech.lang = "zh-TW";
        speech.rate = 0.8;
        speechSynthesis.cancel(); 
        speechSynthesis.speak(speech);
    }
</script>
</body>
</html>

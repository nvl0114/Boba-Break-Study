<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Convenience Store 3</title>

    <!-- CSS Utama -->
    <link rel="stylesheet" href="../style.css">

    
<!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


    <!-- CSS Halaman Ini -->
    <style>

        /* Lesson Card */
        .lesson-card {
            background: white;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            margin: 30px auto;
            max-width: 800px;
        }


        .lesson-card h2 {
            color: #b8865c;
            font-size: 28px;
            margin-bottom: 10px;
        }


        .lesson-card p {
            color: #666;
            line-height: 1.6;
        }


        /* Vocabulary Container */
        .vocab-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 25px;
        }


        /* Vocabulary Sticker */
        .vocab-sticker {
            background: #fff8ef;
            border-radius: 20px;
            padding: 20px;
            width: 160px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            border: 2px solid #f3dfc8;
            transition: 0.3s;
        }


        .vocab-sticker:hover {
            transform: translateY(-5px) rotate(1deg);
        }


        .hanzi {
            font-size: 40px;
            font-weight: bold;
            color: #b8865c;
        }


        .pinyin {
            font-size: 18px;
            margin-top: 10px;
            color: #555;
        }


        .meaning {
            margin-top: 8px;
            font-size: 16px;
            color: #333;
        }


        /* Lesson Navigation */
        .lesson-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 40px auto;
            max-width: 800px;
        }


        .prev-btn,
        .next-btn {
            display: inline-flex;
            align-items: center;
            padding: 12px 22px;
            background: linear-gradient(135deg, #d7b89c, #b8865c);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            box-shadow: 0 5px 15px rgba(184,134,92,0.25);
            transition: 0.25s;
        }


        .prev-btn:hover,
        .next-btn:hover {
            transform: translateY(-3px);
        }


        /* Mobile */
        @media (max-width:700px) {

            .lesson-card {
                padding: 20px;
                margin: 20px;
            }


            .vocab-container {
                justify-content: center;
            }


            .vocab-sticker {
                width: 140px;
            }


            .hanzi {
                font-size: 34px;
            }

        }

    </style>

</head>


<body>


<div class="app-container">


    <!-- Sidebar tetap -->
    <div id="sidebar-container"></div>



    <main class="main-content">


        <div class="lesson-card">


            <h2>🍵 Greetings in Mandarin</h2>


            <p>
                Learn some basic Mandarin greetings that you can use in daily conversations.
            </p>



            <div class="vocab-container">


                <div class="vocab-sticker">

                    <div class="hanzi">
                        你好
                    </div>

                    <div class="pinyin">
                        Nǐ hǎo
                    </div>

                    <div class="meaning">
                        Hello
                    </div>

                </div>




                <div class="vocab-sticker">

                    <div class="hanzi">
                        謝謝
                    </div>

                    <div class="pinyin">
                        Xiè xiè
                    </div>

                    <div class="meaning">
                        Thank you
                    </div>

                </div>




                <div class="vocab-sticker">

                    <div class="hanzi">
                        再見
                    </div>

                    <div class="pinyin">
                        Zài jiàn
                    </div>

                    <div class="meaning">
                        Goodbye
                    </div>

                </div>



            </div>


        </div>





        <!-- Lesson Navigation -->

        <div class="lesson-nav">

            <a href="711-2.html" class="prev-btn">
                🧋 Previous
            </a>


        </div>



    </main>


</div>



<!-- Script Sidebar -->
<script src="../script.js"></script>


</body>

</html>

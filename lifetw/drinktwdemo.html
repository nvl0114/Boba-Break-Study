<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boba Break Study - Ordering Drink (Complete Guide)</title>

    <!-- Link ke Style External (Pastikan path benar) -->
    <link rel="stylesheet" href="../style.css">
    <!-- Link ke Font Awesome Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style>
        /* --- GLOBAL STYLES & VARIABLES --- */
        :root {
            --sidebar-bg: #ffffff;
            --main-bg: #f8f9fa;
            --text-main: #333333;
            --text-muted: #777777;
            --primary-color: #b8865c; /* Boba Brown */
            --accent-color: #ffc772; /* Yellow Accent */
            --bubble-staff: #ffffff;
            --bubble-user: #fff8e1; /* Light Boba Yellow */
            --shadow-soft: 0 4px 10px rgba(0,0,0,.05);
            --shadow-card: 0 8px 25px rgba(0,0,0,.06);
            --font-heading: 'Poppins', sans-serif;
            --font-body: 'Poppins', sans-serif;
            --font-hanzi: 'Noto Sans SC', serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--main-bg);
            color: var(--text-main);
            line-height: 1.6;
            display: flex;
            min-height: 100vh;
        }

        /* --- SIDEBAR STYLES --- */
        .app-container {
            display: flex;
            flex: 1;
            overflow-x: hidden;
        }

        .sidebar {
            width: 280px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid #eee;
            display: flex;
            flex-direction: column;
            padding: 25px;
            position: sticky;
            top: 0;
            height: 100vh;
            flex-shrink: 0;
        }

        .logo-area {
            margin-bottom: 40px;
        }

        .logo-top {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .logo-img {
            width: 45px;
            height: 45px;
            border-radius: 10px;
        }

        .logo-area h2 {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary-color);
            line-height: 1.2;
        }

        .logo-area h2 span {
            color: var(--text-muted);
            font-weight: 500;
        }

        .sidebar-jargon {
            font-size: 13px;
            color: var(--text-muted);
            padding-left: 57px;
        }

        .nav-menu {
            list-style: none;
        }

        .nav-menu li {
            margin-bottom: 5px;
        }

        .nav-menu a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .nav-menu a:hover {
            background-color: #fff3e0;
            color: var(--primary-color);
        }

        .nav-menu a.active {
            background-color: var(--primary-color);
            color: white;
            font-weight: 500;
        }

        .course-menu .submenu {
            display: none; /* Mulai dengan disembunyikan */
            list-style: none;
            padding-left: 45px;
            margin-top: 5px;
        }

        .course-menu.open .submenu {
            display: block;
        }

        .course-menu > a {
            justify-content: space-between;
        }

        .course-menu > a .fa-chevron-down {
            font-size: 12px;
            transition: transform 0.3s ease;
        }

        .course-menu.open > a .fa-chevron-down {
            transform: rotate(180deg);
        }

        /* --- MAIN CONTENT STYLES --- */
        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        /* --- SECTION HEADER --- */
        .section-header {
            margin-bottom: 35px;
        }

        .section-header h1 {
            font-family: var(--font-heading);
            font-size: 40px;
            color: var(--primary-color);
            margin-bottom: 15px;
            line-height: 1.2;
        }

        .section-header p {
            color: var(--text-muted);
            font-size: 18px;
            max-width: 800px;
        }

        /* --- VIDEO CARD --- */
        .video-grid {
            margin-bottom: 50px;
        }

        .video-card {
            background: white;
            padding: 40px;
            border-radius: 25px;
            box-shadow: var(--shadow-card);
        }

        /* --- CHAT LESSON STYLES --- */
        .chat-container {
            display: flex;
            flex-direction: column;
            gap: 25px;
            margin-bottom: 60px;
        }

        .chat {
            display: flex;
            align-items: flex-start;
            gap: 18px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chat.right {
            flex-direction: row-reverse;
        }

        .avatar-container {
            width: 50px;
            height: 50px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit:cover;
            border: 3px solid white;
            box-shadow: var(--shadow-soft);
        }

        .avatar-label {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .bubble {
            max-width: 65%;
            padding: 25px;
            border-radius: 20px;
            box-shadow: var(--shadow-soft);
            position: relative;
        }

        .chat.left .bubble {
            background-color: var(--bubble-staff);
            border-top-left-radius: 5px;
        }

        .chat.right .bubble {
            background-color: var(--bubble-user);
            border-top-right-radius: 5px;
        }

        .hanzi-row {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            justify-content: space-between;
        }

        .hanzi {
            font-family: var(--font-hanzi);
            font-size: 32px;
            font-weight: 600;
            color: var(--primary-color);
            line-height: 1.3;
        }

        /* Audio Button yang Diperbarui */
        .play-btn {
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 50%;
            background: transparent;
            color: var(--primary-color);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            margin-top: -5px;
        }

        .play-btn:hover {
            background-color: #fff3e0;
            color: #9c6d47;
            border-color: #ffe0b2;
        }

        .play-btn:active {
            transform: scale(0.95);
        }

        .pinyin {
            font-size: 16px;
            color: var(--text-muted);
            margin-top: 10px;
            font-style: italic;
        }

        .translation {
            margin-top: 10px;
            color: var(--text-main);
            font-size: 16px;
        }

        /* --- LESSON CARD & KEYWORDS --- */
        .lesson-card {
            background: white;
            padding: 40px;
            border-radius: 25px;
            box-shadow: var(--shadow-card);
            margin-bottom: 40px;
        }

        .lesson-card h2 {
            font-family: var(--font-heading);
            color: var(--primary-color);
            font-size: 32px;
            margin-bottom: 20px;
        }

        .lesson-card p {
            color: var(--text-muted);
            line-height: 1.7;
            margin-bottom: 30px;
            font-size: 17px;
            max-width: 800px;
        }

        .formula-box {
            background-color: #fff3e0;
            border-left: 5px solid var(--primary-color);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            display: inline-block;
        }

        /* Vocab Stickers yang Didesain Ulang */
        .vocab-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 25px;
            margin-top: 35px;
        }

        .vocab-sticker {
            background: #fffcf7;
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            border: 2px solid #ffe0b2;
            box-shadow: 0 5px 15px rgba(184,134,92,0.08);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
        }

        .vocab-sticker:hover {
            transform: translateY(-5px) scale(1.02);
            background: #fff8ef;
            box-shadow: 0 8px 20px rgba(184,134,92,0.12);
            border-color: var(--primary-color);
        }

        .vocab-sticker .hanzi {
            font-size: 36px;
            margin-bottom: 10px;
            line-height: 1;
        }

        .vocab-sticker .pinyin {
            font-size: 15px;
            margin-top: 0;
            color: var(--text-muted);
        }

        .vocab-sticker .meaning {
            margin-top: 10px;
            font-size: 14px;
            color: var(--text-main);
            font-weight: 500;
        }

        /* Icon Bubble Bawah */
        .bubble-icon {
            position: absolute;
            bottom: -15px;
            right: 20px;
            font-size: 24px;
            color: var(--primary-color);
            opacity: 0.3;
        }

        /* --- IMAGE STYLES --- */
        .image-wrapper {
            text-align: center;
            margin: 40px 0;
            padding: 20px;
            background: white;
            border-radius: 20px;
            box-shadow: var(--shadow-soft);
        }

        .main-img {
            max-width: 100%;
            height: auto;
            border-radius: 15px;
            transition: transform 0.3s ease;
        }
        
        .main-img:hover {
            transform: scale(1.01);
        }

        /* --- FOOTER & CLOSING --- */
        .closing-text {
            font-style: italic;
            color: var(--text-muted);
            text-align: center;
            margin-top: 50px;
            font-size: 16px;
        }

        /* --- RESPONSIVE STYLES --- */
        @media (max-width: 1024px) {
            .sidebar { width: 250px; padding: 20px; }
            .main-content { padding: 30px; }
            .section-header h1 { font-size: 34px; }
            .bubble { max-width: 75%; }
        }

            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; position: relative; border-right: none; border-bottom: 1px solid #eee; }
            .main-content { padding: 20px; }
            .section-header h1 { font-size: 28px; }
            .bubble { max-width: 85%; padding: 20px; }

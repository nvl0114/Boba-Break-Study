<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mandarin Quiz - Grammar 的 & Vocabulary</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; line-height: 1.6; background-color: #f4f4f9; color: #333; }
        .container { max-width: 800px; margin: auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .vocab-list { background: #eef2f7; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
        .question { margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #eee; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        input[type="text"] { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #4CAF50; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #45a049; }
    </style>
</head>
<body>

<div class="container">
    <h1>Mandarin Quiz & Practice</h1>
    <p>Complete all instructions in English. All listed vocabulary items are included without using the counter word 個.</p>

    <div class="vocab-list">
        <h3>Complete Vocabulary List</h3>
        <p>我, 你, 妳, 她, 他, 吃, 喝, 你們, 妳們, 他們, 她們, 我們, 朋友, 手機, 電腦, 電視, 車, 報紙, 照片, 媽媽, 爸爸, 老師, 眼鏡, 巧克力, 禮物, 東西, 信, 妹妹, 姊姊, 老闆娘</p>
    </div>

    <form>
        <div class="question">
            <label>1. Translate 妹妹 to English:</label>
            <input type="text" name="q1" placeholder="Your answer...">
        </div>

        <div class="question">
            <label>2. Translate 姊姊 to English:</label>
            <input type="text" name="q2" placeholder="Your answer...">
        </div>

        <div class="question">
            <label>3. Translate 老闆娘 to English:</label>
            <input type="text" name="q3" placeholder="Your answer...">
        </div>

        <div class="question">
            <label>4. Translate 信 to English:</label>
            <input type="text" name="q4" placeholder="Your answer...">
        </div>

        <div class="question">
            <label>5. Write the Hanzi for "Younger sister":</label>
            <input type="text" name="q5" placeholder="Your answer...">
        </div>

        <div class="question">
            <label>6. Write the Hanzi for "Older sister":</label>
            <input type="text" name="q6" placeholder="Your answer...">
        </div>

        <div class="question">
            <label>7. Write the Hanzi for "Boss's wife / female owner":</label>
            <input type="text" name="q7" placeholder="Your answer...">
        </div>

        <div class="question">
            <label>8. Write the Hanzi for "Letter":</label>
            <input type="text" name="q8" placeholder="Your answer...">
        </div>

        <button type="submit">Submit Quiz</button>
    </form>
</div>

</body>
</html>

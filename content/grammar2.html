<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>在 (zài) — Location & Ongoing Actions | Grammar Guide</title>

    <!-- Main CSS -->
    <link rel="stylesheet" href="../style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        /* =====================================================
           GRAMMAR PAGE
        ===================================================== */

        .grammar-page {
            max-width: 850px;
            margin: 0 auto;
            padding: 25px 20px 50px;
        }

        /* =====================================================
           HEADER
        ===================================================== */

        .grammar-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .grammar-header h1 {
            color: #b8865c;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .grammar-header p {
            color: #777;
            font-size: 14px;
            line-height: 1.6;
            max-width: 680px;
            margin: auto;
        }

        .grammar-header .hanzi-title {
            color: #5c4033;
            font-size: 42px;
            font-weight: bold;
            margin-bottom: 3px;
        }

        /* =====================================================
           INTRO
        ===================================================== */

        .intro-card {
            background: #fff8ef;
            border: 1.5px solid #d7b89c;
            border-radius: 20px;
            padding: 22px;
            margin-bottom: 25px;
            text-align: center;
        }

        .intro-card h2 {
            color: #b8865c;
            font-size: 20px;
            margin-bottom: 10px;
        }

        .intro-card p {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
            margin: 0;
        }

        .intro-word {
            display: inline-block;
            margin-top: 14px;
            padding: 8px 18px;
            background: white;
            border: 1px solid #d7b89c;
            border-radius: 30px;
            color: #5c4033;
            font-weight: bold;
            font-size: 18px;
        }

        /* =====================================================
           GRAMMAR SECTION
        ===================================================== */

        .grammar-section {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.06);
            margin-bottom: 25px;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .section-number {
            background: #b8865c;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            flex-shrink: 0;
        }

        .section-title h2 {
            color: #5c4033;
            font-size: 22px;
            margin: 0;
        }

        .section-description {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
            margin: 0 0 20px 42px;
        }

        /* =====================================================
           PATTERN BOX
        ===================================================== */

        .pattern-box {
            background: #fdfbf7;
            border: 1.5px dashed #d7b89c;
            border-radius: 15px;
            padding: 18px;
            margin: 15px 0;
        }

        .pattern-label {
            color: #b8865c;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .pattern {
            color: #5c4033;
            font-size: 19px;
            font-weight: bold;
            text-align: center;
            padding: 8px;
        }

        /* =====================================================
           EXPLANATION
        ===================================================== */

        .explanation {
            color: #555;
            font-size: 14px;
            line-height: 1.6;
            margin: 15px 0;
        }

        .explanation strong {
            color: #5c4033;
        }

        /* =====================================================
           EXAMPLES
        ===================================================== */

        .example-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 15px;
        }

        .example-card {
            background: #fff8ef;
            border: 1.5px solid #d7b89c;
            border-radius: 14px;
            padding: 14px;
        }

        .example-label {
            font-size: 11px;
            color: #b8865c;
            font-weight: bold;
            margin-bottom: 6px;
            text-transform: uppercase

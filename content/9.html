<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Boba Break Study</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff8f0;
            color: #333;
        }

        header {
            background: #8b5e3c;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 20px;
        }

        .lesson-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 25px;
        }

        .lesson-btn {
            border: none;
            padding: 10px 16px;
            border-radius: 10px;
            background: #ead7c5;
            cursor: pointer;
            font-size: 15px;
        }

        .lesson-btn.active {
            background: #8b5e3c;
            color: white;
        }

        .lesson-title {
            margin-bottom: 25px;
        }

        .section {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .section h2 {
            margin-top: 0;
            color: #8b5e3c;
        }

        .grammar-card {
            border: 1px solid #ead7c5;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .grammar-card h3 {
            margin-top: 0;
        }

        .category {
            display: inline-block;
            background: #f3e4d5;
            color: #6d452b;
            padding: 4px 9px;
            border-radius: 8px;
            font-size: 12px;
            margin-bottom: 10px;
        }

        .explanation {
            line-height: 1.6;
        }

        .examples {
            background: #faf5ef;
            padding: 12px;
            border-radius: 10px;
            margin-top: 10px;
        }

        .example {
            margin: 8px 0;
            font-size: 18px;
        }

        .vocabulary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
        }

        .vocab-card {
            border: 1px solid #ead7c5;
            border-radius: 12px;
            padding: 15px;
        }

        .hanzi {
            font-size: 28px;
            font-weight: bold;
        }

        .pinyin {
            color: #8b5e3c;
            margin-top: 5px;
        }

        .meaning {
            margin-top: 5px;
        }

        .vocab-category {
            font-size: 12px;
            color: #777;
            margin-top: 8px;
        }

        .review-card {
            background: #faf5ef;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 12px;
        }

        .meaning-text {
            font-weight: bold;
            margin-bottom: 10px;
        }

        .answer {
            font-size: 20px;
            letter-spacing: 3px;
        }

        .empty {
            color: #777;
            font-style: italic;
        }
    </style>
</head>

<body>

<header>
    <h1>🥤 Boba Break Study</h1>
    <p>Mandarin Chinese Study Lessons</p>
</header>

<div class="container">

    <!-- LESSON BUTTONS -->
    <div id="lessonSelector" class="lesson-selector"></div>

    <!-- LESSON CONTENT -->
    <div id="lessonContent"></div>

</div>

<!-- =========================================================
     LOAD DATABASE FIRST
     ========================================================= -->

<script src="lesson.js"></script>

<!-- =========================================================
     HTML LOGIC
     ========================================================= -->

<script>

    const lessonSelector = document.getElementById("lessonSelector");
    const lessonContent = document.getElementById("lessonContent");

    let currentLesson = 1;


    // ========================================================
    // CREATE LESSON BUTTONS
    // ========================================================

    function createLessonButtons() {

        lessonSelector.innerHTML = "";

        Object.keys(allLessonsData).forEach(lessonNumber => {

            const button = document.createElement("button");

            button.className = "lesson-btn";
            button.textContent = `Lesson ${lessonNumber}`;

            button.addEventListener("click", () => {
                currentLesson = Number(lessonNumber);

                updateActiveButton();
                renderLesson(currentLesson);
            });

            lessonSelector.appendChild(button);
        });

        updateActiveButton();
    }


    // ========================================================
    // ACTIVE LESSON BUTTON
    // ========================================================

    function updateActiveButton() {

        const buttons = document.querySelectorAll(".lesson-btn");

        buttons.forEach((button, index) => {

            const lessonNumber = index + 1;

            button.classList.toggle(
                "active",
                lessonNumber === currentLesson
            );

        });
    }


    // ========================================================
    // RENDER LESSON
    // ========================================================

    function renderLesson(lessonNumber) {

        const lesson = allLessonsData[lessonNumber];

        if (!lesson) {
            lessonContent.innerHTML = `
                <div class="section">
                    <p class="empty">
                        This lesson does not exist.
                    </p>
                </div>
            `;

            return;
        }


        let html = `

            <div class="lesson-title">
                <h1>Lesson ${lessonNumber}</h1>
            </div>

        `;


        // ====================================================
        // GRAMMAR
        // ====================================================

        html += `
            <div class="section">

                <h2>📚 Grammar</h2>
        `;

        if (lesson.grammar && lesson.grammar.length > 0) {

            lesson.grammar.forEach(grammar => {

                html += `

                    <div class="grammar-card">

                        <h3>${grammar.name}</h3>

                        <div class="category">
                            ${grammar.category}
                        </div>
                `;


                if (grammar.explanation) {

                    html += `
                        <div class="explanation">
                            ${grammar.explanation}
                        </div>
                    `;

                }


                if (grammar.examples && grammar.examples.length > 0) {

                    html += `
                        <div class="examples">

                            <strong>Examples:</strong>
                    `;

                    grammar.examples.forEach(example => {

                        html += `
                            <div class="example">
                                ${example}
                            </div>
                        `;

                    });

                    html += `
                        </div>
                    `;
                }


                html += `
                    </div>
                `;

            });

        } else {

            html += `
                <p class="empty">
                    No grammar available.
                </p>
            `;
        }


        html += `
            </div>
        `;


        // ====================================================
        // VOCABULARY
        // ====================================================

        html += `
            <div class="section">

                <h2>📝 Vocabulary</h2>

                <div class="vocabulary-grid">
        `;


        if (lesson.vocabulary && lesson.vocabulary.length > 0) {

            lesson.vocabulary.forEach(word => {

                html += `

                    <div class="vocab-card">

                        <div class="hanzi">
                            ${word.hanzi}
                        </div>

                        <div class="pinyin">
                            ${word.pinyin}
                        </div>

                        <div class="meaning">
                            ${word.meaning}
                        </div>

                        <div class="vocab-category">
                            ${word.category}
                        </div>

                    </div>

                `;

            });

        } else {

            html += `
                <p class="empty">
                    No vocabulary available.
                </p>
            `;
        }


        html += `
                </div>
            </div>
        `;


        // ====================================================
        // REVIEW QUESTIONS
        // ====================================================

        html += `
            <div class="section">

                <h2>🔄 Review</h2>
        `;


        if (
            lesson.reviewQuestions &&
            lesson.reviewQuestions.length > 0
        ) {

            lesson.reviewQuestions.forEach((question, index) => {

                html += `

                    <div class="review-card">

                        <div class="meaning-text">
                            ${index + 1}. ${question.meaning}
                        </div>

                        <div class="answer">
                            ${question.answer.join("")}
                        </div>

                    </div>

                `;

            });

        } else {

            html += `
                <p class="empty">
                    No review questions available.
                </p>
            `;
        }


        html += `
            </div>
        `;


        // ====================================================
        // DISPLAY
        // ====================================================

        lessonContent.innerHTML = html;
    }


    // ========================================================
    // INITIALIZE
    // ========================================================

    createLessonButtons();
    renderLesson(currentLesson);

</script>

</body>
</html>

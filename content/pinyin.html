<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 1 - Boba Break Study</title>
    
    <!-- CSS Utama & Font -->
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        /* Styling Khusus Halaman */
        .section-header h1 { font-size: 36px; color: #b8865c; font-weight: 700; margin-bottom: 8px; }
        .section-header p { font-size: 17px; color: #6e5c52; margin-bottom: 30px; }

        .video-grid { display: grid; grid-template-columns: 1fr; gap: 30px; margin-top: 20px; }

        .video-card { background: #fff; border-radius: 20px; overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,.08); border: 1px solid #e6d8c4; padding: 20px; }

        .video-wrapper { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; background: #000; border-radius: 12px; margin-bottom: 15px; }
        .video-wrapper iframe { width: 100%; height: 100%; border: 0; }

        .description-text { color: #6e5c52; line-height: 1.6; }
    </style>
</head>

<body>
    <div class="app-container">
        <!-- Sidebar otomatis masuk di sini -->
        <div id="sidebar-container"></div>

        <main class="main-content">
            <div class="courses-section">
                <div class="section-header">
                    <h1>Pinyin</h1>
                    <p>Introduction to Mandarin Phonetics</p>
                </div>

                <div class="video-grid">
                    <!-- Video Card 1 -->
                    <article class="card video-card">
                        <div class="video-wrapper">
                            <iframe 
                                src="https://www.youtube.com/embed/nHDQm4NXq7Q"
                                title="Pinyin"
                                allowfullscreen>
                            </iframe>
                        </div>
                        <p class="description-text">
                            Although Taiwan mainly uses Zhuyin (注音) as its phonetic system, I will use Pinyin in this learning material to make it easier for foreign learners to understand and learn Mandarin.
                        </p>
                    </article>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="../script.js"></script>
    <script src="../courses.js"></script>
</body>
</html>

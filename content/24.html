<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boba Break Study - Mobile Version</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #1e1b18;
            color: #f4f1ea;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .game-wrapper {
            width: 100%;
            max-width: 480px; /* Ukuran pas ala layar HP */
            height: 100vh;
            max-height: 850px;
            background: #2b2621;
            display: flex;
            flex-direction: column;
            border-radius: 0;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            position: relative;
            overflow: hidden;
        }
        @media(min-width: 500px) {
            .game-wrapper { border-radius: 16px; border: 4px solid #5c4033; }
        }
        /* Bagian Atas / Visual Scene */
        .scene-container {
            flex: 1;
            background: linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.4)), url('https://images.unsplash.com/photo-1542314831-068cd1dbfeeb?q=80&w=600&auto=format&fit=crop') center/cover;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .badge {
            background: rgba(92, 64, 51, 0.85);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            color: #ffd700;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .vocab-btn {
            background: #c86d51;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        
        /* Area Dialog / Kotak Percintaan ala Visual Novel */
        .dialogue-box {
            background: rgba(35, 30, 26, 0.92);
            border: 2px solid #8c6d53;
            border-radius: 14px;
            padding: 16px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
        }
        .speaker-name {
            color: #e67e22;
            font-weight: bold;
            font-size: 0.95rem;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .dialogue-text {
            font-size: 1.05rem;
            line-height: 1.4;
            margin-bottom: 8px;
        }
        .pinyin-text {
            color: #b2bec3;
            font-size: 0.85rem;
            font-style: italic;
            margin-bottom: 12px;
        }
        .action-choice-btn {
            background: #27ae60;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .action-choice-btn:active { transform: scale(0.98); }

        /* Modal Vocab Overlay */
        .modal {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 100;
            justify-content: center;
            align-items: flex-end;
        }
        .modal-content {
            background: #2b2621;
            width: 100%;
            height: 75%;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 20px;
            overflow-y: auto;
            border-top: 3px solid #c86d51;
        }
        .close-modal {
            background: none; border: none; color: #fff; font-size: 1.5rem; float: right; cursor: pointer;
        }
        .vocab-item {
            background: #383029;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #c86d51;
        }
        .vocab-cn { font-size: 1.1rem; font-weight: bold; color: #f1c40f; }
        .vocab-en { font-size: 0.85rem; color: #bdc3c7; }
    </style>
</head>
<body>

<div class="game-wrapper">
    <!-- Layar / Scene Utama -->
    <div class="scene-container" id="sceneBg">
        <div class="top-bar">
            <div class="badge" id="levelBadge">📍 Misi 1: Ke Stasiun</div>
            <button class="vocab-btn" onclick="toggleVocab(true)">📖 Vocab</button>
        </div>

        <!-- Kotak Dialog Bawah (Sangat Ramah HP/Touchscreen) -->
        <div class="dialogue-box">
            <div class="speaker-name" id="speakerTitle">Warga Desa</div>
            <div class="dialogue-text" id="dialogueText">Mau ke stasiun? Naik <b>105 公車 (gōngchē)</b>, turun di depan <b>銀行 (yínháng)</b>.</div>
            <div class="pinyin-text" id="pinyinText">Nǐ xiǎng qù chēzhàn ma? Dā 105 gōngchē...</div>
            <button class="action-choice-btn" id="choiceBtn" onclick="nextStep()">Lanjut Naik Kereta (火車)</button>
        </div>
    </div>
</div>

<!-- Modal Menu Kosakata -->
<div class="modal" id="vocabModal">
    <div class="modal-content">
        <button class="close-modal" onclick="toggleVocab(false)">&times;</button>
        <h3 style="color:#e67e22; margin-top:0;">Kosakata Tamsui Journey</h3>
        <div id="vocabListContainer"></div>
    </div>
</div>

<script>
    let currentStage = 0;

    const storyData = [
        {
            stageName: "📍 Misi 1: Mencari Bus",
            bgUrl: "url('https://images.unsplash.com/photo-1542314831-068cd1dbfeeb?q=80&w=600&auto=format&fit=crop')",
            speaker: "Warga Desa",
            text: "Mau ke stasiun? Naik <b>105 公車 (gōngchē)</b>, turun di depan <b>銀行 (yínháng)</b>, lalu lanjut jalan kaki.",
            pinyin: "Nǐ xiǎng qù chēzhàn ma? Dā 105 gōngchē, xiàchē zài yínháng...",
            btnText: "Naik Kereta Menuju Taipei (火車)"
        },
        {
            stageName: "📍 Misi 2: Stasiun Taipei",
            bgUrl: "url('https://images.unsplash.com/photo-1509198397868-475647b2a1e5?q=80&w=600&auto=format&fit=crop')",
            speaker: "Petugas Stasiun",
            text: "Mau ke Tamsui? Kamu harus <b>轉乘 (zhuǎnchéng - transfer)</b> ke <b>紅線 (hóng xiàn - Red Line)</b> <b>捷運 (jiéyùn - MRT)</b>.",
            pinyin: "Qù Dànshuǐ? Nǐ děi zhuǎnchéng hóng xiàn jiéyùn.",
            btnText: "Naik MRT ke Tamsui (捷運)"
        },
        {
            stageName: "📍 Misi 3: Tamsui (Selesai!)",
            bgUrl: "url('https://images.unsplash.com/photo-1508873696983-2df5c920ac1c?q=80&w=600&auto=format&fit=crop')",
            speaker: "Warga Tamsui",
            text: "Restorannya dekat! Pertama ke <b>左 (zuǒ - kiri)</b>, lalu belok ke <b>右 (yòu - kanan)</b>. Selamat Ulang Tahun Xiaomei! 🎉",
            pinyin: "Xiān xiàng zuǒ, rùhòu guǎi yòu. Shēngrì kuàilè!",
            btnText: "Selesai / Main Lagi 🔄"
        }
    ];

    const vocabList = [
        { cn: "左 (zuǒ)", en: "Left (Kiri)" },
        { cn: "右 (yòu)", en: "Right (Kanan)" },
        { cn: "轉車 / 轉乘 (zhuǎnchē / zhuǎnchéng)", en: "Transfer / Ganti kendaraan" },
        { cn: "火車 (huǒchē)", en: "Train (Kereta api)" },
        { cn: "捷運 (jiéyùn)", en: "MRT / Subway" },
        { cn: "紅線 (hóng xiàn)", en: "Red Line (Jalur Merah MRT)" },
        { cn: "淡水 (Dànshuǐ)", en: "Tamsui (Nama tempat)" },
        { cn: "公車 (gōngchē)", en: "Bus" },
        { cn: "銀行 (yínháng)", en: "Bank" }
    ];

    function nextStep() {
        currentStage++;
        if(currentStage >= storyData.length) {
            currentStage = 0; // Reset ulang game
        }
        let data = storyData[currentStage];
        document.getElementById('levelBadge').innerText = data.stageName;
        document.getElementById('sceneBg').style.backgroundImage = data.bgUrl;
        document.getElementById('speakerTitle').innerText = data.speaker;
        document.getElementById('dialogueText').innerHTML = data.text;
        document.getElementById('pinyinText').innerText = data.pinyin;
        document.getElementById('choiceBtn').innerText = data.btnText;
    }

    function toggleVocab(show) {
        let modal = document.getElementById('vocabModal');
        modal.style.display = show ? 'flex' : 'none';
        if(show) {
            let container = document.getElementById('vocabListContainer');
            container.innerHTML = '';
            vocabList.forEach(v => {
                container.innerHTML += `
                    <div class="vocab-item">
                        <span class="vocab-cn">${v.cn}</span>
                        <span class="vocab-en">${v.en}</span>
                    </div>
                `;
            });
        }
    }
</script>

</body>
</html>

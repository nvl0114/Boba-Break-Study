<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Ahao's Birthday Mission</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  font-family:Arial,sans-serif;
}

#game{
  position:fixed;
  inset:0;
}

canvas{
  display:block;
  width:100%;
  height:100%;
  image-rendering:auto;
}

/* =========================
   TOP UI
========================= */

#hud{
  position:fixed;
  top:14px;
  left:14px;
  right:14px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  pointer-events:none;
  z-index:20;
}

.panel{
  background:rgba(15,15,20,.78);
  border:2px solid rgba(255,255,255,.25);
  border-radius:12px;
  padding:10px 14px;
  color:white;
  box-shadow:0 5px 20px rgba(0,0,0,.25);
  backdrop-filter:blur(5px);
}

#missionTitle{
  font-weight:bold;
  font-size:15px;
}

#mission{
  margin-top:3px;
  font-size:13px;
  opacity:.9;
}

#location{
  font-size:13px;
  font-weight:bold;
}

/* =========================
   DIALOGUE
========================= */

#dialogue{
  position:fixed;
  left:50%;
  bottom:105px;
  transform:translateX(-50%);
  width:min(760px,calc(100% - 30px));
  z-index:30;
  display:none;
}

.dialogueBox{
  background:rgba(18,18,25,.94);
  color:white;
  border:3px solid #eee;
  border-radius:15px;
  padding:18px 20px;
  box-shadow:0 8px 30px rgba(0,0,0,.45);
}

.speaker{
  color:#ffd45c;
  font-weight:bold;
  margin-bottom:7px;
  font-size:14px;
}

.dialogueText{
  font-size:20px;
  line-height:1.5;
}

.dialogueHint{
  margin-top:10px;
  font-size:12px;
  opacity:.55;
}

/* =========================
   CONTROLS
========================= */

#controls{
  position:fixed;
  left:20px;
  bottom:20px;
  z-index:40;
  display:grid;
  grid-template-columns:58px 58px 58px;
  grid-template-rows:58px 58px;
  gap:6px;
}

.ctrl{
  border:2px solid rgba(255,255,255,.45);
  background:rgba(20,20,25,.72);
  color:white;
  border-radius:12px;
  font-size:24px;
  display:flex;
  align-items:center;
  justify-content:center;
  user-select:none;
  touch-action:none;
}

.ctrl:active{
  background:rgba(255,255,255,.3);
}

.up{grid-column:2}
.left{grid-column:1;grid-row:2}
.down{grid-column:2;grid-row:2}
.right{grid-column:3;grid-row:2}

/* camera buttons */

#cameraControls{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:40;
  display:flex;
  gap:7px;
}

.cam{
  width:55px;
  height:55px;
  border-radius:12px;
  border:2px solid rgba(255,255,255,.4);
  background:rgba(20,20,25,.72);
  color:white;
  font-size:18px;
}

/* =========================
   START SCREEN
========================= */

#startScreen{
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 50% 40%,#526b82,#151922 70%);
  z-index:100;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:20px;
}

.startInner{
  max-width:620px;
}

.logo{
  font-size:clamp(35px,8vw,70px);
  font-weight:900;
  letter-spacing:-3px;
  text-shadow:5px 5px 0 #202530;
}

.subtitle{
  margin-top:8px;
  font-size:17px;
  opacity:.8;
}

.story{
  margin:28px auto;
  line-height:1.7;
  max-width:540px;
  color:#ddd;
}

#startBtn{
  border:0;
  background:#ffd45c;
  color:#27220f;
  padding:16px 32px;
  border-radius:12px;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 5px 0 #a98420;
}

#startBtn:active{
  transform:translateY(4px);
  box-shadow:0 1px 0 #a98420;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){
  #hud{
    top:8px;
    left:8px;
    right:8px;
  }

  .panel{
    padding:7px 9px;
  }

  #missionTitle{
    font-size:12px;
  }

  #mission,
  #location{
    font-size:11px;
  }

  #dialogue{
    bottom:165px;
  }

  .dialogueText{
    font-size:17px;
  }

  #controls{
    left:10px;
    bottom:10px;
  }

  #cameraControls{
    right:10px;
    bottom:10px;
  }
}
</style>
</head>

<body>

<div id="game"></div>

<div id="hud">
  <div class="panel">
    <div id="missionTitle">🎂 Ahao's Birthday Mission</div>
    <div id="mission">離開百貨公司</div>
  </div>

  <div class="panel">
    <div id="location">百貨公司</div>
  </div>
</div>

<div id="dialogue">
  <div class="dialogueBox">
    <div class="speaker" id="speaker">路人</div>
    <div class="dialogueText" id="dialogueText"></div>
    <div class="dialogueHint">按 ↑ 繼續</div>
  </div>
</div>

<div id="controls">
  <div class="ctrl up" data-key="ArrowUp">▲</div>
  <div class="ctrl left" data-key="ArrowLeft">◀</div>
  <div class="ctrl down" data-key="ArrowDown">▼</div>
  <div class="ctrl right" data-key="ArrowRight">▶</div>
</div>

<div id="cameraControls">
  <button class="cam" id="camLeft">↶</button>
  <button class="cam" id="camRight">↷</button>
</div>

<div id="startScreen">
  <div class="startInner">
    <div class="logo">AHAO</div>
    <div class="subtitle">A Birthday Mission</div>

    <div class="story">
      今天是小美的生日。<br>
      阿豪要去買生日禮物，晚上還要去餐廳跟大家一起吃飯。<br><br>
      可是他的手機沒電了。<br>
      他只能問路人，自己找到目的地。
    </div>

    <button id="startBtn">開始遊戲</button>

    <div style="margin-top:20px;font-size:12px;opacity:.6">
      Arrow Keys / Touch Controls
    </div>
  </div>
</div>

<script type="module">

import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

/* ============================================================
   BASIC SETUP
============================================================ */

const game = document.getElementById("game");

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x8fb0c5);
scene.fog = new THREE.Fog(0x8fb0c5,35,95);

const camera = new THREE.PerspectiveCamera(
  55,
  innerWidth / innerHeight,
  .1,
  250
);

const renderer = new THREE.WebGLRenderer({
  antialias:false
});

renderer.setPixelRatio(1);
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

game.appendChild(renderer.domElement);

/* ============================================================
   LIGHT
============================================================ */

const hemi = new THREE.HemisphereLight(
  0xbddcff,
  0x4a4a4a,
  1.6
);

scene.add(hemi);

const sun = new THREE.DirectionalLight(
  0xffe4ba,
  2.0
);

sun.position.set(-30,60,30);
sun.castShadow = true;
sun.shadow.mapSize.width = 1024;
sun.shadow.mapSize.height = 1024;

scene.add(sun);

/* ============================================================
   MATERIAL HELPERS
============================================================ */

function mat(color){
  return new THREE.MeshLambertMaterial({
    color,
    flatShading:true
  });
}

const M = {
  road:mat(0x44464d),
  sidewalk:mat(0xaaa8a0),
  grass:mat(0x667a51),
  wall:mat(0xb5a58f),
  roof:mat(0x5b4540),
  glass:mat(0x6d9db1),
  white:mat(0xf1eee2),
  red:mat(0xc94c43),
  blue:mat(0x4777a7),
  green:mat(0x4d8052),
  yellow:mat(0xe0b84f),
  black:mat(0x202126),
  skin:mat(0xe2ae87),
  hair:mat(0x342b2a),
  shirt:mat(0x4f78a8),
  pants:mat(0x333e61),
  shoe:mat(0x252525),
  train:mat(0xd8d8d0),
  metro:mat(0xd45b48),
  bus:mat(0x4c78a7)
};

/* ============================================================
   GLOBAL WORLD
============================================================ */

let world = new THREE.Group();
scene.add(world);

let player;
let playerGroup;

let keys = {};

let currentScene = 0;
let sceneObjects = [];

let dialogueOpen = false;
let dialogueIndex = 0;
let currentDialogue = [];

let cameraAngle = 0;

const clock = new THREE.Clock();

/* ============================================================
   UI
============================================================ */

const missionEl = document.getElementById("mission");
const locationEl = document.getElementById("location");

function updateUI(){

  const s = scenes[currentScene];

  missionEl.textContent = s.mission;
  locationEl.textContent = s.location;
}

/* ============================================================
   BOX CREATOR
============================================================ */

function box(
  x,y,z,
  w,h,d,
  material,
  parent=world
){

  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),
    material
  );

  mesh.position.set(x,y,z);

  mesh.castShadow=true;
  mesh.receiveShadow=true;

  parent.add(mesh);

  sceneObjects.push(mesh);

  return mesh;
}

/* ============================================================
   CYLINDER
============================================================ */

function cyl(
  x,y,z,
  r,h,
  material,
  parent=world
){

  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(
      r,r,h,8
    ),
    material
  );

  mesh.position.set(x,y,z);

  mesh.castShadow=true;
  mesh.receiveShadow=true;

  parent.add(mesh);

  sceneObjects.push(mesh);

  return mesh;
}

/* ============================================================
   TREE
============================================================ */

function tree(x,z,parent=world){

  box(
    x,1.7,z,
    .45,3.4,.45,
    M.roof,
    parent
  );

  cyl(
    x,4,z,
    1.5,2.7,
    M.green,
    parent
  );
}

/* ============================================================
   STREET
============================================================ */

function street(length=90){

  box(
    0,-.15,0,
    10,.3,length,
    M.road
  );

  box(
    -7,.05,0,
    3,.4,length,
    M.sidewalk
  );

  box(
    7,.05,0,
    3,.4,length,
    M.sidewalk
  );

  for(let z=-length/2;z<length/2;z+=7){

    box(
      0,.02,z,
      .25,.04,3,
      M.yellow
    );
  }
}

/* ============================================================
   BUILDING
============================================================ */

function building(
  x,z,
  w,h,d,
  wallMaterial=M.wall
){

  box(
    x,h/2,z,
    w,h,d,
    wallMaterial
  );

  const floors=Math.max(1,Math.floor(h/3));

  for(let f=0;f<floors;f++){

    for(let xx=x-w/2+1.2;xx<x+w/2-1;xx+=2.3){

      box(
        xx,
        1.5+f*3,
        z-d/2-.04,
        1.1,
        1.25,
        .08,
        M.glass
      );

    }
  }
}

/* ============================================================
   SIGN
============================================================ */

function sign(
  text,
  x,y,z,
  color=M.red,
  rotationY=0
){

  const canvas=document.createElement("canvas");
  canvas.width=512;
  canvas.height=128;

  const ctx=canvas.getContext("2d");

  ctx.fillStyle="#ffffff";
  ctx.fillRect(0,0,512,128);

  ctx.fillStyle=
    "#" + color.color.getHexString();

  ctx.font="bold 55px Arial";
  ctx.textAlign="center";
  ctx.textBaseline="middle";

  ctx.fillText(text,256,64);

  const texture=
    new THREE.CanvasTexture(canvas);

  const mesh=new THREE.Mesh(
    new THREE.PlaneGeometry(4,1),
    new THREE.MeshBasicMaterial({
      map:texture,
      transparent:true
    })
  );

  mesh.position.set(x,y,z);
  mesh.rotation.y=rotationY;

  world.add(mesh);

  return mesh;
}

/* ============================================================
   AHAO CHARACTER
============================================================ */

function createAhao(){

  const g=new THREE.Group();

  const body=new THREE.Group();

  g.add(body);

  /* torso */

  const torso=box(
    0,1.35,0,
    .9,1.45,.55,
    M.shirt,
    body
  );

  /* head */

  const head=box(
    0,2.55,0,
    .75,.75,.7,
    M.skin,
    body
  );

  /* hair */

  box(
    0,2.95,-.02,
    .78,.25,.72,
    M.hair,
    body
  );

  /* arms */

  const armL=box(
    -.58,1.4,0,
    .25,1.15,.3,
    M.skin,
    body
  );

  const armR=box(
    .58,1.4,0,
    .25,1.15,.3,
    M.skin,
    body
  );

  /* pants */

  const legL=box(
    -.24,.45,0,
    .32,.9,.42,
    M.pants,
    body
  );

  const legR=box(
    .24,.45,0,
    .32,.9,.42,
    M.pants,
    body
  );

  /* shoes */

  box(
    -.24,-.02,-.08,
    .4,.22,.55,
    M.shoe,
    body
  );

  box(
    .24,-.02,-.08,
    .4,.22,.55,
    M.shoe,
    body
  );

  g.userData={
    armL,
    armR,
    legL,
    legR
  };

  return g;
}

/* ============================================================
   NPC
============================================================ */

function npc(
  x,z,
  shirt=M.red
){

  const g=new THREE.Group();

  box(
    0,1.3,0,
    .75,1.35,.5,
    shirt,
    g
  );

  box(
    0,2.35,0,
    .62,.65,.62,
    M.skin,
    g
  );

  box(
    0,2.68,0,
    .65,.2,.62,
    M.hair,
    g
  );

  box(
    -.47,1.35,0,
    .22,1,.25,
    M.skin,
    g
  );

  box(
    .47,1.35,0,
    .22,1,.25,
    M.skin,
    g
  );

  box(
    -.2,.45,0,
    .3,.8,.35,
    M.pants,
    g
  );

  box(
    .2,.45,0,
    .3,.8,.35,
    M.pants,
    g
  );

  g.position.set(x,0,z);

  world.add(g);

  return g;
}

/* ============================================================
   SCENE CLEAR
============================================================ */

function clearWorld(){

  while(world.children.length){

    world.remove(world.children[0]);

  }

  sceneObjects=[];

}

/* ============================================================
   PLAYER RESET
============================================================ */

function resetPlayer(x=0,z=25){

  playerGroup.position.set(x,0,z);

  playerGroup.rotation.y=0;

}

/* ============================================================
   ENVIRONMENT SCENES
============================================================ */

const scenes=[

/* 0 */

{
 location:"百貨公司",
 mission:"離開百貨公司，往前走。",
 dialogue:[
  ["路人","一直走，先離開百貨公司。"]
 ],
 build(){

  box(0,5,-35,28,10,8,M.wall);

  box(
    0,2,-30.8,
    5,4,.3,
    M.glass
  );

  sign(
    "百貨公司",
    0,7,-30.7,
    M.red
  );

  street(100);

  building(-13,-10,8,12,14,M.wall);
  building(13,-5,8,10,14,M.blue);

  tree(-11,8);
  tree(11,18);

 }
},

/* 1 */

{
 location:"城市街道",
 mission:"看到便利商店以後往左轉。",
 dialogue:[
  ["路人","一直走，看到便利商店以後往左轉。"]
 ],
 build(){

  street(100);

  building(-13,-12,9,15,16,M.wall);
  building(13,-8,9,12,16,M.blue);

  building(-13,18,9,9,16,M.red);
  building(13,25,9,16,16,M.wall);

  tree(-10,5);
  tree(10,12);

  /* convenience store */

  box(
    12,2,38,
    9,4,8,
    M.white
  );

  box(
    12,2,33.9,
    8,3,.15,
    M.glass
  );

  sign(
    "便利商店",
    12,4.3,33.8,
    M.green
  );

 }
},

/* 2 */

{
 location:"便利商店",
 mission:"往左轉。",
 dialogue:[
  ["路人","看到便利商店以後，往左轉。"]
 ],
 build(){

  /* L shaped road */

  box(0,-.15,0,10,.3,80,M.road);

  box(
    -30,-.15,38,
    60,.3,10,
    M.road
  );

  box(-7,.05,0,3,.4,80,M.sidewalk);
  box(7,.05,0,3,.4,80,M.sidewalk);

  box(
    -30,.05,31,
    60,.4,3,
    M.sidewalk
  );

  box(
    -30,.05,45,
    60,.4,3,
    M.sidewalk
  );

  /* store */

  box(
    14,2,25,
    10,4,10,
    M.white
  );

  sign(
    "便利商店",
    14,4.4,19.8,
    M.green
  );

  /* traffic */

  box(
    -10,2,-15,
    5,4,8,
    M.red
  );

  box(
    10,2,-25,
    5,4,8,
    M.blue
  );

  tree(-12,15);

 }
},

/* 3 */

{
 location:"城市街道",
 mission:"一直走，車站就在前面。",
 dialogue:[
  ["路人","往前走，車站就在前面。"]
 ],
 build(){

  street(110);

  building(-13,-5,9,12,16,M.wall);
  building(13,-10,9,14,16,M.blue);

  tree(-11,10);
  tree(11,20);

  /* station visible ahead */

  box(
    0,5,-38,
    25,10,7,
    M.white
  );

  sign(
    "車站",
    0,8,-34.4,

  );

 }
},

/* 4 */

{

  ["站務員","往前走，進入車站。"]
 ],

  /* station entrance */

    -5,3,-19.2,
    6,6,.3,

  );

    5,3,-19.2,
    6,6,.3,
    M.glass
  );

    "車站",

  );

  /* ticket gates */

  for(let x=-7;x<=7;x+=3.5){

    );

  /* platform */

  box(
    -14,-.1,10,
    5,.2,60,
    M.sidewalk
  );

  box(
    14,-.1,10,
    5,.2,60,
    M.sidewalk
  );

 }
},

/* 5 */

{
 location:"火車上",
 mission:"搭火車到台北車站。",
 dialogue:[
  ["廣播","下一站：台北車站。"]
 ],
 build(){

  /* train floor */

  box(
    0,-.3,0,

    M.train
  );

  /* walls */

  box(
    -4,2,0,

 }
},

/* 6 */

{
 location:"台北車站",
 mission:"往左走，找到紅色標誌。",

  ["旅客","往左走，然後一直走。"]
 ],
 build(){

  /* huge station hall */

  box(
    0,4,-10,
    35,8,25,
    M.wall
  );

  /* floor */

  box(
    0,-.3,20,
    50,.4,80,
    M.sidewalk
  );

  /* pillars */

  for(let x=-15;x<=15;x+=7){

 }
},

/* 7 */

{

 ],
 build(){

    0,-.2,0,

    M.sidewalk
  );

  for(let x=-20;x<=20;x+=8){

    box(
      x,4,-15,
      1.2,8,1.2,
      M.white
    );

  }

/* ============================================================
   SCENE BUILD
============================================================ */

function loadScene(index){

  currentScene=index;

  clearWorld();

  const s=scenes[index];

  s.build();

  resetPlayer();

  updateUI();

  if(index===15){

    showDialogue();

  }else{

    currentDialogue=s.dialogue;
    dialogueIndex=0;
    showDialogue();

  }

}

/* ============================================================
   DIALOGUE
============================================================ */

function showDialogue(){

  if(!currentDialogue || !currentDialogue.length)
    return;

  dialogueOpen=true;

  document.getElementById("dialogue").style.display="block";

  const d=currentDialogue[dialogueIndex];

  document.getElementById("speaker").textContent=d[0];
  document.getElementById("dialogueText").textContent=d[1];

}

function nextDialogue(){

  if(!dialogueOpen)
    return;

  dialogueIndex++;

  if(dialogueIndex>=currentDialogue.length){

    dialogueOpen=false;

    document.getElementById("dialogue").style.display="none";

    return;

  }

  showDialogue();

}

/* ============================================================
   PLAYER
============================================================ */

playerGroup=new THREE.Group();

player=createAhao();

playerGroup.add(player);

world.add(playerGroup);

/* ============================================================
   MOVEMENT
============================================================ */

function movePlayer(dt){

  if(dialogueOpen) return;

  let dx=0;
  let dz=0;

  if(keys.ArrowUp) dz-=1;
  if(keys.ArrowDown) dz+=1;
  if(keys.ArrowLeft) dx-=1;
  if(keys.ArrowRight) dx+=1;

  if(dx===0 && dz===0){

    animatePlayer(false);

    return;
  }

  const len=Math.hypot(dx,dz);

  dx/=len;
  dz/=len;

  const speed=8;

  playerGroup.position.x += dx*speed*dt;
  playerGroup.position.z += dz*speed*dt;

  /* face direction */

  playerGroup.rotation.y=
    Math.atan2(dx,dz);

  animatePlayer(true);

  checkSceneProgress();

}

/* ============================================================
   WALK ANIMATION
============================================================ */

let walkTime=0;

function animatePlayer(walking){

  if(!walking){

    player.userData.armL.rotation.x*=.8;
    player.userData.armR.rotation.x*=.8;
    player.userData.legL.rotation.x*=.8;
    player.userData.legR.rotation.x*=.8;

    return;
  }

  walkTime+=.22;

  const swing=Math.sin(walkTime)*.55;

  player.userData.armL.rotation.x=swing;
  player.userData.armR.rotation.x=-swing;

  player.userData.legL.rotation.x=-swing;
  player.userData.legR.rotation.x=swing;

}

/* ============================================================
   SCENE PROGRESS
============================================================ */

function checkSceneProgress(){

  const p=playerGroup.position;

  /* forward transition */

  if(currentScene===0 && p.z<-25){
    loadScene(1);
  }

  else if(currentScene===1 && p.z>30 && p.x>6){
    loadScene(2);
  }

  else if(currentScene===2 && p.x<-20){
    loadScene(3);
  }

  else if(currentScene===3 && p.z<-30){
    loadScene(4);
  }

  else if(currentScene===4 && p.z<-18){
    loadScene(5);
  }

  else if(currentScene===5 && p.z<-28){
    loadScene(6);
  }

  else if(currentScene===6 && p.x>10){
    loadScene(7);
  }

  else if(currentScene===7 && p.x>18){
    loadScene(8);
  }

  else if(currentScene===8 && p.z<-30){
    loadScene(9);
  }

  else if(currentScene===9 && p.z>35){
    loadScene(10);
  }

  else if(currentScene===10 && p.x>20){
    loadScene(11);
  }

  else if(currentScene===11 && p.z<-28){
    loadScene(12);
  }

  else if(currentScene===12 && p.x>18){
    loadScene(13);
  }

  else if(currentScene===13 && p.z<-28){
    loadScene(14);
  }

  else if(currentScene===14 && p.x<-8){
    loadScene(15);
  }

}

/* ============================================================
   CAMERA
============================================================ */

function updateCamera(){

  const target=playerGroup.position.clone();

  const distance=10;

  const angle=cameraAngle;

  const camX=
    target.x+
    Math.sin(angle)*distance;

  const camZ=
    target.z+
    Math.cos(angle)*distance;

  camera.position.x +=
    (camX-camera.position.x)*.1;

  camera.position.y +=
    (7-camera.position.y)*.1;

  camera.position.z +=
    (camZ-camera.position.z)*.1;

  const look=
    target.clone();

  look.y+=1.4;

  camera.lookAt(look);

}

/* ============================================================
   KEYBOARD
============================================================ */

window.addEventListener("keydown",e=>{

  if([
    "ArrowUp",
    "ArrowDown",
    "ArrowLeft",
    "ArrowRight"
  ].includes(e.key)){

    e.preventDefault();

    keys[e.key]=true;

  }

  if(e.key==="Enter" || e.key===" "){

    nextDialogue();

  }

});

window.addEventListener("keyup",e=>{

  keys[e.key]=false;

});

/* ============================================================
   TOUCH
============================================================ */

document.querySelectorAll(".ctrl")
.forEach(btn=>{

  const key=btn.dataset.key;

  btn.addEventListener(
    "pointerdown",
    e=>{
      e.preventDefault();
      keys[key]=true;
    }
  );

  btn.addEventListener(
    "pointerup",
    e=>{
      e.preventDefault();
      keys[key]=false;
    }
  );

  btn.addEventListener(
    "pointercancel",
    ()=>{
      keys[key]=false;
    }
  );

  btn.addEventListener(
    "pointerleave",
    ()=>{
      keys[key]=false;
    }
  );

});

/* ============================================================
   CAMERA BUTTONS
============================================================ */

document.getElementById("camLeft")
.addEventListener("pointerdown",()=>{
  cameraAngle-=.3;
});

document.getElementById("camRight")
.addEventListener("pointerdown",()=>{
  cameraAngle+=.3;
});

/* ============================================================
   START
============================================================ */

document.getElementById("startBtn")
.addEventListener("click",()=>{

  document.getElementById("startScreen").style.display="none";

  loadScene(0);

});

/* ============================================================
   RESIZE
============================================================ */

window.addEventListener("resize",()=>{

  camera.aspect=
    innerWidth/innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    innerWidth,
    innerHeight
  );

});

/* ============================================================
   LOOP
============================================================ */

function animate(){

  requestAnimationFrame(animate);

  const dt=
    Math.min(clock.getDelta(),.05);

  movePlayer(dt);

  updateCamera();

  renderer.render(
    scene,
    camera
  );

}

animate();

html,body{

canvas{

/* =========================
   GAME UI
========================= */

#hud{
    position:fixed;
    top:12px;
    left:50%;
    transform:translateX(-50%);
    width:min(94%,760px);
    z-index:20;
    pointer-events:none;
}

#topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

#title{
    background:rgba(255,250,242,.95);
    border:3px solid #5b4037;
    border-radius:16px;
    padding:10px 15px;
    color:#5b4037;
    font-weight:900;
    font-size:clamp(15px,4vw,21px);
    box-shadow:0 5px 15px rgba(0,0,0,.18);
}

#vocabBtn{
    pointer-events:auto;
    border:3px solid #5b4037;
    background:#fff;
    border-radius:13px;
    padding:10px 13px;
    font-weight:bold;
    color:#5b4037;
    cursor:pointer;
}

#objectiveBox{
    margin-top:9px;
    background:rgba(255,255,255,.94);
    border-left:6px solid #ff8da8;
    border-radius:14px;
    padding:11px 14px;
    box-shadow:0 5px 15px rgba(0,0,0,.14);
}

#objectiveLabel{
    font-size:10px;
    color:#999;
    font-weight:bold;
    letter-spacing:1.5px;
}

#objectiveText{
    margin-top:4px;
    color:#49332d;
    font-weight:bold;
    font-size:clamp(13px,3.5vw,16px);
}

/* =========================
   MESSAGE
========================= */

#message{
    position:fixed;
    top:135px;
    left:50%;
    transform:translateX(-50%);
    z-index:40;
    max-width:85%;
    padding:10px 18px;
    background:rgba(48,36,32,.92);
    color:white;
    border-radius:999px;
    text-align:center;
    font-weight:bold;
    display:none;
}

/* =========================
   CROSSHAIR
========================= */

#crosshair{
    position:fixed;
    left:50%;
    top:50%;
    width:16px;
    height:16px;
    transform:translate(-50%,-50%);
    z-index:10;
    pointer-events:none;
}

#crosshair:before,
#crosshair:after{
    content:"";
    position:absolute;
    background:white;
    box-shadow:0 0 3px #000;
}

#crosshair:before{
    width:16px;
    height:2px;
    top:7px;
}

#crosshair:after{
    width:2px;
    height:16px;
    left:7px;
}

/* =========================
   INTERACTION HINT
========================= */

#interactionHint{
    position:fixed;
    left:50%;
    bottom:145px;
    transform:translateX(-50%);
    z-index:35;
    display:none;
    padding:10px 16px;
    background:rgba(255,255,255,.95);
    color:#513b33;
    border:3px solid #5b4037;
    border-radius:15px;
    text-align:center;
    font-weight:bold;
    box-shadow:0 4px 14px rgba(0,0,0,.2);
}

/* =========================
   CONTROLS
========================= */

#controls{
    position:fixed;
    bottom:16px;
    left:50%;
    transform:translateX(-50%);
    width:min(95%,680px);
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    z-index:40;
}

#movePad{
    display:grid;
    grid-template-columns:repeat(3,58px);
    grid-template-rows:repeat(2,55px);
    gap:6px;
}

.ctrl{
    border:3px solid #5b4037;
    background:rgba(255,255,255,.95);
    color:#5b4037;
    border-radius:14px;
    font-size:20px;
    font-weight:bold;
    touch-action:none;
    cursor:pointer;
}

.ctrl:active{
    background:#ffe1e8;
    transform:scale(.95);
}

#forward{
    grid-column:2;
}

#left{
    grid-column:1;
    grid-row:2;
}

#backward{
    grid-column:2;
    grid-row:2;
}

#right{
    grid-column:3;
    grid-row:2;
}

#interactBtn{
    width:105px;
    height:105px;
    border-radius:50%;
    border:4px solid #5b4037;
    background:#ff8fab;
    color:#51362f;
    font-weight:900;
    font-size:14px;
    cursor:pointer;
    box-shadow:0 5px 0 #c9687d;
}

#interactBtn:active{
    transform:translateY(4px);

}

========================= */

#dialogueOverlay{

#chinese{

#nextBtn{

    background:#5b4037;

/* =========================
   STORY
========================= */

#storyOverlay{

#storyText{

#startBtn{

#vocabModal{

}

import * as THREE from "three";

/* =========================================
   DOM
========================================= */

const objectiveText=document.getElementById("objectiveText");
const message=document.getElementById("message");
const hint=document.getElementById("interactionHint");

const dialogueOverlay=document.getElementById("dialogueOverlay");
const speakerEl=document.getElementById("speaker");
const chineseEl=document.getElementById("chinese");
const pinyinEl=document.getElementById("pinyin");
const nextBtn=document.getElementById("nextBtn");

/* =========================================
   THREE
========================================= */

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9edcff);
scene.fog=new THREE.Fog(0x9edcff,45,180);

const camera=new THREE.PerspectiveCamera(
    70,
    innerWidth/innerHeight,
    0.1,
    500
);

const renderer=new THREE.WebGLRenderer({
    antialias:true
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;

document.body.appendChild(renderer.domElement);

const hemi=new THREE.HemisphereLight(
    0xffffff,
    0x7aa85e,
    2.2
);

scene.add(hemi);

const sun=new THREE.DirectionalLight(
    0xffffff,
    2
);

sun.position.set(40,70,30);
scene.add(sun);

/* =========================================
   MATERIALS
========================================= */

const mat={

    grass:new THREE.MeshStandardMaterial({
        color:0x89c96d
    }),

    road:new THREE.MeshStandardMaterial({
        color:0x64676d
    }),

    wall:new THREE.MeshStandardMaterial({
        color:0xe7c5a0
    }),

    pink:new THREE.MeshStandardMaterial({
        color:0xff9bb0
    }),

    yellow:new THREE.MeshStandardMaterial({
        color:0xffd05d
    }),

    blue:new THREE.MeshStandardMaterial({
        color:0x7ac9ed
    }),

    white:new THREE.MeshStandardMaterial({
        color:0xffffff
    }),

    roof:new THREE.MeshStandardMaterial({
        color:0xba7064
    })

};

/* =========================================
   GAME DATA
========================================= */

let interactables=[];
let blocked=[];

let stage=1;
let paused=false;

const player={
    x:0,
    z:30,
    angle:Math.PI,
    speed:0.23,
    turnSpeed:0.032
};

const keys={
    forward:false,
    backward:false,
    left:false,
    right:false
};

/* =========================================
   HELPERS
========================================= */

function addBox(x,y,z,w,h,d,material){

    const mesh=new THREE.Mesh(
        new THREE.BoxGeometry(w,h,d),
        material
    );

    mesh.position.set(x,y,z);
    scene.add(mesh);

    return mesh;
}

function addRoad(x,z,w,d){

    return addBox(
        x,0,z,
        w,0.1,d,
        mat.road
    );
}

function addBlocked(x,z,w,d){

    blocked.push({
        minX:x-w/2,
        maxX:x+w/2,
        minZ:z-d/2,
        maxZ:z+d/2
    });
}

function isBlocked(x,z){

    for(const b of blocked){

        if(
            x>b.minX &&
            x<b.maxX &&
            z>b.minZ &&
            z<b.maxZ
        ){
            return true;
        }
    }

    return false;
}

/* =========================================
   TEXT SPRITE
========================================= */

function createSign(text){

    const canvas=document.createElement("canvas");

    canvas.width=512;
    canvas.height=150;

    const ctx=canvas.getContext("2d");

    ctx.fillStyle="#ffffff";
    ctx.fillRect(0,0,512,150);

    ctx.strokeStyle="#5b4037";
    ctx.lineWidth=9;
    ctx.strokeRect(5,5,502,140);

    ctx.fillStyle="#49332d";
    ctx.font="bold 56px Microsoft JhengHei";
    ctx.textAlign="center";
    ctx.textBaseline="middle";

    ctx.fillText(text,256,75);

    const texture=new THREE.CanvasTexture(canvas);

    const sprite=new THREE.Sprite(
        new THREE.SpriteMaterial({
            map:texture
        })
    );

    sprite.scale.set(10,3,1);

    return sprite;
}

function sign(text,x,y,z){

    const s=createSign(text);
    s.position.set(x,y,z);

    scene.add(s);

    return s;
}

/* =========================================
   BUILDING
========================================= */

function building(name,x,z,w=12,d=10,material=mat.wall){

    addBox(
        x,4,z,
        w,8,d,
        material
    );

    addBox(
        x,8.5,z,
        w+1,1,d+1,
        mat.roof
    );

    sign(
        name,
        x,
        10,
        z+d/2+1
    );

    addBlocked(
        x,z,w,d
    );
}

/* =========================================
   NPC
========================================= */

function npc(name,x,z,type){

    const group=new THREE.Group();

    const body=new THREE.Mesh(
        new THREE.BoxGeometry(1.3,2.2,.8),
        mat.blue
    );

    body.position.y=1.2;

    const head=new THREE.Mesh(
        new THREE.SphereGeometry(.72,14,14),
        new THREE.MeshStandardMaterial({
            color:0xf2b98f
        })
    );

    head.position.y=3.1;

    group.add(body);
    group.add(head);

    group.position.set(x,0,z);

    scene.add(group);

    sign(name,x,5,z);

    interactables.push({
        object:group,
        type,
        range:5
    });
}

/* =========================================
   INTERACTIVE MARKER
========================================= */

function interactivePoint(name,x,z,type){

    const marker=addBox(
        x,
        1.2,
        z,
        3,
        2.4,
        .7,
        mat.yellow
    );

    sign(
        name,
        x,
        4,
        z
    );

    interactables.push({
        object:marker,
        type,
        range:6
    });

    return marker;
}

/* =========================================
   CLEAR WORLD
========================================= */

function clearWorld(){

    while(scene.children.length){
        scene.remove(scene.children[0]);
    }

    scene.add(hemi);
    scene.add(sun);

    interactables=[];
    blocked=[];

    addBox(
        0,-.5,0,
        300,1,300,
        mat.grass
    );
}

/* =========================================
   CAMERA
========================================= */

function updateCamera(){

    camera.position.set(
        player.x,
        2.2,
        player.z
    );

    camera.rotation.set(
        0,
        player.angle,
        0
    );
}

/* =========================================
   AREA 1 — GIFT SHOP
========================================= */

function loadGiftArea(){

    clearWorld();

    addRoad(0,20,18,100);

    building(
        "禮物店",
        -15,
        15,
        13,
        12,
        mat.pink
    );

    building(
        "咖啡店",
        15,
        0,
        13,
        12,
        mat.yellow
    );

    npc(
        "店員",
        -7,
        15,
        "gift"
    );

    npc(
        "路人",
        0,
        -8,
        "ask105"
    );

    player.x=0;
    player.z=35;
    player.angle=Math.PI;

    setObjective(
        "先去禮物店買小美的生日禮物。"
    );
}

/* =========================================
   AREA 2 — 105 BUS
========================================= */

function load105Area(){

    clearWorld();

    addRoad(0,0,18,110);

    interactivePoint(
        "105號公車",
        0,
        0,
        "bus105"
    );

    player.x=0;
    player.z=30;
    player.angle=Math.PI;

    setObjective(
        "找到105號公車並搭車。"
    );
}

/* =========================================
   AREA 3 — BANK TO GR
========================================= */

function loadBankArea(){

    clearWorld();

    /*
      ROUTE:

      START
        ↓
      一直走
        ↓
      便利商店
        ↓
      RIGHT TURN
        →
        →
       GR STOP
    */

    /* MAIN ROAD */

    addRoad(
        0,
        25,
        14,
        90
    );

    /* RIGHT TURN ROAD */

    addRoad(
        25,
        -10,
        50,
        14
    );

    /* LANDMARK */

    building(
        "便利商店",
        -9,
        2,
        10,
        10,
        mat.yellow
    );

    /*
      Bank is beside
      starting area
    */

    building(
        "銀行",
        10,
        25,
        12,
        12,
        mat.white
    );

    /*
      Building after turn.
      Placed away from road.
    */

    building(
        "書店",
        25,
        8,
        14,
        10,
        mat.wall
    );

    /*
      NPC at bank
    */

    npc(
        "路人",
        -3,
        18,
        "askGR"
    );

    /*
      GR STOP
      At end of right road.
    */

    interactivePoint(
        "GR公車站",
        45,
        -10,
        "grStop"
    );

    player.x=0;
    player.z=38;
    player.angle=Math.PI;

    setObjective(
        "在銀行附近問路人GR公車站怎麼走。"

/* =========================================
   DIALOGUE
========================================= */

let dialogue=[];
let dialogueIndex=0;
let dialogueCallback=null;

function startDialogue(lines,callback=null){

    dialogue=lines;
    dialogueIndex=0;
    dialogueCallback=callback;

    paused=true;

    dialogueOverlay.style.display="flex";

    showDialogue();
}

function showDialogue(){

    const line=dialogue[dialogueIndex];

    speakerEl.textContent=line.speaker;
    chineseEl.textContent=line.chinese;
    pinyinEl.textContent=line.pinyin;

    nextBtn.textContent=
        dialogueIndex===dialogue.length-1
        ?"好的"
        :"繼續";
}

nextBtn.onclick=()=>{

    dialogueIndex++;

    if(dialogueIndex>=dialogue.length){

        dialogueOverlay.style.display="none";
        paused=false;

        if(dialogueCallback){
            dialogueCallback();
        }

        return;
    }

    showDialogue();
};

/* =========================================
   NEAREST OBJECT
========================================= */

function getNearest(){

    let nearest=null;
    let nearestDistance=Infinity;

    for(const item of interactables){

        const p=item.object.position;

        const dx=player.x-p.x;
        const dz=player.z-p.z;

        const distance=Math.sqrt(
            dx*dx+dz*dz
        );

        if(
            distance<item.range &&
            distance<nearestDistance
        ){

            nearest=item;
            nearestDistance=distance;
        }
    }

    return nearest;
}

function updateHint(){

        hint.style.display="block";

        hint.textContent=
            "💬 點擊 INTERACT";

    }else{

        hint.style.display="none";

}

/* =========================================
   MOVEMENT
========================================= */

function updatePlayer(){

    if(paused)return;

    if(keys.left){
        player.angle+=player.turnSpeed;
    }

    if(keys.right){
        player.angle-=player.turnSpeed;
    }

    let move=0;

    if(keys.forward){
        move=player.speed;
    }

    if(keys.backward){
        move=-player.speed;
    }

    if(move!==0){

        const nx=
            player.x+
            Math.sin(player.angle)*move;

        const nz=
            player.z+
            Math.cos(player.angle)*move;

        if(!isBlocked(nx,player.z)){
            player.x=nx;
        }

        if(!isBlocked(player.x,nz)){
            player.z=nz;
        }
    }

    updateCamera();
}

/* =========================================
   INPUT
========================================= */

function bindHold(id,key){

    const el=document.getElementById(id);

    el.addEventListener(
        "pointerdown",
        e=>{
            e.preventDefault();
            keys[key]=true;
        }
    );

    [
        "pointerup",
        "pointerleave",
        "pointercancel"
    ].forEach(event=>{

        el.addEventListener(
            event,
            ()=>keys[key]=false
        );
    });
}

bindHold("forward","forward");
bindHold("backward","backward");
bindHold("left","left");
bindHold("right","right");

window.addEventListener("keydown",e=>{

    if(e.key==="ArrowUp")keys.forward=true;
    if(e.key==="ArrowDown")keys.backward=true;
    if(e.key==="ArrowLeft")keys.left=true;
    if(e.key==="ArrowRight")keys.right=true;

    if(
        e.key==="e"||
        e.key==="E"||
        e.key===" "
    ){
        interact();
    }
});

window.addEventListener("keyup",e=>{

    if(e.key==="ArrowUp")keys.forward=false;
    if(e.key==="ArrowDown")keys.backward=false;
    if(e.key==="ArrowLeft")keys.left=false;
    if(e.key==="ArrowRight")keys.right=false;
});

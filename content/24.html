<script type="module">
import * as THREE from "three";
/* ===================================================== THREE SETUP ===================================================== */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fc9e8);
const camera = new THREE.PerspectiveCamera(
70, innerWidth / innerHeight, 0.1, 2000
);
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize( innerWidth, innerHeight );
renderer.setPixelRatio( Math.min(devicePixelRatio,2) );
document.body.appendChild( renderer.domElement );
/* ===================================================== LIGHTS ===================================================== */
const ambient = new THREE.HemisphereLight(
0xffffff, 0x667788, 2
);
scene.add(ambient);
const sun = new THREE.DirectionalLight(
0xffffff, 2
);
sun.position.set( 100, 200, 100 );
scene.add(sun);
/* ===================================================== PLAYER ===================================================== */
const player = {
position: new THREE.Vector3( 0, 2, 0 ),
/* Rotation of the player. 0 = looking toward -Z */
angle:0,
speed:0.72,
rotateSpeed:0.065
};
camera.position.copy( player.position );
/* ===================================================== IMPORTANT MOVEMENT SYSTEM ===================================================== */
/* We intentionally DO NOT use: sin(angle), cos(angle) for forward/backward. Instead we use the CAMERA'S actual world direction. Therefore: ▲ = exactly where camera is looking ▼ = exactly opposite camera ◀ / ▶ = only rotate. */
function getCameraForward(){
const direction = new THREE.Vector3();
camera.getWorldDirection( direction );
direction.y=0;
direction.normalize();
return direction;
}
function updateCamera(){
/* Camera is positioned at player. */
camera.position.copy( player.position );
/* Calculate where player should look. */
const lookDirection = new THREE.Vector3(
Math.sin(player.angle),
0,
-Math.cos(player.angle)
);
const target = new THREE.Vector3();
target.copy( player.position );
target.addScaledVector( lookDirection, 10 );
camera.lookAt( target );
}
/* ===================================================== MOVEMENT ===================================================== */
function moveForward(){
const direction = getCameraForward();
player.position.addScaledVector( direction, player.speed );
}
function moveBackward(){
const direction = getCameraForward();
player.position.addScaledVector( direction, -player.speed );
}
function updateMovement(){
/* ▲ FORWARD */
if( keys["arrowup"] || keys["w"] ){
moveForward();
}
/* ▼ BACKWARD */
if( keys["arrowdown"] || keys["s"] ){
moveBackward();
}
/* ◀ ROTATE LEFT */
if( keys["arrowleft"] || keys["a"] ){
player.angle -= player.rotateSpeed;
}
/* ▶ ROTATE RIGHT */
if( keys["arrowright"] || keys["d"] ){
player.angle += player.rotateSpeed;
}
updateCamera();
}
/* ===================================================== KEYBOARD ===================================================== */
const keys={};
window.addEventListener(
"keydown",
e=>{
keys[ e.key.toLowerCase() ]=true;
}
);
window.addEventListener(
"keyup",
e=>{
keys[ e.key.toLowerCase() ]=false;
}
);
/* ===================================================== MOBILE CONTROLS ===================================================== */
function holdButton(
id,
key
){
const button = document.getElementById(id);
const start=e=>{
e.preventDefault();
keys[key]=true;
};
const stop=e=>{
e.preventDefault();
keys[key]=false;
};
button.addEventListener(
"pointerdown",
start
);
button.addEventListener(
"pointerup",
stop
);
button.addEventListener(
"pointerleave",
stop
);
button.addEventListener(
"pointercancel",
stop
);
}
holdButton(
"up",
"arrowup"
);
holdButton(
"down",
"arrowdown"
);
holdButton(
"left",
"arrowleft"
);
holdButton(
"right",
"arrowright"
);
/* ===================================================== WORLD OBJECTS ===================================================== */
function addBox(
x,
y,
z,
sx,
sy,
sz,
color
){
const geometry = new THREE.BoxGeometry(
sx,
sy,
sz
);
const material = new THREE.MeshStandardMaterial({ color });
const mesh = new THREE.Mesh(
geometry,
material
);
mesh.position.set(
x,
y,
z
);
scene.add(mesh);
return mesh;
}
/* ===================================================== LABEL ===================================================== */
function makeLabel(
text,
x,
y,
z,
color="#ffffff",
fontSize=34
){
const canvas = document.createElement(
"canvas"
);
canvas.width=1024;
canvas.height=256;
const ctx = canvas.getContext("2d");
ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);
ctx.fillStyle= "rgba(0,0,0,.7)";
ctx.fillRect(
80,
65,
864,
125
);
ctx.font= `bold ${fontSize}px Arial`;
ctx.textAlign="center";
ctx.textBaseline="middle";
ctx.fillStyle=color;
ctx.fillText(
text,
512,
128
);
const texture = new THREE.CanvasTexture(
canvas
);
const material = new THREE.SpriteMaterial({
map:texture,
transparent:true
});
const sprite = new THREE.Sprite(
material
);
sprite.scale.set(
18,
4.5,
1
);
sprite.position.set(
x,
y,
z
);
scene.add(sprite);
return sprite;
}

/* ===================================================== INTERACTION ===================================================== */
const interactions=[];
let currentInteraction=null;
function addInteraction(
x,
z,
text,
callback,
range=8
){
interactions.push({
position: new THREE.Vector3(
x,
0,
z
),
text,
callback,
range,
active:true
});
}
function updateInteraction(){
currentInteraction=null;
let closest=null;
let closestDistance=Infinity;
for(
const item of interactions
){
if(!item.active) continue;
const dx = player.position.x - item.position.x;
const dz = player.position.z - item.position.z;
const distance = Math.hypot(
dx,
dz
);
if(
distance < item.range && distance < closestDistance
){
closest=item;
closestDistance=distance;
}
}
const hint = document.getElementById(
"interactHint"
);
if(closest){
currentInteraction= closest;
hint.style.display="block";
hint.textContent= `💬 ${closest.text} [E / INTERACT]`;
}else{
hint.style.display="none";
}
}
function interact(){
if(
!currentInteraction || !currentInteraction.active
){
return;
}
currentInteraction.active=false;
document.getElementById(
"interactHint"
).style.display="none";
currentInteraction.callback();
}
window.addEventListener(
"keydown",
e=>{
if(
e.key.toLowerCase()==="e" || e.key==="Enter"
){
interact();
}
}
);
/* ===================================================== CLEAR WORLD ===================================================== */
function clearWorld(){
while(
scene.children.length
){
scene.remove( scene.children[0] );
}
scene.add(ambient);
scene.add(sun);
interactions.length=0;
}

/* ===================================================== DIALOGUE ===================================================== */
let dialogueLines=[];
let dialogueIndex=0;
let dialogueCallback=null;
function speak(
lines,
callback=null
){
dialogueLines=lines;
dialogueIndex=0;
dialogueCallback=callback;
document.getElementById(
"dialogue"
).style.display="block";
showDialogue();
}
function showDialogue(){
if(
dialogueIndex >= dialogueLines.length
){
document.getElementById(
"dialogue"
).style.display="none";
if(dialogueCallback){
const callback = dialogueCallback;
dialogueCallback=null;
callback();
}
return;
}
const line = dialogueLines[
dialogueIndex
];
document.getElementById(
"speaker"
).textContent= line.speaker;
document.getElementById(
"cn"
).textContent= line.cn;
document.getElementById(
"py"
).textContent= line.py;
try{
speechSynthesis.cancel();
const utterance = new SpeechSynthesisUtterance(
line.cn
);
utterance.lang="zh-TW";
utterance.rate=.9;
speechSynthesis.speak( utterance );
}catch(e){}
}
document.getElementById(
"dialogueButton"
).onclick=()=>{
dialogueIndex++;
showDialogue();
};

/* ===================================================== MAIN LOOP ===================================================== */
function animate(){
requestAnimationFrame(
animate
);
updateMovement();
updateInteraction();

/* Progressive reveal logic based on stage and player position */
if(
stage===4
){
const x = player.position.x;
const z = player.position.z;

if(
storeGroup && z < 70
){
storeGroup.visible=true;
}
if(
intersectionGroup && z < -30
){
intersectionGroup.visible=true;
}
if(
parkGroup && x < -50
){
parkGroup.visible=true;
}
if(
cafeGroup && z < -150
){
cafeGroup.visible=true;
}
if(
grGroup && x > 80
){
grGroup.visible=true;
}
}

renderer.render(
scene,
camera
);
}
animate();
window.addEventListener(
"resize",
()=>{
camera.aspect = innerWidth / innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(
innerWidth,
innerHeight
);
}
);
</script>

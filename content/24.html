<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Ahao's Lost Route</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    overflow:hidden;
    font-family:Arial,"Noto Sans TC",sans-serif;
    background:#111;
}

canvas{
    display:block;
}

#hud{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    padding:12px;
    z-index:20;
    pointer-events:none;
}

#objective{
    max-width:520px;
    margin:auto;
    padding:12px 16px;
    border-radius:16px;
    background:rgba(255,255,255,.94);
    box-shadow:0 4px 18px rgba(0,0,0,.18);
    color:#333;
    font-size:15px;
    font-weight:bold;
}

#landmarkMessage{
    position:fixed;
    top:88px;
    left:50%;
    transform:translateX(-50%);
    z-index:30;
    background:rgba(30,30,30,.88);
    color:white;
    padding:10px 16px;
    border-radius:14px;
    opacity:0;
    transition:.3s;
    pointer-events:none;
}

#landmarkMessage.show{
    opacity:1;
}

#hint{
    position:fixed;
    left:50%;
    bottom:145px;
    transform:translateX(-50%);
    background:rgba(0,0,0,.7);
    color:white;
    padding:9px 15px;
    border-radius:14px;
    z-index:20;
    display:none;
    pointer-events:none;
}

#dialogue{
    position:fixed;
    left:50%;
    bottom:20px;
    transform:translateX(-50%);
    width:min(700px,92%);
    background:rgba(255,255,255,.97);
    border-radius:20px;
    padding:18px;
    z-index:50;
    display:none;
    box-shadow:0 8px 30px rgba(0,0,0,.25);
}

#speaker{
    font-size:15px;
    font-weight:bold;
    color:#7a4b20;
    margin-bottom:7px;
}

#zh{
    font-size:20px;
    font-weight:bold;
    line-height:1.5;
}

#pinyin{
    font-size:14px;
    color:#777;
    margin-top:4px;
}

#dialogue button{
    margin-top:13px;
    width:100%;
    border:0;
    padding:11px;
    border-radius:12px;
    background:#222;
    color:white;
    font-size:15px;
}

#controls{
    position:fixed;
    bottom:20px;
    left:20px;
    z-index:40;
    display:grid;
    grid-template-columns:58px 58px 58px;
    grid-template-rows:58px 58px;
    gap:7px;
}

.ctrl{
    border:0;
    border-radius:17px;
    background:rgba(255,255,255,.88);
    font-size:25px;
    box-shadow:0 4px 12px rgba(0,0,0,.2);
    touch-action:none;
    user-select:none;
}

.ctrl:active{
    transform:scale(.94);
    background:white;
}

#up{grid-column:2;grid-row:1;}
#left{grid-column:1;grid-row:2;}
#down{grid-column:2;grid-row:2;}
#right{grid-column:3;grid-row:2;}

#controlLegend{
    position:fixed;
    bottom:21px;
    right:20px;
    z-index:40;
    background:rgba(0,0,0,.58);
    color:white;
    padding:9px 12px;
    border-radius:12px;
    font-size:11px;
    line-height:1.6;
}

#interact{
    position:fixed;
    right:20px;
    bottom:115px;
    z-index:40;
    width:70px;
    height:70px;
    border-radius:50%;
    border:0;
    background:#f3b45b;
    color:#222;
    font-size:18px;
    font-weight:bold;
    display:none;
    box-shadow:0 5px 18px rgba(0,0,0,.25);
}

#vocabBtn{
    position:fixed;
    top:12px;
    right:12px;
    z-index:60;
    border:0;
    border-radius:12px;
    padding:10px 13px;
    background:white;
    font-weight:bold;
}

#vocabModal, #story, #success{
    position:fixed;
    inset:0;
    z-index:100;
    background:rgba(0,0,0,.72);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.modalBox{
    width:min(720px,100%);
    max-height:88vh;
    overflow:auto;
    background:white;
    border-radius:24px;
    padding:25px;
}

.modalBox h2{
    margin-bottom:15px;
}

.vocabItem{
    display:flex;
    justify-content:space-between;
    gap:12px;
    padding:10px 0;
    border-bottom:1px solid #eee;
}

.vocabItem b{
    font-size:18px;
}

.vocabItem small{
    color:#777;
}

.modalBox button{
    margin-top:18px;
    width:100%;
    border:0;
    padding:12px;
    border-radius:13px;
    background:#222;
    color:white;
}

.storyText{
    line-height:1.7;
    color:#444;
}

.storyText h1{
    margin-bottom:15px;
}

.storyText button{
    margin-top:20px;
    width:100%;
    padding:13px;
    border:0;
    border-radius:14px;
    background:#222;
    color:white;
    font-size:16px;
}

#success{
    display:none;
}

.successBox{
    background:white;
    border-radius:25px;
    padding:30px;
    text-align:center;
    width:min(500px,100%);
}

.hidden{
    display:none !important;
}
</style>

<script type="importmap">
{
    "imports":{
        "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
    }

<body>

<div id="hud">
    <div id="objective">🎯 Objective</div>
</div>

<div id="landmarkMessage"></div>

<button id="vocabBtn">📖 Vocabulary</button>

<div id="dialogue">

<div id="controlLegend">

    <div class="modalBox">

</div>

<div id="vocabModal" class="hidden">

    </div>
</div>

<div id="success">

    <div class="successBox">

        <h1>🎉 到達目的地！</h1>

        <p style="margin-top:12px;line-height:1.7;">
            你成功靠中文方向找到海風餐廳了！

        <p style="margin-top:10px;">
            阿豪終於可以參加小美的生日聚會。
        </p>

<script type="module">

import * as THREE from "three";


/* =========================================================
   BASIC SETUP
========================================================= */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x9fc9e8);

scene.fog =
    new THREE.Fog(
        0x9fc9e8,
        45,
        250
    );

const camera =
    new THREE.PerspectiveCamera(
        65,
        innerWidth / innerHeight,
        .1,
        500
    );

const renderer =
    new THREE.WebGLRenderer({
        antialias:true
    });

renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
);

renderer.setSize(
    innerWidth,
    innerHeight
);

document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   LIGHTS
========================================================= */

const ambient =
    new THREE.AmbientLight(
        0xffffff,
        1.8
    );

const sun =
    new THREE.DirectionalLight(
        0xffffff,
        2
    );

sun.position.set(
    80,
    120,
    60
);

scene.add(
    ambient,
    sun
);


/* =========================================================
   PLAYER
========================================================= */

const player = {

    position:
        new THREE.Vector3(
            0,
            2,
            105
        ),

    /*
       IMPORTANT:

       angle = 0
       means Ahao faces toward -Z.

       ▲ = move toward -Z
       ▼ = move toward +Z
       ◀ / ▶ only rotate.
    */

    angle:0,

    speed:.32,

    rotateSpeed:.045
};


/* =========================================================
   INPUT
========================================================= */

const keys = {

    forward:false,
    backward:false,
    left:false,
    right:false

};

function setKey(
    action,
    value
){

    keys[action] = value;

}

window.addEventListener(
    "keydown",
    e=>{

        if(
            e.key === "ArrowUp" ||
            e.key.toLowerCase() === "w"
        ){

            e.preventDefault();

            setKey(
                "forward",
                true
            );

        }

        if(
            e.key === "ArrowDown" ||
            e.key.toLowerCase() === "s"
        ){

            e.preventDefault();

            setKey(
                "backward",
                true
            );

        }

        if(
            e.key === "ArrowLeft" ||
            e.key.toLowerCase() === "a"
        ){

            e.preventDefault();

            setKey(
                "left",
                true
            );

        }

        if(
            e.key === "ArrowRight" ||
            e.key.toLowerCase() === "d"
        ){

            e.preventDefault();

            setKey(
                "right",
                true
            );

        }

        if(
            e.key === "e" ||
            e.key === "Enter"
        ){

            interact();

        }

    }
);

window.addEventListener(
    "keyup",
    e=>{

        if(
            e.key === "ArrowUp" ||
            e.key.toLowerCase() === "w"
        ){

            setKey(
                "forward",
                false
            );

        }

        if(
            e.key === "ArrowDown" ||
            e.key.toLowerCase() === "s"
        ){

            setKey(
                "backward",
                false
            );

        }

        if(
            e.key === "ArrowLeft" ||
            e.key.toLowerCase() === "a"
        ){

            setKey(
                "left",
                false
            );

        }

        if(
            e.key === "ArrowRight" ||
            e.key.toLowerCase() === "d"
        ){

            setKey(
                "right",
                false
            );

        }

    }
);


/* =========================================================
   TOUCH BUTTONS
========================================================= */

function holdButton(
    id,
    action
){

    const button =
        document.getElementById(id);

    button.addEventListener(
        "pointerdown",
        e=>{

            e.preventDefault();

            setKey(
                action,
                true
            );

            try{

                button.setPointerCapture(
                    e.pointerId
                );

            }catch(err){}

        }
    );

    const release =
        e=>{

            e.preventDefault();

            setKey(
                action,
                false
            );

        };

    button.addEventListener(
        "pointerup",
        release
    );

    button.addEventListener(
        "pointercancel",
        release
    );

    button.addEventListener(
        "pointerleave",
        release
    );

}

holdButton(
    "up",
    "forward"
);

holdButton(
    "down",
    "backward"
);

holdButton(
    "left",
    "left"
);

holdButton(
    "right",
    "right"
);


/* =========================================================
   WORLD HELPERS
========================================================= */

function box(
    parent,
    x,y,z,
    w,h,d,
    color
){

    const mesh =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                w,
                h,
                d
            ),
            new THREE.MeshStandardMaterial({
                color
            })
        );

    mesh.position.set(
        x,
        y,
        z
    );

    parent.add(mesh);

    return mesh;

}


function cylinder(
    parent,
    x,y,z,
    radius,
    height,
    color
){

    const mesh =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                radius,
                radius,
                height,
                16
            ),
            new THREE.MeshStandardMaterial({
                color
            })
        );

    mesh.position.set(
        x,
        y,
        z
    );

    parent.add(mesh);

    return mesh;

}


function makeLabel(
    parent,
    text,
    x,y,z
){

    const canvas =
        document.createElement(
            "canvas"
        );

    canvas.width = 512;
    canvas.height = 128;

    const ctx =
        canvas.getContext("2d");

    ctx.fillStyle =
        "rgba(255,255,255,.94)";

    ctx.roundRect(
        5,
        5,
        502,
        118,
        25
    );

    ctx.fill();

    ctx.fillStyle =
        "#222";

    ctx.font =
        "bold 42px Arial";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    ctx.fillText(
        text,
        256,
        64
    );

    const texture =
        new THREE.CanvasTexture(
            canvas
        );

    const material =
        new THREE.SpriteMaterial({
            map:texture,
            transparent:true
        });

    const sprite =
        new THREE.Sprite(
            material
        );

    sprite.scale.set(
        7,
        1.75,
        1
    );

    sprite.position.set(
        x,
        y,
        z
    );

    parent.add(sprite);

    return sprite;

}


function road(
    parent,
    x,z,
    width,
    length,
    rotation=0
){

    const mesh =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                width,
                length
            ),
            new THREE.MeshStandardMaterial({
                color:0x555555
            })
        );

    mesh.rotation.x =
        -Math.PI/2;

    mesh.rotation.z =
        rotation;

    mesh.position.set(
        x,
        .03,
        z
    );

    parent.add(mesh);

    return mesh;

}


function grass(
    parent,
    x,z,
    w,d
){

    return box(
        parent,
        x,
        -.4,
        z,
        w,
        .8,
        d,
        0x77a95a
    );

}


function tree(
    parent,
    x,z
){

    cylinder(
        parent,
        x,
        2,
        z,
        .35,
        4,
        0x76502e
    );

    const crown =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                1.7,
                12,
                12
            ),
            new THREE.MeshStandardMaterial({
                color:0x43894b
            })
        );

    crown.position.set(
        x,
        5,
        z
    );

    parent.add(crown);

}


/* =========================================================
   NPC
========================================================= */

function createNPC(
    parent,
    x,z,
    name="路人"
){

    const group =
        new THREE.Group();

    group.position.set(
        x,
        0,
        z
    );

    parent.add(group);

    cylinder(
        group,
        0,
        2,
        0,
        .7,
        3,
        0x4267a9
    );

    const head =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .55,
                16,
                16
            ),
            new THREE.MeshStandardMaterial({
                color:0xffd0aa
            })
        );

    head.position.y = 4;

    group.add(head);

    makeLabel(
        group,
        name,
        0,
        6,
        0
    );

    return group;

}


/* =========================================================
   INTERACTIONS
========================================================= */

let interactions = [];

function addInteraction(
    x,z,
    label,
    callback,
    range=6
){

    interactions.push({

        x,
        z,
        label,
        callback,
        range,
        used:false

    });

}


function getNearestInteraction(){

    let nearest = null;

    let distance = Infinity;

    for(
        const item of interactions
    ){

        if(item.used)
            continue;

        const d =
            Math.hypot(
                player.position.x -
                    item.x,

                player.position.z -
                    item.z
            );

        if(
            d < item.range &&
            d < distance
        ){

            distance = d;

            nearest = item;

        }

    }

    return nearest;

}


function updateInteractionUI(){

    const item =
        getNearestInteraction();

    const button =
        document.getElementById(
            "interact"
        );

    const hint =
        document.getElementById(
            "hint"
        );

    if(item){

        button.style.display =
            "block";

        hint.style.display =
            "block";

    }else{

        button.style.display =
            "none";

        hint.style.display =
            "none";

    }

}


function interact(){

    if(dialogueActive)
        return;

    const item =
        getNearestInteraction();

    if(!item)
        return;

    item.used = true;

    item.callback();

}


/* =========================================================
   DIALOGUE
========================================================= */

let dialogueActive=false;

let dialogueLines=[];

let dialogueIndex=0;

let dialogueCallback=null;


function speak(
    lines,
    callback=null
){

    dialogueActive=true;

    dialogueLines =
        lines;

    dialogueIndex=0;

    dialogueCallback =
        callback;

    document.getElementById(
        "dialogue"
    ).style.display =
        "block";

    showDialogueLine();

}


function showDialogueLine(){

    const line =
        dialogueLines[
            dialogueIndex
        ];

    document.getElementById(
        "speaker"
    ).textContent =
        line.speaker;

    document.getElementById(
        "zh"
    ).textContent =
        line.zh;

    document.getElementById(
        "pinyin"
    ).textContent =
        line.pinyin;

}


document.getElementById(
    "nextDialogue"
).onclick=()=>{

    dialogueIndex++;

    if(
        dialogueIndex >=
        dialogueLines.length
    ){

        document.getElementById(
            "dialogue"
        ).style.display =
            "none";

        dialogueActive=false;

        if(dialogueCallback){

            const cb =
                dialogueCallback;

            dialogueCallback =
                null;

            cb();

        }

    }else{

        showDialogueLine();

    }

};


/* =========================================================
   OBJECTIVE
========================================================= */

function objective(text){

    document.getElementById(
        "objective"
    ).innerHTML =
        "🎯 "+text;

}


/* =========================================================
   LANDMARK MESSAGE
========================================================= */

let messageTimer=null;

function landmarkMessage(text){

    const el =
        document.getElementById(
            "landmarkMessage"
        );

    el.textContent =
        text;

    el.classList.add(
        "show"
    );

    clearTimeout(
        messageTimer
    );

    messageTimer =
        setTimeout(
            ()=>{

                el.classList.remove(
                    "show"
                );

            },
            2600
        );

}


/* =========================================================
   CLEAR WORLD
========================================================= */

function clearWorld(){

    while(
        scene.children.length
    ){

        scene.remove(
            scene.children[0]
        );

    }

    scene.add(
        ambient,
        sun
    );

    interactions=[];

}


/* =========================================================
   GIFT AREA
========================================================= */

function loadGiftArea(){

    clearWorld();

    player.position.set(
        0,
        2,
        20
    );

    player.angle=0;

    grass(
        scene,
        0,
        0,
        120,
        100
    );

    road(
        scene,
        0,
        0,
        18,
        100
    );

    const shop =
        new THREE.Group();

    scene.add(shop);

    box(
        shop,
        0,
        5,
        -18,
        14,
        10,
        12,
        0xd98b6a
    );

    makeLabel(
        shop,
        "🎁 禮物店",
        0,
        11,
        -18
    );

    createNPC(
        scene,
        0,
        -2,
        "店員"
    );

    addInteraction(
        0,
        -2,
        "買生日禮物",
        ()=>{

            speak([

                {
                    speaker:"店員",
                    zh:"你好！你想買什麼？",
                    pinyin:
                        "Nǐ hǎo! Nǐ xiǎng mǎi shénme?"
                },

                {
                    speaker:"阿豪",
                    zh:"我想買一個生日禮物。",
                    pinyin:
                        "Wǒ xiǎng mǎi yí ge shēngrì lǐwù."
                },

                {
                    speaker:"店員",
                    zh:"這個怎麼樣？",
                    pinyin:
                        "Zhège zěnmeyàng?"
                },

                {
                    speaker:"阿豪",
                    zh:"好，我要這個。",
                    pinyin:
                        "Hǎo, wǒ yào zhège."
                }

            ],()=>{

                objective(
                    "去找路人，問怎麼去車站。"
                );

                loadFirstStreet();

            });

        }
    );

    objective(
        "先去禮物店買小美的生日禮物。"
    );

}


/* =========================================================
   FIRST STREET
   NPC IS FAR AWAY
========================================================= */

function loadFirstStreet(){

    clearWorld();

    player.position.set(
        0,
        2,
        100
    );

    player.angle=0;

    grass(
        scene,
        0,
        -20,
        150,
        300
    );

    road(
        scene,
        0,
        -20,
        18,
        300
    );

    /*
       NPC is intentionally far away.
    */

    createNPC(
        scene,
        0,
        30,
        "路人"
    );

    addInteraction(
        0,
        30,
        "問路",

========================================================= */

    );

    );

    ============================================ */

/* =========================================================
   LANDMARK DISCOVERY
========================================================= */

function updateGRRouteDiscovery(){


    /* ============================================
       PARK

       PARK IS ON THE LEFT BRANCH.

       It only appears after Ahao has
       actually turned left and walked
       a considerable distance.

       This prevents it from appearing
       immediately at the intersection.
    ============================================ */

    if(
        !parkFound &&
        player.position.x < -75 &&
        player.position.z < -75 &&
        player.position.z > -125
    ){

        parkFound=true;

        parkGroup.visible=true;

        landmarkMessage(
            "🌳 你發現公園了！"
        );

    }


    /* ============================================
       CAFE

       CAFE IS STRAIGHT AHEAD.

       It only appears after walking
       a long distance.
    ============================================ */

    if(
        !cafeFound &&
        player.position.z < -180 &&
        Math.abs(player.position.x) < 25
    ){

        cafeFound=true;

        cafeGroup.visible=true;

        landmarkMessage(
            "☕ 你發現咖啡店了！"
        );

    }


    /* ============================================
       INTERSECTION

       It becomes obvious only after
       Ahao reaches the intersection.
    ============================================ */

    if(
        !crossroadFound &&
        player.position.z < -85 &&
        player.position.z > -120 &&
        Math.abs(player.position.x) < 15
    ){

        crossroadFound=true;

        crossroadGroup.visible=true;

        landmarkMessage(
            "↔️ 你到了十字路口！"
        );

        objective(
            "到了十字路口，往右轉。"
        );

    }


    /* ============================================
       CORRECT ROUTE = RIGHT

       Player must actually move
       to the positive X direction.
    ============================================ */

    if(
        crossroadFound &&
        !grFound &&
        player.position.x > 100 &&
        Math.abs(
            player.position.z + 100
        ) < 25
    ){

        grFound=true;

        grGroup.visible=true;

        addInteraction(
            145,
            -100,
            "搭GR公車",
            ()=>{

                loadGRBusArea();

            },
            10
        );

        landmarkMessage(
            "🚌 你找到 GR 公車站了！"
        );

        objective(
            "找到 GR 公車站，按 E 搭車。"
        );

    }


    /* ============================================
       BEFORE INTERSECTION

       Remind player about the
       convenience store.
    ============================================ */

    if(
        !crossroadFound &&
        player.position.z < -45 &&
        player.position.z > -75
    ){

        objective(
            "看到 便利商店 以後繼續走。"
        );

    }

}

/* =========================================================
   MOVEMENT
========================================================= */

function getForward(){

    /*
       THIS is the new movement system.

       angle 0:
       forward = (0,0,-1)

       ▲ => forward
       ▼ => backward

       So up/down can NEVER accidentally
       become left/right because movement is
       calculated directly from Ahao's angle.
    */

    return new THREE.Vector3(

        Math.sin(
            player.angle
        ),

        0,

        -Math.cos(
            player.angle
        )

    );

}


function updateMovement(){

    if(dialogueActive)
        return;

    /*
       LEFT / RIGHT = ROTATION ONLY
    */

    if(keys.left){

        player.angle -=
            player.rotateSpeed;

    }

    if(keys.right){

        player.angle +=
            player.rotateSpeed;

    }


    /*
       ▲ = FORWARD
    */

    if(keys.forward){

        const forward =
            getForward();

        player.position.addScaledVector(
            forward,
            player.speed
        );

    }


    /*
       ▼ = BACKWARD
    */

    if(keys.backward){

        const forward =
            getForward();

        player.position.addScaledVector(
            forward,
            -player.speed
        );

    }


    /*
       Keep player on ground.
    */

    player.position.y=2;

}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera(){

    const forward =
        getForward();

    const cameraTarget =
        player.position.clone()
            .add(
                forward.clone()
                    .multiplyScalar(8)
            );

    camera.position.lerp(

        new THREE.Vector3(

            player.position.x -
                forward.x*8,

            player.position.y + 6,

            player.position.z -
                forward.z*8

        ),

        .12

    );

    camera.lookAt(

        cameraTarget.x,

        cameraTarget.y + 1.5,

        cameraTarget.z

    );

}


/* =========================================================
   MAIN UPDATE
========================================================= */

function update(){

    updateMovement();

    updateCamera();

    updateInteractionUI();


    if(
        typeof updateGRRouteDiscovery ===
        "function"
    ){

        if(
            grGroup &&
            !dialogueActive
        ){

            updateGRRouteDiscovery();

        }

    }


    if(
        typeof window.currentRestaurantUpdate ===
        "function"
    ){

        window.currentRestaurantUpdate();

    }

}

function loadVocab(){

    const list =
        document.getElementById(
            "vocabList"
        );

    list.innerHTML="";

    vocab.forEach(
        item=>{

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "vocabItem";

            div.innerHTML=`

                <div>
                    <b>${item[0]}</b>
                    <small>${item[1]}</small>
                </div>

                <div>
                    ${item[2]}
                </div>

            `;

            list.appendChild(
                div
            );

        }
    );

}

loadVocab();


document.getElementById(
    "vocabBtn"
).onclick=()=>{

    document.getElementById(
        "vocabModal"
    ).classList.remove(
        "hidden"
    );

};


document.getElementById(
    "closeVocab"
).onclick=()=>{

    document.getElementById(
        "vocabModal"
    ).classList.add(
        "hidden"
    );

};


/* =========================================================
   START
========================================================= */

document.getElementById(
    "startBtn"
).onclick=()=>{

    document.getElementById(
        "story"
    ).style.display =
        "none";

    loadGiftArea();

};


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect =
            innerWidth /
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);


/* =========================================================
   ANIMATION
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );

    update();

    renderer.render(
        scene,
        camera
    );

}

animate();

</script>

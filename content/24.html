/* =========================================
   BASIC
========================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    background: #dcebd6;

}

button {
    font-family: inherit;
}

.game-container {

}


/* =========================================
   HEADER
========================================= */

.game-header {
    background: #fff7df;
    border: 4px solid #4c3b32;
    box-shadow: 6px 6px 0 #4c3b32;
    padding: 18px;
    text-align: center;
    margin-bottom: 20px;
}

.game-header h1 {
    margin: 0 0 8px;
    font-size: clamp(1.3rem, 5vw, 2.2rem);
}

.game-header p {
    margin: 0;
    font-size: 0.85rem;
}


/* =========================================
   PROGRESS
========================================= */

.progress-container {
    width: 100%;
    height: 22px;
    border: 4px solid #4c3b32;
    background: white;
    margin-bottom: 20px;
}

.progress-bar {
    width: 0%;
    height: 100%;
    background: #e89070;
    transition: width 0.5s;
}


/* =========================================
   MAIN GAME
========================================= */

.game-box {
    background: #fff7df;
    border: 4px solid #4c3b32;
    box-shadow: 7px 7px 0 #4c3b32;
    padding: 15px;
}

.story-box {
    background: white;
    border: 3px solid #4c3b32;
    padding: 15px;
    line-height: 1.6;
    margin-bottom: 15px;
    min-height: 100px;
}


/* =========================================
   MAP
========================================= */

.map-frame {
    border: 5px solid #4c3b32;
    background: #222;
    width: 100%;
    overflow: hidden;
}

.game-map {
    display: grid;
    width: 100%;
    aspect-ratio: 1.35;
    background: #83bb72;
    position: relative;
}


/* =========================================
   GRID CELLS
========================================= */

.cell {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: visible;
    font-size: clamp(13px, 2vw, 24px);
}


/* =========================================
   GRASS
========================================= */

.grass {
    background-color: #82bd70;
}

.grass::after {
    content: "·  ·";
    position: absolute;
    color: rgba(255,255,255,0.25);
    font-size: 10px;
}


/* =========================================
   ROAD
========================================= */

.road {
    background: #b9ad9d;
}

.road::after {
    content: "";
    position: absolute;
    width: 55%;
    height: 4px;
    background: #e8dfd4;
}


/* =========================================
   CROSSROAD
========================================= */

.crossroad {
    background: #b9ad9d;
}


/* =========================================
   SIDEWALK
========================================= */

.sidewalk {
    background: #d8d0c4;
}


/* =========================================
   WATER
========================================= */

.water {
    background: #77b8d5;
}

.water::after {
    content: "≈";
    color: #d9f2ff;
    font-size: 20px;
}


/* =========================================
   BUILDINGS
========================================= */

.building {
    background: #f5e3bd;
    border: 3px solid #5b4738;
    font-size: 11px;
    font-weight: bold;
    text-align: center;
    line-height: 1.2;
    padding: 2px;
}

.building.mall {
    background: #e5a56d;
}

.building.bank {
    background: #e8d17b;
}

.building.hospital {
    background: #e7e7e7;
}

.building.store {
    background: #b8d88e;
}

.building.station {
    background: #b5c8d6;
}

.building.restaurant {
    background: #dc8d70;
}


/* =========================================
   SPECIAL TILES
========================================= */

.station-entrance {

    font-size: 10px;
    text-align: center;

.red-line {

.platform {

/* =========================================

.objective-box {

/* =========================================

.message {

}

/* =========================================
   CONTROLS
========================================= */

.controls-title {
    text-align: center;
    font-size: 12px;
    margin-top: 20px;
}

.dpad {
    display: grid;
    grid-template-columns: repeat(3, 65px);
    grid-template-rows: repeat(2, 60px);
    gap: 7px;
    justify-content: center;
    margin: 12px auto 5px;
}

.control-button {
    background: white;
    border: 3px solid #4c3b32;
    box-shadow: 4px 4px 0 #4c3b32;
    font-size: 23px;
    font-weight: bold;
    cursor: pointer;
    touch-action: manipulation;
}

.control-button:active {
    transform: translate(3px, 3px);
    box-shadow: 1px 1px 0 #4c3b32;
}

.up {
    grid-column: 2;
    grid-row: 1;
}

.left {
    grid-column: 1;
    grid-row: 2;
}

.down {
    grid-column: 2;
    grid-row: 2;
}

.right {
    grid-column: 3;
    grid-row: 2;

/* =========================================
   PASSABLE TILES
========================================= */

function isPassable(tile) {

    const blocked = [

        "grass",
        "wall",
        "building",
        "bank",
        "hospital",
        "mall",
        "store",
        "station",
        "restaurant",
        "pharmacy",
        "water"

    ];

    return !blocked.includes(tile);

}


/* =========================================
   TILE CLASS
========================================= */

function getTileClass(tile) {

    if (
        [
            "mall",
            "bank",
            "hospital",
            "store",
            "station",
            "restaurant",
            "building",
            "pharmacy"
        ].includes(tile)
    ) {

        if (tile === "pharmacy") {
            return "pharmacy";
        }

        return "building " + tile;

    }

    return tile;

}

        hospital: "🏥<br>HOSPITAL",

        store: "🏪<br>SHOP",

        station: "🚉<br>STATION",

        restaurant: "🏮<br>海風小館",

        pharmacy: "💊<br>PHARMACY",

        "station-entrance": "🚪",

        "red-line": "🔴<br>RED LINE",

        "bus-stop": "🚌<br>BUS STOP",

        building: "🪑"

    };

    return content[tile] || "";

}


/* =========================================
   CREATE AHAO
========================================= */

function createPlayer() {

    const player = document.createElement("div");

    player.className = "player";

    player.innerHTML = `

        <div class="pixel-hair"></div>

        <div class="pixel-head"></div>

        <div class="pixel-body"></div>

        <div class="pixel-leg-left"></div>

        <div class="pixel-leg-right"></div>

    `;

    return player;

}


/* =========================================
   RENDER SCENE
========================================= */

function renderScene() {

    const scene = scenes[currentScene];

    gameMap.innerHTML = "";

    gameMap.style.gridTemplateColumns =
        `repeat(${scene.cols}, 1fr)`;

    gameMap.style.gridTemplateRows =
        `repeat(${scene.rows}, 1fr)`;


    storyBox.innerHTML = scene.story;

    objectiveBox.innerHTML =
        "🎯 " + scene.objective;


    playerPosition = {

        x: scene.start.x,
        y: scene.start.y

    };


    for (let y = 0; y < scene.rows; y++) {

        for (let x = 0; x < scene.cols; x++) {

            const tile = scene.map[y][x];

            const cell =
                document.createElement("div");

            cell.className =
                "cell " + getTileClass(tile);

            cell.dataset.x = x;

            cell.dataset.y = y;

            cell.innerHTML =
                getTileContent(tile);


            gameMap.appendChild(cell);

        }

    }


    placePlayer();


    setMessage(
        "Use the arrow buttons to move Ahao.",
        "info"
    );


    updateProgress();

}


/* =========================================
   PLACE PLAYER
========================================= */

function placePlayer() {

    const oldPlayer =
        document.querySelector(".player");

    if (oldPlayer) {

        oldPlayer.remove();

    }


    const selector =
        `.cell[data-x="${playerPosition.x}"][data-y="${playerPosition.y}"]`;


    const currentCell =
        document.querySelector(selector);


    if (currentCell) {

        currentCell.appendChild(
            createPlayer()
        );

    }

}


/* =========================================
   MOVE PLAYER
========================================= */

function movePlayer(direction) {

    if (gameLocked) return;


    const scene =
        scenes[currentScene];


    let nextX =
        playerPosition.x;

    let nextY =
        playerPosition.y;


    if (direction === "up") {

        nextY--;

    }


    if (direction === "down") {

        nextY++;

    }


    if (direction === "left") {

        nextX--;

    }


    if (direction === "right") {

        nextX++;

    }


    /* Boundary */

    if (

        nextX < 0 ||

        nextY < 0 ||

        nextX >= scene.cols ||

        nextY >= scene.rows

    ) {

        setMessage(
            "🚫 Ahao can't go that way.",
            "error"
        );

        return;

    }


    const nextTile =
        scene.map[nextY][nextX];


    /* Collision */

    if (!isPassable(nextTile)) {

        setMessage(
            "🚫 There's something blocking the way!",
            "error"
        );

        return;

    }


    /* Move */

    playerPosition.x = nextX;

    playerPosition.y = nextY;


    placePlayer();


    setMessage(
        "🧑 Ahao moves " + direction + ".",
        "info"
    );


    checkCheckpoint();

    checkTarget();

}


/* =========================================
   CHECKPOINTS
========================================= */

function checkCheckpoint() {

    const scene =
        scenes[currentScene];


    if (!scene.checkpoints) return;


    scene.checkpoints.forEach(
        checkpoint => {

            if (

                checkpoint.x === playerPosition.x &&

                checkpoint.y === playerPosition.y

            ) {

                if (checkpoint.message) {

                    setMessage(
                        checkpoint.message,
                        "success"
                    );

                }


                if (checkpoint.objective) {

                    objectiveBox.innerHTML =
                        "🎯 " + checkpoint.objective;

                }

            }

        }

    );

}


/* =========================================
   TARGET
========================================= */

function checkTarget() {

    const scene =
        scenes[currentScene];


    if (

        playerPosition.x === scene.target.x &&

        playerPosition.y === scene.target.y

    ) {

        gameLocked = true;


        setMessage(

            scene.targetMessage ||

            "Great job!",

            "success"

        );


        setTimeout(() => {

            currentScene++;

            gameLocked = false;


            if (

                currentScene >= scenes.length

            ) {

                finishGame();

            }

            else {

                renderScene();

            }

        }, 1800);

    }

}


/* =========================================
   MESSAGE
========================================= */

function setMessage(text, type) {

    messageBox.textContent =
        text;

    messageBox.className =
        "message " + type;

}


/* =========================================
   PROGRESS
========================================= */

function updateProgress() {

    const percentage =

        (currentScene / scenes.length)

        * 100;


    progressBar.style.width =
        percentage + "%";

}


/* =========================================
   KEYBOARD
========================================= */

document.addEventListener(
    "keydown",

    function(event) {

        const key =
            event.key;


        if (key === "ArrowUp") {

            movePlayer("up");

        }


        if (key === "ArrowDown") {

            movePlayer("down");

        }


        if (key === "ArrowLeft") {

            movePlayer("left");

        }


        if (key === "ArrowRight") {

            movePlayer("right");

        }

    }

);


/* =========================================
   FINISH GAME
========================================= */

function finishGame() {

    document
        .getElementById("gameBox")
        .style.display = "none";


    document
        .getElementById("finalScreen")
        .style.display = "block";


    progressBar.style.width =
        "100%";

}


/* =========================================
   RESTART
========================================= */

function restartGame() {

    currentScene = 0;

    gameLocked = false;


    document
        .getElementById("gameBox")
        .style.display = "block";


    document
        .getElementById("finalScreen")
        .style.display = "none";


    renderScene();

}


/* =========================================
   START
========================================= */

renderScene();

</script></body>
</html>

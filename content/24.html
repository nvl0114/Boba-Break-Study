<style>

body{

#py{

}

    transform:scale(.94);
    background:rgba(255,255,255,.25);
}

#up{
    grid-column:2;
    grid-row:1;
}

#left{
    grid-column:1;
    grid-row:2;
}

#down{
    grid-column:2;
    grid-row:2;
}

#right{
    grid-column:3;
    grid-row:2;
}

/* ================= VOCAB ================= */

#vocabButton{
    position:fixed;
    top:15px;
    right:15px;
    z-index:25;

    border:none;
    border-radius:12px;

    color:white;

    border:1px solid rgba(255,255,255,.2);
    font-weight:700;
}

#vocabModal{
    position:fixed;

.vocabBox{
    width:min(700px,100%);

    border-radius:20px;
    padding:20px;

    border:1px solid rgba(255,255,255,.2);
}

.vocabBox h2{
    margin-bottom:15px;
}

.vocabGrid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
    gap:10px;
}

.vocab{
    background:#242424;
    border-radius:12px;
    padding:12px;
}

.vocab .word{
    font-size:20px;

}

.vocab .pinyin{
    color:#aaa;
    margin-top:3px;
}

.vocab .meaning{

    margin-top:5px;

#closeVocab{
    margin-top:15px;
    padding:10px 16px;
    border:none;

/* ================= STORY ================= */

#story{
    position:fixed;
    inset:0;
    z-index:200;

    background:
        radial-gradient(circle at center,rgba(255,216,92,.08),transparent 45%),
        #101010;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:25px;
}

.storyBox{
    max-width:650px;
    text-align:center;
}

.storyBox h1{
    font-size:clamp(28px,6vw,50px);
    margin-bottom:18px;
}

.storyBox p{
    color:#ccc;
    line-height:1.8;
    font-size:16px;
}

#startGame{
    margin-top:25px;
    padding:13px 25px;
    border:none;
    border-radius:13px;

    background:#ffd85c;
    color:#222;

    font-size:16px;
    font-weight:800;
}

/* ================= SUCCESS ================= */

#success{
    position:fixed;

.successBox{

.successBox h2{
    font-size:30px;

}

.successBox p{

<script type="module">

import * as THREE from "three";

/* =========================================================
   BASIC THREE.JS
========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x9ec8e8);

const camera = new THREE.PerspectiveCamera(
    70,
    innerWidth / innerHeight,
    0.1,
    2000
);

const renderer = new THREE.WebGLRenderer({
    antialias:true
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));

document.body.appendChild(renderer.domElement);

/* =========================================================
   LIGHT
========================================================= */

const ambient = new THREE.HemisphereLight(
    0xffffff,
    0x667788,
    2
);

scene.add(ambient);

const sun = new THREE.DirectionalLight(
    0xffffff,
    2
);

sun.position.set(100,200,100);

scene.add(sun);

/* =========================================================
   PLAYER
========================================================= */

const player = {
    position:new THREE.Vector3(0,2,0),

    // 0 = looking toward +Z
    angle:0,

    speed:0.65,

    rotateSpeed:0.055
};

camera.position.copy(player.position);

/*
 IMPORTANT:

 forward = direction the camera is looking.

 If angle = 0:
 forward = +Z

 ▲ adds forward
 ▼ subtracts forward

 Therefore:
 ▲ = forward
 ▼ = backward
*/

function getForward(){

    return new THREE.Vector3(
        Math.sin(player.angle),
        0,
        Math.cos(player.angle)
    );

}

function getRight(){

    const f = getForward();

    return new THREE.Vector3(
        f.z,
        0,
        -f.x
    );

}

/* =========================================================
   KEYBOARD
========================================================= */

const keys = {};

window.addEventListener("keydown",e=>{

    keys[e.key.toLowerCase()] = true;

});

window.addEventListener("keyup",e=>{

    keys[e.key.toLowerCase()] = false;

});

/* =========================================================
   TOUCH / BUTTON
========================================================= */

function holdButton(id,key){

    const el = document.getElementById(id);

    const start = e=>{
        e.preventDefault();
        keys[key] = true;
    };

    const end = e=>{
        e.preventDefault();
        keys[key] = false;
    };

    el.addEventListener("pointerdown",start);
    el.addEventListener("pointerup",end);
    el.addEventListener("pointerleave",end);
    el.addEventListener("pointercancel",end);
}

holdButton("up","arrowup");
holdButton("down","arrowdown");
holdButton("left","arrowleft");
holdButton("right","arrowright");

/* =========================================================
   MOVEMENT
========================================================= */

function updatePlayer(){

    /*
       FORWARD
    */

    if(keys["arrowup"] || keys["w"]){

        const forward = getForward();

        player.position.addScaledVector(
            forward,
            player.speed
        );

    }

    /*
       BACKWARD
    */

    if(keys["arrowdown"] || keys["s"]){

        const forward = getForward();

        player.position.addScaledVector(
            forward,
            -player.speed
        );

    }

    /*
       ROTATE LEFT
    */

    if(keys["arrowleft"] || keys["a"]){

        player.angle -= player.rotateSpeed;

    }

    /*
       ROTATE RIGHT
    */

    if(keys["arrowright"] || keys["d"]){

        player.angle += player.rotateSpeed;

    }

    /*
       Camera follows player position.
    */

    camera.position.copy(player.position);

    /*
       Look in player's forward direction.
    */

    const forward = getForward();

    camera.lookAt(
        player.position.x + forward.x * 10,
        player.position.y,
        player.position.z + forward.z * 10
    );

}

/* =========================================================
   WORLD HELPERS
========================================================= */

const objects = [];

function addBox(
    x,
    y,
    z,
    sx,
    sy,
    sz,
    color,
    name=""
){

    const geo = new THREE.BoxGeometry(
        sx,sy,sz
    );

    const mat = new THREE.MeshStandardMaterial({
        color
    });

    const mesh = new THREE.Mesh(
        geo,
        mat
    );

    mesh.position.set(x,y,z);

    mesh.userData.name = name;

    scene.add(mesh);

    objects.push(mesh);

    return mesh;
}

/* =========================================================
   TEXT LABEL
========================================================= */

function label(
    text,
    x,
    y,
    z,
    color="#ffffff",
    size=32
){

    const canvas = document.createElement("canvas");

    const ctx = canvas.getContext("2d");

    canvas.width = 1024;
    canvas.height = 256;

    ctx.clearRect(
        0,0,
        canvas.width,
        canvas.height
    );

    ctx.font = `bold ${size}px Arial`;

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillStyle = "rgba(0,0,0,.65)";

    ctx.fillRect(
        0,60,
        canvas.width,
        135
    );

    ctx.fillStyle = color;

    ctx.fillText(
        text,
        canvas.width/2,
        canvas.height/2
    );

    const texture =
        new THREE.CanvasTexture(canvas);

    const mat =
        new THREE.SpriteMaterial({
            map:texture,
            transparent:true
        });

    const sprite =
        new THREE.Sprite(mat);

    sprite.scale.set(18,4.5,1);

    sprite.position.set(
        x,y,z
    );

    scene.add(sprite);

    return sprite;
}

/* =========================================================
   ROAD
========================================================= */

function road(
    x,
    z,
    width,
    length,
    horizontal=false
){

    if(horizontal){

        addBox(
            x,
            -0.1,
            z,
            length,
            0.2,
            width,
            0x444444,
            "road"
        );

    }else{

        addBox(
            x,
            -0.1,
            z,
            width,
            0.2,
            length,
            0x444444,
            "road"
        );

    }

}

/* =========================================================
   SIDEWALK
========================================================= */

function sidewalk(
    x,
    z,
    width,
    length,
    horizontal=false
){

    if(horizontal){

        addBox(
            x,
            0.02,
            z-width/2-1.5,
            length,
            0.15,
            3,
            0x999999
        );

        addBox(
            x,
            0.02,
            z+width/2+1.5,
            length,
            0.15,
            3,
            0x999999
        );

    }else{

        addBox(
            x-width/2-1.5,
            0.02,
            z,
            3,
            0.15,
            length,
            0x999999
        );

        addBox(
            x+width/2+1.5,
            0.02,
            z,
            3,
            0.15,
            length,
            0x999999
        );

    }

}

/* =========================================================
   BUILDING
========================================================= */

function building(
    x,
    z,
    w,
    d,
    h,
    color,
    text=""
){

    addBox(
        x,
        h/2,
        z,
        w,
        h,
        d,
        color,
        "building"
    );

    if(text){

        label(
            text,
            x,
            h+4,
            z
        );

    }

}

/* =========================================================
   TREE
========================================================= */

function tree(x,z){

    addBox(
        x,
        2,
        z,
        1.5,
        4,
        1.5,
        0x6b4423
    );

    const geo =
        new THREE.SphereGeometry(
            3.5,
            10,
            8
        );

    const mat =
        new THREE.MeshStandardMaterial({
            color:0x3f8f4a
        });

    const crown =
        new THREE.Mesh(
            geo,
            mat
        );

    crown.position.set(
        x,
        6,
        z
    );

    scene.add(crown);

}

/* =========================================================
   NPC
========================================================= */

function npc(
    x,
    z,
    name
){

    const group =
        new THREE.Group();

    const body =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                0.7,
                0.8,
                2.2,
                12
            ),
            new THREE.MeshStandardMaterial({
                color:0x4777aa
            })
        );

    body.position.y=1.1;

    group.add(body);

    const head =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                0.65,
                16,
                12
            ),
            new THREE.MeshStandardMaterial({
                color:0xf0c49b
            })
        );

    head.position.y=2.65;

    group.add(head);

    group.position.set(
        x,
        0,
        z
    );

    scene.add(group);

    label(
        name,
        x,
        4.5,
        z,
        "#ffd85c",
        28
    );

    return group;
}

/* =========================================================
   INTERACTION POINT
========================================================= */

let currentInteraction = null;

function interaction(
    x,
    z,
    text,
    callback,
    range=7
){

    const point = {
        position:new THREE.Vector3(
            x,
            0,
            z
        ),
        text,
        callback,
        range,
        active:true
    };

    interactions.push(point);

    return point;
}

const interactions = [];

/* =========================================================
   CLEAR WORLD
========================================================= */

function clearWorld(){

    while(scene.children.length){

        scene.remove(
            scene.children[0]
        );

    }

    scene.add(ambient);
    scene.add(sun);

    interactions.length=0;

}

/* =========================================================
   STAGE SYSTEM
========================================================= */

let stage=0;

const objective =
    document.getElementById("objective");

function setObjective(text){

    objective.innerHTML =
        `<b>任務：</b> ${text}`;

}

/* =========================================================
   DIALOGUE SYSTEM
========================================================= */

const dialogue =
    document.getElementById("dialogue");

const speaker =
    document.getElementById("speaker");

const cn =
    document.getElementById("cn");

const py =
    document.getElementById("py");

const dialogueButton =
    document.getElementById("dialogueButton");

let dialogueQueue=[];
let dialogueIndex=0;
let dialogueCallback=null;

function speak(lines,callback=null){

    dialogueQueue=lines;
    dialogueIndex=0;
    dialogueCallback=callback;

    dialogue.style.display="block";

    showDialogue();

}

function showDialogue(){

    if(dialogueIndex >= dialogueQueue.length){

        dialogue.style.display="none";

        if(dialogueCallback){
            const cb=dialogueCallback;
            dialogueCallback=null;
            cb();
        }

        return;
    }

    const line =
        dialogueQueue[dialogueIndex];

    speaker.textContent =
        line.speaker;

    cn.textContent =
        line.cn;

    py.textContent =
        line.py;

    /*
       Chinese speech
    */

    try{

        speechSynthesis.cancel();

        const utter =
            new SpeechSynthesisUtterance(
                line.cn
            );

        utter.lang="zh-TW";
        utter.rate=0.9;

        speechSynthesis.speak(
            utter
        );

    }catch(e){}

}

dialogueButton.onclick=()=>{

    dialogueIndex++;

    showDialogue();

};

/* =========================================================
   INTERACT
========================================================= */

function interact(){

    if(!currentInteraction) return;

    const item =
        currentInteraction;

    if(!item.active) return;

    item.active=false;

    document.getElementById(
        "interactHint"
    ).style.display="none";

    item.callback();

}

/* keyboard E */
window.addEventListener(
    "keydown",
    e=>{

        if(
            e.key.toLowerCase()==="e" ||
            e.key==="Enter"
        ){

            interact();

        }

    }
);

/* =========================================================
   UPDATE INTERACTION
========================================================= */

function updateInteraction(){

    currentInteraction=null;

    let closest=null;
    let closestDistance=Infinity;

    for(const item of interactions){

        if(!item.active) continue;

        const dx =
            player.position.x -
            item.position.x;

        const dz =
            player.position.z -
            item.position.z;

        const distance =
            Math.sqrt(
                dx*dx+
                dz*dz
            );

        if(
            distance < item.range &&
            distance < closestDistance
        ){

            closest=item;
            closestDistance=distance;

        }

    }

    if(closest){

        currentInteraction=closest;

        document.getElementById(
            "interactHint"
        ).style.display="block";

        document.getElementById(
            "interactHint"
        ).textContent=
            `💬 ${closest.text}  [E / INTERACT]`;

    }else{

        document.getElementById(
            "interactHint"
        ).style.display="none";

    }

}

/* =========================================================
   GIFT AREA
========================================================= */

function loadGiftArea(){

    clearWorld();

    player.position.set(
        0,
        2,
        20
    );

    player.angle=Math.PI;

    road(
        0,
        0,
        14,
        120,
        false
    );

    sidewalk(
        0,
        0,
        14,
        120,
        false
    );

    building(
        -12,
        -10,
        16,
        18,
        12,
        0xd58a8a,
        "禮物店"
    );

    npc(
        -2,
        -7,
        "店員"
    );

    interaction(
        -2,
        -7,
        "和店員說話",
        ()=>{

            speak([

                {
                    speaker:"店員",
                    cn:"你好！你想買什麼？",
                    py:"Nǐ hǎo! Nǐ xiǎng mǎi shénme?"
                },

                {
                    speaker:"阿豪",
                    cn:"我想買一個生日禮物。",
                    py:"Wǒ xiǎng mǎi yí ge shēngrì lǐwù."
                },

                {
                    speaker:"店員",
                    cn:"這個怎麼樣？",
                    py:"Zhège zěnmeyàng?"
                },

                {
                    speaker:"阿豪",
                    cn:"好，我要這個。",
                    py:"Hǎo, wǒ yào zhège."
                }

            ],()=>{

                stage=1;

                setObjective(
                    "問路人：怎麼去車站？"
                );

                loadStreetArea();

            });

        }
    );

}

/* =========================================================
   STREET AREA
========================================================= */

function loadStreetArea(){

    clearWorld();

    player.position.set(
        0,
        2,
        35
    );

    player.angle=Math.PI;

    road(
        0,
        0,
        14,
        150,
        false
    );

    sidewalk(
        0,
        0,
        14,

/* =========================================================
   GR STOP VISIBILITY
========================================================= */

function updateGRVisibility(){

    if(!window.GR_STOP) return;

    const dx =
        player.position.x -
        window.GR_STOP.x;

    const dz =
        player.position.z -
        window.GR_STOP.z;

    const distance =
        Math.sqrt(
            dx*dx+
            dz*dz
        );

    /*
       GR only becomes visually obvious
       when player is relatively close.
    */

    if(distance < 38){

        window.GR_STOP.sign.visible=true;

    }else{

        window.GR_STOP.sign.visible=false;

    }

}

const vocabGrid =
    document.getElementById(
        "vocabGrid"
    );

vocab.forEach(v=>{

    const div =
        document.createElement("div");

    div.className="vocab";

    div.innerHTML=`
        <div class="word">${v[0]}</div>
        <div class="pinyin">${v[1]}</div>
        <div class="meaning">${v[2]}</div>
    `;

    vocabGrid.appendChild(div);

});

document.getElementById(
    "vocabButton"
).onclick=()=>{

    document.getElementById(
        "vocabModal"
    ).style.display="flex";

};

document.getElementById(
    "closeVocab"
).onclick=()=>{

    document.getElementById(
        "vocabModal"
    ).style.display="none";

};

/* =========================================================
   START GAME
========================================================= */

document.getElementById(
    "startGame"
).onclick=()=>{

    document.getElementById(
        "story"
    ).style.display="none";

    speak([

        {
            speaker:"阿豪",
            cn:"糟糕！我的手機沒電了！",
            py:"Zāogāo! Wǒ de shǒujī méi diàn le!"
        },

        {
            speaker:"阿豪",
            cn:"Google Maps不能用了。",
            py:"Google Maps bù néng yòng le."
        },

        {
            speaker:"阿豪",
            cn:"看來我只能問路人了。",
            py:"Kànlái wǒ zhǐ néng wèn lùrén le."
        }

    ],()=>{

        stage=0;

        setObjective(
            "買一個生日禮物給小美"
        );

        loadGiftArea();

    });

};

/* =========================================================
   GAME LOOP
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );

    updatePlayer();

    updateInteraction();

    updateGRVisibility();

    updateRestaurantVisibility();

    renderer.render(
        scene,
        camera
    );

}

animate();

/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect =
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);

</script>

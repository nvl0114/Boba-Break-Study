<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boba Break Study - Petualangan Tamsui (PS1 Style)</title>
    <style>
        :root {
            --ps1-bg: #1e1e24;
            --ps1-box-bg: #121216;
            --ps1-border: #8c8c9e;
            --ps1-text: #f0f0f5;
            --ps1-accent: #f39c12;
            --ps1-btn: #34495e;
            --ps1-btn-hover: #4e6882;
        }

        body {
            font-family: 'Courier New', Courier, monospace; /* Gaya font retro klasik */
            background-color: var(--ps1-bg);
            color: var(--ps1-text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .game-container {
            width: 100%;
            max-width: 800px;
            background: var(--ps1-box-bg);
            border: 6px ridge var(--ps1-border);
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Header PS1 Style */
        .game-header {
            background-color: #2c2c35;
            border-bottom: 4px ridge var(--ps1-border);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .game-header h1 {
            margin: 0;
            font-size: 1rem;
            color: #ffd700;
            letter-spacing: 1px;
        }

        .vocab-btn {
            background-color: #7f8c8d;
            color: white;
            border: 3px outset #bdc3c7;
            padding: 6px 12px;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .vocab-btn:active {
            border-style: inset;
        }

        /* Main Game Screen */
        .game-screen {
            padding: 20px;
            min-height: 350px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Visual Karakter ala Harvest Moon PS1 (Low-Poly / Chunky Sprite Mockup) */
        .scene-viewport {
            width: 100%;
            height: 180px;
            background: linear-gradient(to bottom, #4a69bd, #60a3bc);
            border: 4px inset var(--ps1-border);
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 15px;
        }

        /* Simulasi Sprite Karakter Chibi PS1 */
        .ps1-sprite-container {
            position: absolute;
            bottom: 20px;
            display: flex;
            gap: 40px;
            align-items: flex-end;
        }

        .ps1-char {
            width: 48px;
            height: 64px;
            background: #e74c3c; /* Baju Ahao */
            border: 3px solid #000;
            border-radius: 12px 12px 4px 4px;
            position: relative;
            box-shadow: 2px 4px 0px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
        }

        /* Kepala kotak/chibi khas game lama */
        .ps1-char::before {
            content: '';
            position: absolute;
            top: -24px;
            width: 36px;
            height: 28px;
            background: #f5cd79;
            border: 3px solid #000;
            border-radius: 50% 50% 30% 30%;
        }

        /* Topi hijau Ahao */
        .ps1-char::after {
            content: '';
            position: absolute;
            top: -30px;
            width: 40px;
            height: 14px;
            background: #27ae60;
            border: 2px solid #000;
            border-radius: 10px 10px 0 0;
        }

        .scene-label {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: #fff;
            padding: 4px 8px;
            font-size: 0.75rem;
            border: 1px solid #fff;
        }

        /* Dialogue Box ala PS1 RPG */
        .dialogue-box {
            background: rgba(15, 15, 25, 0.95);
            border: 4px ridge var(--ps1-border);
            padding: 15px;
            margin-bottom: 15px;
            min-height: 80px;
        }

        .speaker {
            font-weight: bold;
            color: var(--ps1-accent);
            margin-bottom: 6px;
            font-size: 0.95rem;
        }

        .mandarin-text {
            font-size: 1.15rem;
            font-weight: bold;
            color: #ffffff;
            margin-top: 4px;
        }

        .pinyin-text {
            font-size: 0.85rem;
            color: #bdc3c7;
            margin-bottom: 6px;
        }

        /* Choices Area */
        .choices-area {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .choice-btn {
            background-color: var(--ps1-btn);
            border: 3px outset #7f8c8d;
            color: white;
            padding: 10px 15px;
            cursor: pointer;
            text-align: left;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.95rem;
            font-weight: bold;
            transition: background 0.1s;
        }

        .choice-btn:hover {
            background-color: var(--ps1-btn-hover);
            border-color: #ecf0f1;
        }

        .choice-btn:active {
            border-style: inset;
        }

        /* Modal Vocab */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: var(--ps1-box-bg);
            width: 90%;
            max-width: 500px;
            border: 4px ridge var(--ps1-border);
            padding: 20px;
            max-height: 80vh;
            overflow-y: auto;
            color: var(--ps1-text);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--ps1-border);
            padding-bottom: 8px;
            margin-bottom: 12px;
        }

        .close-btn {
            background: #c0392b;
            color: white;
            border: 2px outset #e74c3c;
            padding: 2px 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .vocab-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        .vocab-table th, .vocab-table td {
            border: 1px solid var(--ps1-border);
            padding: 6px 10px;
            text-align: left;
        }

        .vocab-table th {
            background-color: #2c2c35;
            color: #ffd700;
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="game-header">
        <h1>Boba Break: Tamsui Story (PS1 Edition)</h1>
        <button class="vocab-btn" onclick="openVocabModal()">📖 Vocab Menu</button>
    </div>

    <div class="game-screen" id="gameScreen">
        <!-- Render dinamis via JS -->
    </div>
</div>

<!-- Modal Vocab -->
<div class="modal" id="vocabModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 style="margin:0; color:#ffd700;">Keyword Vocabulary</h3>
            <button class="close-btn" onclick="closeVocabModal()">X</button>
        </div>
        <table class="vocab-table">
            <thead>
                <tr>
                    <th>Mandarin</th>
                    <th>Pinyin</th>
                    <th>English</th>
                </tr>
            </thead>
            <tbody id="vocabTableBody"></tbody>
        </table>
    </div>
</div>

<script>
    const vocabData = [
        { cn: "左", pinyin: "zuǒ", en: "Left" },
        { cn: "右", pinyin: "yòu", en: "Right" },
        { cn: "轉車 / 轉乘", pinyin: "zhuǎnchē / zhuǎnchéng", en: "Transfer / Change (transport)" },
        { cn: "火車", pinyin: "huǒchē", en: "Train" },
        { cn: "捷運 (MRT)", pinyin: "jiéyùn", en: "MRT / Rapid Transit" },
        { cn: "紅線", pinyin: "hóng xiàn", en: "Red Line" },
        { cn: "淡水", pinyin: "Dànshuǐ", en: "Tamsui (Place name)" },
        { cn: "公車", pinyin: "gōngchē", en: "Bus" },
        { cn: "銀行", pinyin: "yínháng", en: "Bank" },
        { cn: "生日快樂", pinyin: "shēngrì kuàilè", en: "Happy Birthday" }
    ];

    let currentStep = 0;

    const storySteps = [
        {
            sceneName: "Lokasi: Rumah / Toko Desa",
            speaker: "Ahao (阿豪)",
            text: "Waduh, HP-ku baterainya habis total! Gak bisa buka Google Maps buat ke restoran Xiaomei (小美) di 淡水 (Tamsui) dalam rangka ulang tahunnya.",
            pinyin: "Wǒ de shǒujī méidiàn le!",
            choices: [
                { text: "Beli hadiah kecil dulu di toko desa (Transaksi sederhana)", next: 1 }
            ]
        },
        {
            sceneName: "Lokasi: Jalan Desa",
            speaker: "Warga Lokal",
            text: "你想去車站嗎？搭 **105公車** (gōngchē), turun di depan **銀行** (yínháng - bank), terus naik **GR** ke stasiun.",
            pinyin: "Nǐ xiǎng qù chēzhàn ma? Dā 105 gōngchē...",
            choices: [
                { text: "Paham! Naik bus 105, turun di bank, lanjut GR ke stasiun.", next: 2 }
            ]
        },
        {
            sceneName: "Lokasi: Stasiun Kereta Lokal",
            speaker: "Ahao (阿豪)",
            text: "Sekarang aku naik **火車** (huǒchē - kereta) menuju Taipei Main Station.",
            pinyin: "Wǒ zài zuò huǒchē qù Táiběi.",
            choices: [
                { text: "Lanjut perjalanan ke Taipei Main Station", next: 3 }
            ]
        },
        {
            sceneName: "Lokasi: Taipei Main Station",
            speaker: "Petugas Stasiun",
            text: "Mau ke Tamsui? Kamu harus **轉乘** (zhuǎnchéng - transfer) ke **紅線** (hóng xiàn - Red Line) **捷運** (jiéyùn - MRT).",
            pinyin: "Qù Dànshuǐ? Nǐ děi zhuǎnchéng hóng xiàn jiéyùn.",
            choices: [
                { text: "Baik, saya transfer ke Red Line MRT.", next: 4 }
            ]
        },
        {
            sceneName: "Lokasi: Dalam Gerbong MRT",
            speaker: "Ahao (阿豪)",
            text: "Oke, gerbong MRT Red Line berjalan ke arah utara. Sebentar lagi sampai di stasiun akhir Tamsui.",
            pinyin: "Zài hóng xiàn jiéyùn shàng.",
            choices: [
                { text: "Turun di stasiun Tamsui dan cari restonya", next: 5 }
            ]
        },
        {
            sceneName: "Lokasi: Area Tamsui",
            speaker: "Warga Sekitar",
            text: "餐廳就在前面。先向**左** (zuǒ - kiri), terus belok ke **右** (yòu - kanan).",
            pinyin: "Xiān xiàng zuǒ, rùhòu guǎi yòu.",
            choices: [
                { text: "Jalan ke Kiri (左 - zuǒ) lalu Kanan (右 - yòu) sesuai petunjuk!", next: 6 }
            ]
        },
        {
            sceneName: "Lokasi: Restoran Tamsui (Selesai)",
            speaker: "Xiaomei & Ahao",
            text: " 🎉 **生日快樂 (Shēngrì kuàilè)!** Berhasil sampai di restoran Tamsui tepat waktu meskipun tanpa HP!",
            pinyin: "Shēngrì kuàilè!",
            choices: [
                { text: "Mainkan Ulang Petualangan", next: 0 }
            ]
        }
    ];

    function renderGame() {
        const step = storySteps[currentStep];
        const screen = document.getElementById('gameScreen');

        let choicesHTML = '';
        step.choices.forEach(choice => {
            choicesHTML += `<button class="choice-btn" onclick="nextStep(${choice.next})">${choice.text}</button>`;
        });

        screen.innerHTML = `
            <div class="scene-viewport">
                <div class="scene-label">${step.sceneName}</div>
                <div class="ps1-sprite-container">
                    <div class="ps1-char" title="Ahao"></div>
                </div>
            </div>
            <div class="dialogue-box">
                <div class="speaker">${step.speaker}</div>
                <div class="pinyin-text">${step.pinyin}</div>
                <div class="mandarin-text">${step.text}</div>
            </div>
            <div class="choices-area">
                ${choicesHTML}
            </div>
        `;
    }

    function nextStep(nextIndex) {
        currentStep = nextIndex;
        renderGame();
    }

    function openVocabModal() {
        document.getElementById('vocabModal').style.display = 'flex';
        const tbody = document.getElementById('vocabTableBody');
        tbody.innerHTML = '';
        vocabData.forEach(item => {
            tbody.innerHTML += `
                <tr>
                    <td><strong>${item.cn}</strong></td>
                    <td>${item.pinyin}</td>
                    <td>${item.en}</td>
                </tr>
            `;
        });
    }

    function closeVocabModal() {
        document.getElementById('vocabModal').style.display = 'none';
    }

    renderGame();
</script>

</body>
</html>

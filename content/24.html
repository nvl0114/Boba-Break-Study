<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>找路吧！| Boba Break Study</title><style>
/* ================================
   BASIC
================================ */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #dce8d7;
    font-family: Arial, "Microsoft JhengHei", sans-serif;
    color: #3d332e;
}

.game-container {
    width: min(900px, 95%);
    margin: 20px auto 50px;
}

/* ================================
   HEADER
================================ */

.header {
    text-align: center;
    background: #fff9eb;
    border: 4px solid #493b34;
    box-shadow: 6px 6px 0 #493b34;
    padding: 18px;
    margin-bottom: 20px;
}

.header h1 {
    margin: 0;
    font-size: clamp(24px, 6vw, 38px);
}

.header p {
    margin: 8px 0 0;
    color: #75645a;
}

/* ================================
   STORY
================================ */

.story {
    background: #fff9eb;
    border: 4px solid #493b34;
    box-shadow: 6px 6px 0 #493b34;
    padding: 20px;
    margin-bottom: 20px;
    line-height: 1.8;
    font-size: 16px;
}

.story-title {
    font-weight: bold;
    font-size: 20px;
    margin-bottom: 10px;
}

/* ================================
   DIALOGUE
================================ */

.dialogue {
    background: #fff;
    border-left: 6px solid #e59a74;
    padding: 15px;
    margin-top: 15px;
}

.dialogue-name {
    font-weight: bold;
    margin-bottom: 8px;
}

/* ================================
   FIRST PERSON WORLD
================================ */

.world-frame {
    border: 5px solid #493b34;
    overflow: hidden;
    background: #87bfe3;
    min-height: 370px;
    position: relative;
    box-shadow: 7px 7px 0 #493b34;
}

/* Sky */

.sky {
    position: absolute;
    top: 0;
    width: 100%;
    height: 48%;
    background: linear-gradient(
        #83c5e8,
        #bfe4f3
    );
}

/* Clouds */

.cloud {
    position: absolute;
    color: rgba(255,255,255,0.9);
    font-size: 45px;
}

.cloud.one {
    left: 8%;
    top: 5%;
}

.cloud.two {
    right: 10%;
    top: 10%;
    font-size: 35px;
}

/* Buildings */

.building {
    position: absolute;
    bottom: 40%;
    border: 4px solid #493b34;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    font-weight: bold;
    color: #382c27;
    padding: 5px;
}

.building.left {
    left: 3%;
}

.building.right {
    right: 3%;
}

.building.small {
    width: 20%;
    height: 32%;
}

.building.medium {
    width: 25%;
    height: 40%;
}

.building.large {
    width: 32%;
    height: 48%;
}

.bank {
    background: #f2d67a;
}

.hospital {
    background: #f2f2f2;
}

.store {
    background: #bde59e;
}

.mall {
    background: #eaa16f;
}

.station {
    background: #9ebbd1;
}

.pharmacy {
    background: #d4efcf;
}

.restaurant {
    background: #d97861;
    color: white;
}

/* Windows */

.windows {
    position: absolute;
    top: 15%;
    left: 15%;
    width: 70%;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 5px;
}

.window {
    height: 12px;
    background: #8dc2d8;
    border: 2px solid #493b34;
}

/* Road */

.ground {
    position: absolute;
    bottom: 0;
    height: 55%;
    width: 100%;
    background: #6e9b65;
}

.road {
    position: absolute;
    width: 46%;
    height: 100%;
    background: #8b8782;
    left: 27%;
    bottom: 0;

    clip-path: polygon(
        40% 0,
        60% 0,
        100% 100%,
        0 100%
    );
}

.road-center {
    position: absolute;
    width: 5px;
    height: 100%;
    background: repeating-linear-gradient(
        to bottom,
        #f5e8bc 0px,
        #f5e8bc 25px,
        transparent 25px,
        transparent 50px
    );

    left: 50%;
    transform: translateX(-50%);
}

/* Direction signs */

.sign {
    position: absolute;
    background: white;
    border: 3px solid #493b34;
    padding: 7px 10px;
    font-weight: bold;
    z-index: 5;
    box-shadow: 3px 3px 0 #493b34;
}

.sign.left {
    left: 7%;
    bottom: 27%;
}

.sign.right {
    right: 7%;
    bottom: 27%;
}

.sign.center {
    left: 50%;
    transform: translateX(-50%);
    bottom: 42%;
}

/* ================================
   LOCATION LABEL
================================ */

.location-label {
    margin-top: 18px;
    text-align: center;
    background: #fff0c9;
    border: 3px solid #493b34;
    padding: 12px;
    font-weight: bold;
}

/* ================================
   CONTROLS
================================ */

.controls {
    margin-top: 20px;
}

.controls h3 {
    text-align: center;
    margin-bottom: 12px;
}

.dpad {
    display: grid;
    grid-template-columns: repeat(3, 75px);
    grid-template-rows: repeat(2, 65px);
    gap: 8px;
    justify-content: center;
}

.direction-btn {
    border: 4px solid #493b34;
    background: #fff9eb;
    box-shadow: 4px 4px 0 #493b34;
    font-size: 25px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.1s;
}

.direction-btn:hover {
    background: #ffe4aa;
}

.direction-btn:active {
    transform: translate(4px, 4px);
    box-shadow: none;
}

.forward {
    grid-column: 2;
}

.left-btn {
    grid-column: 1;
    grid-row: 2;
}

.back {
    grid-column: 2;
    grid-row: 2;
}

.right-btn {
    grid-column: 3;
    grid-row: 2;
}

/* ================================
   STATUS
================================ */

.status {
    min-height: 60px;
    margin-top: 20px;
    border: 3px solid #493b34;
    padding: 15px;
    text-align: center;
    background: white;
    line-height: 1.5;
}

.status.success {
    background: #d9edcf;
    border-color: #527b4a;
}

.status.error {
    background: #f5d0ca;
    border-color: #a34f48;
}

/* ================================
   BUTTONS
================================ */

.extra-buttons {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 18px;
    flex-wrap: wrap;
}

.extra-btn {
    padding: 10px 15px;
    border: 3px solid #493b34;
    background: white;
    box-shadow: 3px 3px 0 #493b34;
    cursor: pointer;
    font-weight: bold;
}

.extra-btn:active {
    transform: translate(3px, 3px);
    box-shadow: none;
}

/* ================================
   HINT
================================ */

.hint {
    display: none;
    margin-top: 15px;
    background: #e3eef6;
    border: 3px solid #63849a;
    padding: 14px;
    text-align: center;
    line-height: 1.6;
}

/* ================================
   WRONG SCREEN
================================ */

.wrong-overlay {
    display: none;
    position: absolute;
    inset: 0;
    z-index: 30;
    background: rgba(50,40,35,0.9);
    color: white;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 30px;
}

.wrong-overlay.show {
    display: flex;
}

.wrong-box {
    max-width: 400px;
}

.wrong-box h2 {
    font-size: 35px;
}

/* ================================
   FINISH
================================ */

.finish-screen {
    display: none;
    background: #fff9eb;
    border: 5px solid #493b34;
    box-shadow: 7px 7px 0 #493b34;
    text-align: center;
    padding: 30px;
}

.finish-scene {
    position: relative;
    height: 280px;
    margin: 20px 0;
    border: 4px solid #493b34;
    background: #f5cc86;
    overflow: hidden;
}

.finish-restaurant {
    position: absolute;
    width: 70%;
    height: 55%;
    left: 15%;
    bottom: 10%;
    background: #d97861;
    border: 5px solid #493b34;
    color: white;
    font-size: 25px;
    padding-top: 25px;
    font-weight: bold;
}

.people {
    position: absolute;
    bottom: 12%;
    width: 100%;
    font-size: 50px;
}

@media (max-width: 600px) {

    .world-frame {
        min-height: 330px;
    }

    .building {
        font-size: 12px;
    }

    .dpad {
        grid-template-columns: repeat(3, 65px);
        grid-template-rows: repeat(2, 58px);
    }

    .story {
        font-size: 15px;
    }

}

    <h1>🧭 找路吧！</h1>

                </p>

    <div class="controls">

        <h3>你要怎麼走？</h3>

        <div class="dpad">

            <button
                class="direction-btn forward"
                onclick="chooseDirection('forward')"
            >
                ↑
            </button>

            <button
                class="direction-btn left-btn"
                onclick="chooseDirection('left')"
            >
                ←
            </button>

            <button
                class="direction-btn back"
                onclick="chooseDirection('back')"
            >
                ↓
            </button>

            <button
                class="direction-btn right-btn"
                onclick="chooseDirection('right')"
            >
                →
            </button>

        </div>

    </div>

    <div class="status" id="status">
        仔細聽路人的指示，然後選擇方向。
    </div>

    <div class="extra-buttons">

        <button
            class="extra-btn"
            onclick="showHint()"
        >
            💡 提示
        </button>

        <button
            class="extra-btn"
            onclick="restartGame()"
        >
            🔄 重新開始
        </button>

    </div>

    <div class="hint" id="hintBox"></div>

</div>

<div class="finish-screen" id="finishScreen">

    <h1>🎉 你到了！</h1>

    <h2>小美，生日快樂！</h2>

    <div class="finish-scene">

        <div class="finish-restaurant">
            🏮 海風小館
        </div>

        <div class="people">
            🧑🎁 👩 🎂 🧑‍🤝‍🧑
        </div>

    </div>

    <p>
        阿豪終於找到海風小館，
        成功參加小美的生日晚餐！🎉
    </p>

    <button
        class="extra-btn"
        onclick="restartGame()"
    >
        🔄 再玩一次
    </button>

</div>

</div><script>

/* ==========================================
   GAME STATE
========================================== */

let currentStep = 0;

let previousStep = 0;


/* ==========================================

   The player must understand the Mandarin

========================================== */

const steps = [

    /* --------------------------------------

    {

        },

/* ==========================================
   ELEMENTS
========================================== */

const storyBox =
    document.getElementById("storyBox");

const locationLabel =
    document.getElementById("locationLabel");

const statusBox =
    document.getElementById("status");

const hintBox =
    document.getElementById("hintBox");

const buildingLeft =
    document.getElementById("buildingLeft");

const buildingRight =
    document.getElementById("buildingRight");

const buildingCenter =
    document.getElementById("buildingCenter");

const signLeft =
    document.getElementById("signLeft");

const signRight =
    document.getElementById("signRight");

const signCenter =
    document.getElementById("signCenter");

const wrongOverlay =
    document.getElementById("wrongOverlay");


/* ==========================================
   BUILDING CONFIGURATION
========================================== */

function getBuildingClass(type) {

    const classes = {

        bank: "bank",

        hospital: "hospital",

        store: "store",

        mall: "mall",

        station: "station",

        pharmacy: "pharmacy",

        restaurant: "restaurant",

        park: "store",

        cafe: "mall",

        toilet: "hospital",

        redline: "station",

        bus: "mall",

        parking: "hospital",

        exit: "store",

        platform: "station",

        water: "station",

        road: "hospital",

        building: "mall"

    };

    return classes[type] || "store";

}


function createBuildingHTML(place, side) {

    if (!place) return "";


    return `
        <div class="building ${side} medium ${getBuildingClass(place.type)}">

            <div class="windows">

                <div class="window"></div>
                <div class="window"></div>
                <div class="window"></div>

            </div>

            <span>${place.name}</span>

        </div>
    `;

}


/* ==========================================
   SIGN HTML
========================================== */

function createSign(place, position) {

    if (!place) return "";


    return `
        <div class="sign ${position}">
            ${place.name}
        </div>
    `;

}


/* ==========================================
   RENDER STEP
========================================== */

function renderStep() {

    if (currentStep >= steps.length) {

        finishGame();

        return;

    }


    const step =
        steps[currentStep];


    storyBox.innerHTML = `

        ${step.story}

        <div class="dialogue">

            <div class="dialogue-name">
                💬 指示
            </div>

            ${step.dialogue}

        </div>

    `;


    locationLabel.innerHTML =
        step.location;


    buildingLeft.innerHTML =
        createBuildingHTML(
            step.left,
            "left"
        );


    buildingRight.innerHTML =
        createBuildingHTML(
            step.right,
            "right"
        );


    buildingCenter.innerHTML = "";


    signLeft.innerHTML =
        step.left
            ? createSign(
                step.left,
                "left"
            )
            : "";


    signRight.innerHTML =
        step.right
            ? createSign(
                step.right,
                "right"
            )
            : "";


    signCenter.innerHTML =
        step.center
            ? createSign(
                step.center,
                "center"
            )
            : "";


    statusBox.textContent =
        "仔細閱讀指示，然後選擇方向。";

    statusBox.className =
        "status";


    hintBox.style.display =
        "none";


    wrongOverlay.classList.remove(
        "show"
    );

}


/* ==========================================
   CHOOSE DIRECTION
========================================== */

function chooseDirection(direction) {

    const step =
        steps[currentStep];


    if (
        direction === step.correct
    ) {

        statusBox.innerHTML =
            "✅ 走對了！";

        statusBox.className =
            "status success";


        previousStep =
            currentStep;


        setTimeout(() => {

            currentStep++;

            renderStep();

        }, 700);

    }

    else {

        statusBox.innerHTML =
            "❌ 你走錯路了！";

        statusBox.className =
            "status error";


        setTimeout(() => {

            wrongOverlay.classList.add(
                "show"
            );

        }, 300);

    }

}


/* ==========================================
   GO BACK
========================================== */

function goBack() {

    wrongOverlay.classList.remove(
        "show"
    );


    statusBox.textContent =
        "再仔細想一想路人的指示。";

    statusBox.className =
        "status";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* ==========================================
   HINT
========================================== */

function showHint() {

    const step =
        steps[currentStep];


    hintBox.innerHTML =
        "💡 <strong>提示：</strong><br>" +
        step.hint;


    hintBox.style.display =
        "block";

}


/* ==========================================
   FINISH GAME
========================================== */

function finishGame() {

    document
        .getElementById("gameArea")
        .style.display =
        "none";


    document
        .getElementById("finishScreen")
        .style.display =
        "block";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* ==========================================
   RESTART
========================================== */

function restartGame() {

    currentStep = 0;

    previousStep = 0;


    document
        .getElementById("gameArea")
        .style.display =
        "block";


    document
        .getElementById("finishScreen")
        .style.display =
        "none";


    renderStep();


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* ==========================================
   KEYBOARD SUPPORT
========================================== */

document.addEventListener(
    "keydown",

    function(event) {

        if (
            wrongOverlay.classList.contains(
                "show"
            )
        ) {
            return;
        }


        if (
            event.key === "ArrowUp"
        ) {

            chooseDirection(
                "forward"
            );

        }


        if (
            event.key === "ArrowLeft"
        ) {

            chooseDirection(
                "left"
            );

        }


        if (
            event.key === "ArrowRight"
        ) {

            chooseDirection(
                "right"
            );

        }


        if (
            event.key === "ArrowDown"
        ) {

            chooseDirection(
                "back"
            );

        }

    }

);


/* ==========================================
   START GAME
========================================== */

renderStep();

</script></body>

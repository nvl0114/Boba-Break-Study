/* =========================================

/* =========================================
   MESSAGE
========================================= */

#message{
    position:fixed;

    left:50%;

}

/* =========================================
   INTERACTION HINT
========================================= */

#interactionHint{
    position:fixed;

    left:50%;
    bottom:150px;

    transform:translateX(-50%);

    z-index:35;

    display:none;

    background:rgba(255,255,255,.97);

    border:3px solid #5b4037;
    border-radius:14px;

    padding:9px 15px;

    color:#513b33;

    font-weight:bold;
    font-size:13px;

    box-shadow:0 5px 15px rgba(0,0,0,.2);
}

/* =========================================
   CROSSHAIR
========================================= */

#crosshair{
    position:fixed;

    left:50%;
    top:50%;

    width:16px;
    height:16px;

    transform:translate(-50%,-50%);

    z-index:10;

    pointer-events:none;
}

#crosshair::before,
#crosshair::after{
    content:"";

    position:absolute;

    background:#fff;

    box-shadow:0 0 3px #000;
}

#crosshair::before{
    width:16px;
    height:2px;
    top:7px;
}

#crosshair::after{
    width:2px;
    height:16px;
    left:7px;
}

/* =========================================
   CONTROLS
========================================= */

#controls{
    position:fixed;

    left:50%;
    bottom:15px;

    transform:translateX(-50%);

    width:min(95%,700px);

    display:flex;

    align-items:flex-end;
    justify-content:space-between;

    z-index:40;
}

#movePad{
    display:grid;

    grid-template-columns:
        repeat(3,58px);

    grid-template-rows:

}

.ctrl{

    touch-action:none;

}

.ctrl:active{

}

#forward{
    grid-column:2;
}

#left{

#backward{

#right{

</div><!-- =========================================
     THREE.JS
========================================= --><script type="module">

import * as THREE from "three";

/* =========================================
   DOM
========================================= */

const objectiveText =
    document.getElementById(
        "objectiveText"
    );

const message =
    document.getElementById(
        "message"
    );

const interactionHint =
    document.getElementById(
        "interactionHint"
    );

const dialogueOverlay =
    document.getElementById(
        "dialogueOverlay"
    );

const speakerEl =
    document.getElementById(
        "speaker"
    );

const chineseEl =
    document.getElementById(
        "chinese"
    );

const pinyinEl =
    document.getElementById(
        "pinyin"
    );

const nextBtn =
    document.getElementById(
        "nextBtn"
    );

const soundBtn =
    document.getElementById(
        "soundBtn"
    );

/* =========================================
   THREE
========================================= */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(
        0x9edcff
    );

scene.fog =
    new THREE.Fog(
        0x9edcff,
        55,
        230
    );

const camera =
    new THREE.PerspectiveCamera(
        70,
        innerWidth / innerHeight,
        .1,
        600
    );

const renderer =
    new THREE.WebGLRenderer({
        antialias:true
    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(
        devicePixelRatio,
        2
    )
);

renderer.shadowMap.enabled=true;

document.body.appendChild(
    renderer.domElement
);

/* =========================================
   LIGHT
========================================= */

const hemi =
    new THREE.HemisphereLight(
        0xffffff,
        0x6e9b59,
        2.3
    );

const sun =
    new THREE.DirectionalLight(
        0xffffff,
        2
    );

sun.position.set(
    40,
    70,
    30
);

scene.add(hemi);
scene.add(sun);

/* =========================================
   MATERIAL
========================================= */

const mat={

    grass:
        new THREE.MeshStandardMaterial({
            color:0x89c96d
        }),

    road:
        new THREE.MeshStandardMaterial({
            color:0x64676d
        }),

    wall:
        new THREE.MeshStandardMaterial({
            color:0xe7c5a0
        }),

    pink:
        new THREE.MeshStandardMaterial({
            color:0xff9bb0
        }),

    yellow:
        new THREE.MeshStandardMaterial({
            color:0xffd05d
        }),

    blue:
        new THREE.MeshStandardMaterial({
            color:0x7ac9ed
        }),

    white:
        new THREE.MeshStandardMaterial({
            color:0xffffff
        }),

    roof:
        new THREE.MeshStandardMaterial({
            color:0xba7064
        })

};

/* =========================================
   GAME
========================================= */

let stage=1;

let paused=false;

let interactables=[];

let blocked=[];

const player={

    x:0,

    z:30,

    angle:0,

    speed:.27,

    turnSpeed:.045

};

const keys={

    forward:false,

    backward:false,

    left:false,

    right:false

};

/* =========================================
   WORLD HELPERS
========================================= */

function addBox(
    x,
    y,
    z,
    w,
    h,
    d,
    material
){

    const mesh =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                w,
                h,
                d
            ),

            material

        );

    mesh.position.set(
        x,
        y,
        z
    );

    scene.add(mesh);

    return mesh;
}

function addRoad(
    x,
    z,
    w,
    d
){

    return addBox(

        x,
        0,
        z,

        w,
        .1,
        d,

        mat.road

    );
}

function addBlocked(
    x,
    z,
    w,
    d
){

    blocked.push({

        minX:x-w/2,
        maxX:x+w/2,

        minZ:z-d/2,
        maxZ:z+d/2

    });
}

function isBlocked(
    x,
    z
){

    for(
        const b of blocked
    ){

        if(

            x>b.minX &&
            x<b.maxX &&
            z>b.minZ &&
            z<b.maxZ

        ){

            return true;
        }
    }

    return false;
}

/* =========================================
   SIGN
========================================= */

function createSign(
    text
){

    const canvas =
        document.createElement(
            "canvas"
        );

    canvas.width=512;
    canvas.height=150;

    const ctx =
        canvas.getContext("2d");

    ctx.fillStyle="#ffffff";

    ctx.fillRect(
        0,
        0,
        512,
        150
    );

    ctx.strokeStyle="#5b4037";

    ctx.lineWidth=9;

    ctx.strokeRect(
        5,
        5,
        502,
        140
    );

    ctx.fillStyle="#49332d";

    ctx.font=
        "bold 56px Microsoft JhengHei";

    ctx.textAlign="center";

    ctx.textBaseline="middle";

    ctx.fillText(
        text,
        256,
        75
    );

    const texture =
        new THREE.CanvasTexture(
            canvas
        );

    const sprite =
        new THREE.Sprite(

            new THREE.SpriteMaterial({
                map:texture
            })

        );

    sprite.scale.set(
        10,
        3,
        1
    );

    return sprite;
}

function sign(
    text,
    x,
    y,
    z
){

    const s =
        createSign(text);

    s.position.set(
        x,
        y,
        z
    );

    scene.add(s);

    return s;
}

/* =========================================
   BUILDING
========================================= */

function building(
    name,
    x,
    z,
    w=12,
    d=10,
    material=mat.wall,
    showSign=true
){

    addBox(
        x,
        4,
        z,
        w,
        8,
        d,
        material
    );

    addBox(
        x,
        8.5,
        z,
        w+1,
        1,
        d+1,
        mat.roof
    );

    if(showSign){

        sign(
            name,
            x,
            10,
            z+d/2+1
        );

    }

    addBlocked(
        x,
        z,
        w,
        d
    );
}

/* =========================================
   NPC
========================================= */

function npc(
    name,
    x,
    z,
    type
){

    const group =
        new THREE.Group();

    const body =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                1.3,
                2.2,
                .8
            ),

            mat.blue

        );

    body.position.y=1.2;

    const head =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                .72,
                14,
                14
            ),

            new THREE.MeshStandardMaterial({
                color:0xf2b98f
            })

        );

    head.position.y=3.1;

    group.add(body);
    group.add(head);

    group.position.set(
        x,
        0,
        z
    );

    scene.add(group);

    sign(
        name,
        x,
        5,
        z
    );

    interactables.push({

        object:group,

        type:type,

        range:5

    });
}

/* =========================================
   INTERACTIVE OBJECT
========================================= */

function interactivePoint(
    name,
    x,
    z,
    type,
    visible=true
){

    const marker =
        addBox(

            x,
            1.2,
            z,

            3,
            2.4,
            .7,

            mat.yellow

        );

    const s =
        sign(
            name,
            x,
            4,
            z
        );

    if(!visible){

        marker.visible=false;
        s.visible=false;

    }

    interactables.push({

        object:marker,

        sign:s,

        type:type,

        range:6

    });

    return marker;
}

/* =========================================
   HIDE DISTANT DESTINATIONS
========================================= */

function updateDestinationVisibility(){

    for(
        const item of interactables
    ){

        if(
            !item.sign ||
            !item.object.userData.destination
        ){

            continue;
        }

        const dx=
            player.x -
            item.object.position.x;

        const dz=
            player.z -
            item.object.position.z;

        const distance=
            Math.sqrt(
                dx*dx+
                dz*dz
            );

        const visible =
            distance < 35;

        item.object.visible=
            visible;

        item.sign.visible=
            visible;
    }
}

/* =========================================
   CLEAR WORLD
========================================= */

function clearWorld(){

    while(
        scene.children.length
    ){

        scene.remove(
            scene.children[0]
        );

    }

    scene.add(hemi);
    scene.add(sun);

    interactables=[];
    blocked=[];

    addBox(

        0,
        -.5,
        0,

        500,
        1,
        500,

        mat.grass

    );
}

/* =========================================
   CAMERA
========================================= */

function updateCamera(){

    camera.position.set(

        player.x,
        2.4,
        player.z

    );

    /*
       Player looks toward
       +Z when angle = 0.
    */

    camera.rotation.order=
        "YXZ";

    camera.rotation.y=
        player.angle;

    camera.rotation.x=0;
}

/* =========================================
   STAGE 1
   GIFT SHOP
========================================= */

function loadGiftArea(){

    clearWorld();

    addRoad(
        0,
        20,
        18,
        110
    );

    building(
        "禮物店",
        -16,
        15,
        13,
        12,
        mat.pink
    );

    building(
        "咖啡店",
        16,
        0,
        13,
        12,
        mat.yellow
    );

    npc(
        "店員",
        -7,
        15,
        "gift"
    );

    npc(
        "路人",

/* =========================================
   SPEECH
========================================= */

function speak(
    text
){

    if(
        !("speechSynthesis" in window)
    ){

        return;
    }

    speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(
            text
        );

    utterance.lang="zh-TW";

    utterance.rate=.82;

    utterance.pitch=1;

    speechSynthesis.speak(
        utterance
    );
}

/* =========================================
   DIALOGUE
========================================= */

let dialogue=[];

let dialogueIndex=0;

let dialogueCallback=null;

function startDialogue(
    lines,
    callback=null
){

    dialogue=lines;

    dialogueIndex=0;

    dialogueCallback=
        callback;

    paused=true;

    dialogueOverlay.style.display=
        "flex";

    showDialogue();
}

function showDialogue(){

    const line=
        dialogue[
            dialogueIndex
        ];

    speakerEl.textContent=
        line.speaker;

    chineseEl.textContent=
        line.chinese;

    pinyinEl.textContent=
        line.pinyin;

    speak(
        line.chinese
    );

    nextBtn.textContent=

        dialogueIndex ===
        dialogue.length-1

        ? "好的"

        : "繼續";
}

soundBtn.onclick=()=>{

    if(
        dialogue[
            dialogueIndex
        ]
    ){

        speak(
            dialogue[
                dialogueIndex
            ].chinese
        );

    }

};

nextBtn.onclick=()=>{

    speechSynthesis.cancel();

    dialogueIndex++;

    if(
        dialogueIndex >=
        dialogue.length
    ){

        dialogueOverlay.style.display=
            "none";

        paused=false;

        if(
            dialogueCallback
        ){

            dialogueCallback();
        }

        return;
    }

    showDialogue();
};

/* =========================================
   NEAREST INTERACTION
========================================= */

function getNearest(){

    let nearest=null;

    let distanceBest=
        Infinity;

    for(
        const item of interactables
    ){

        if(
            !item.object.visible
        ){

            continue;
        }

        const p=
            item.object.position;

        const dx=
            player.x-p.x;

        const dz=
            player.z-p.z;

        const distance=
            Math.sqrt(
                dx*dx+
                dz*dz
            );

        if(

            distance<
            item.range &&

            distance<
            distanceBest

        ){

            nearest=item;

            distanceBest=
                distance;

        }

    }

    return nearest;
}

/* =========================================
   MOVEMENT
========================================= */

function updatePlayer(){

    if(paused){
        return;
    }

    /*
       LEFT / RIGHT
       = ROTATE
    */

    if(keys.left){

        player.angle +=
            player.turnSpeed;

    }

    if(keys.right){

        player.angle -=
            player.turnSpeed;

    }

    /*
       UP / DOWN
       = FORWARD / BACKWARD
    */

    let movement=0;

    if(keys.forward){

        movement=
            player.speed;

    }

    if(keys.backward){

        movement=
            -player.speed;

    }

    if(movement!==0){

        const nx=
            player.x+
            Math.sin(
                player.angle
            )*
            movement;

        const nz=
            player.z+
            Math.cos(
                player.angle
            )*
            movement;

        /*
           Collision X
        */

        if(
            !isBlocked(
                nx,
                player.z
            )
        ){

            player.x=nx;

        }

        /*
           Collision Z
        */

        if(
            !isBlocked(
                player.x,
                nz
            )
        ){

            player.z=nz;

        }

    }

    updateCamera();
}

/* =========================================
   MOBILE HOLD
========================================= */

function bindHold(
    id,
    key
){

    const button =
        document.getElementById(
            id
        );

    button.addEventListener(
        "pointerdown",
        event=>{

            event.preventDefault();

            button.setPointerCapture(
                event.pointerId
            );

            keys[key]=true;

        }
    );

    button.addEventListener(
        "pointerup",
        ()=>{

            keys[key]=false;

        }
    );

    button.addEventListener(
        "pointercancel",
        ()=>{

            keys[key]=false;

        }
    );

    button.addEventListener(
        "lostpointercapture",
        ()=>{

            keys[key]=false;

        }
    );
}

bindHold(
    "forward",
    "forward"
);

bindHold(
    "backward",
    "backward"
);

bindHold(
    "left",
    "left"
);

bindHold(
    "right",
    "right"
);

    event=>{

        if(
            event.key==="ArrowUp" ||
            event.key==="w" ||
            event.key==="W"
        ){

            keys.forward=true;

        }

        if(
            event.key==="ArrowDown" ||
            event.key==="s" ||
            event.key==="S"
        ){

            keys.backward=true;

        }

        if(
            event.key==="ArrowLeft" ||
            event.key==="a" ||
            event.key==="A"
        ){

            keys.left=true;

        }

        if(
            event.key==="ArrowRight" ||
            event.key==="d" ||
            event.key==="D"
        ){

            keys.right=true;

        }

        if(
            event.key==="e" ||
            event.key==="E" ||
            event.key===" "
        ){

            interact();

        }

    }
);

window.addEventListener(
    "keyup",
    event=>{

        if(
            event.key==="ArrowUp" ||
            event.key==="w" ||
            event.key==="W"
        ){

            keys.forward=false;

        }

        if(
            event.key==="ArrowDown" ||
            event.key==="s" ||
            event.key==="S"
        ){

            keys.backward=false;

        }

        if(
            event.key==="ArrowLeft" ||
            event.key==="a" ||

        ){

            keys.left=false;

        }

        if(
            event.key==="ArrowRight" ||

            event.key==="D"
        ){

            keys.right=false;

        }

    }
);

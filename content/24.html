<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Boba Break Study - Mobile Isometric Game</title>
    <style>
        * { box-sizing: border-box; touch-action: manipulation; }
        body {
            background-color: #121212;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
        }
        .game-card {
            width: 100%; max-width: 420px; height: 100vh; max-height: 750px;
            background: #231f20; display: flex; flex-direction: column;
            position: relative; overflow: hidden; border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        
        /* Area Peta Isometrik */
        .map-viewport {
            flex: 1;
            /* Latar Belakang Desaku Isometric 3D Estetik */
            background: url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=800&auto=format&fit=crop') center/cover;
            position: relative; overflow: hidden;
        }

        /* Overlay karakter & NPC */
        .entity {
            position: absolute; transform: translate(-50%, -50%);
            transition: all 0.2s linear; display: flex; flex-direction: column; align-items: center;
        }
        .entity-label {
            background: rgba(0,0,0,0.7); color: #fff; font-size: 10px; font-weight: bold;
            padding: 2px 6px; border-radius: 10px; white-space: nowrap; margin-bottom: 2px;
            border: 1px solid #e67e22;
        }
        .avatar {
            width: 36px; height: 36px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; font-size: 18px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        #player { z-index: 10; }
        #player .avatar { background: #e74c3c; border: 2px solid #fff; }
        
        .npc .avatar { background: #3498db; border: 2px solid #f1c40f; }

        /* Dialog Box HP */
        .dialogue-panel {
            background: rgba(28, 25, 23, 0.95);
            border-top: 3px solid #e67e22; padding: 12px 16px; min-height: 140px;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .speaker { color: #f39c12; font-weight: bold; font-size: 14px; margin-bottom: 2px; }
        .pinyin { color: #bdc3c7; font-size: 11px; font-style: italic; }
        .text { font-size: 13px; line-height: 1.3; margin: 4px 0; }

        /* Tombol D-Pad Layar Sentuh HP */
        .dpad-container {
            position: absolute; bottom: 150px; left: 15px;
            width: 100px; height: 100px; display: grid;
            grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
            gap: 2px; opacity: 0.8;
        }
        .dbtn {
            background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.3);
            color: white; border-radius: 6px; display: flex;
            justify-content: center; align-items: center; font-weight: bold;
            user-select: none;
        }
        .dbtn:active { background: #e67e22; }

        .top-btn {
            position: absolute; top: 12px; right: 12px;
            background: #e67e22; color: white; border: none; padding: 6px 12px;
            border-radius: 15px; font-size: 12px; font-weight: bold; z-index: 20;
        }
    </style>
</head>
<body>

<div class="game-card">
    <button class="top-btn" onclick="alert('Kosakata Tamsui:\n• 公車 (gōngchē) = Bus\n• 火車 (huǒchē) = Kereta\n• 捷運 (jiéyùn) = MRT\n• 左 (zuǒ) = Kiri | 右 (yòu) = Kanan')">📖 Vocab</button>

    <!-- Layar Game Isometrik -->
    <div class="map-viewport" id="mapView" onclick="moveByTap(event)">
        <!-- Karakter Ahao -->
        <div class="entity" id="player" style="left: 20%; top: 70%;">
            <div class="entity-label">Ahao (阿豪)</div>
            <div class="avatar">👦</div>
        </div>

        <!-- NPC 1: Warga Desa -->
        <div class="entity npc" id="npc1" style="left: 45%; top: 50%;">
            <div class="entity-label">Warga Desa</div>
            <div class="avatar">👨‍🌾</div>
        </div>

        <!-- NPC 2: Petugas Stasiun -->
        <div class="entity npc" id="npc2" style="left: 80%; top: 30%;">
            <div class="entity-label">Petugas Stasiun</div>
            <div class="avatar">👮</div>
        </div>
    </div>

    <!-- D-Pad Kontrol HP -->
    <div class="dpad-container">
        <div></div><div class="dbtn" onclick="move(0, -5)">▲</div><div></div>
        <div class="dbtn" onclick="move(-5, 0)">◀</div><div></div><div class="dbtn" onclick="move(5, 0)">▶</div>
        <div></div><div class="dbtn" onclick="move(0, 5)">▼</div><div></div>
    </div>

    <!-- Kotak Dialog Teks -->
    <div class="dialogue-panel">
        <div>
            <div class="speaker" id="spk">Petunjuk Navigasi</div>
            <div class="pinyin" id="pyn">Pencet D-Pad Panah atau Sentuh Layar untuk Menggerakkan Ahao.</div>
            <div class="text" id="txt">Misi: Dekati Warga Desa 👨‍🌾 di tengah peta untuk bertanya jalan ke Tamsui!</div>
        </div>
    </div>
</div>

<script>
    let posX = 20;
    let posY = 70;
    const player = document.getElementById('player');

    function move(dx, dy) {
        posX = Math.max(10, Math.min(90, posX + dx));
        posY = Math.max(20, Math.min(85, posY + dy));
        player.style.left = posX + '%';
        player.style.top = posY + '%';
        checkDistance();
    }

    function moveByTap(e) {
        const rect = document.getElementById('mapView').getBoundingClientRect();
        posX = ((e.clientX - rect.left) / rect.width) * 100;
        posY = ((e.clientY - rect.top) / rect.height) * 100;
        player.style.left = posX + '%';
        player.style.top = posY + '%';
        checkDistance();
    }

    function checkDistance() {
        // Dekat NPC 1 (Warga Desa)
        if(Math.abs(posX - 45) < 12 && Math.abs(posY - 50) < 12) {
            document.getElementById('spk').innerText = "Warga Desa";
            document.getElementById('pyn').innerText = "Nǐ xiǎng qù chēzhàn ma? Dā 105 gōngchē...";
            document.getElementById('txt').innerHTML = "Mau ke Tamsui? Naik <b>105 公車 (gōngchē - bus)</b>, turun di depan <b>銀行 (yínháng - bank)</b> lalu naik kereta <b>火車 (huǒchē)</b> ke Stasiun Taipei!";
        } 
        // Dekat NPC 2 (Petugas Stasiun)
        else if(Math.abs(posX - 80) < 12 && Math.abs(posY - 30) < 12) {
            document.getElementById('spk').innerText = "Petugas Stasiun Taipei";
            document.getElementById('pyn').innerText = "Qù Dànshuǐ? Nǐ děi zhuǎnchéng hóng xiàn jiéyùn.";
            document.getElementById('txt').innerHTML = "Di Stasiun Taipei, kamu harus <b>轉乘 (zhuǎnchéng - transfer)</b> ke <b>紅線 (hóng xiàn - Jalur Merah)</b> <b>捷運 (jiéyùn - MRT)</b> menuju Tamsui!";
        }
    }
</script>

</body>
</html>

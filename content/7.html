<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boba Break Study - Lesson 7 Vocabulary & Writing Practice</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Hanzi Writer CDN for writing stroke animations -->
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Plus Jakarta+Sans', sans-serif;
        }
    </style>
</head>
<body class="bg-amber-50 text-stone-800 min-h-screen flex flex-col">

    <!-- Navigation Header -->
    <header class="bg-white border-b border-amber-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="text-2xl">🧋</span>
                <h1 class="text-xl font-bold text-amber-900">Boba Break Study</h1>
            </div>
            <nav class="space-x-6 text-sm font-semibold text-stone-600">
                <a href="#" class="hover:text-amber-700">Dashboard</a>
                <a href="#" class="text-amber-700 border-b-2 border-amber-600 pb-1">Courses</a>
                <a href="#" class="hover:text-amber-700">Search</a>
                <a href="#" class="hover:text-amber-700">About</a>
            </nav>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow max-w-6xl mx-auto px-4 py-8 w-full grid grid-cols-1 md:grid-cols-3 gap-8">
        
        <!-- Left Column: Vocabulary List -->
        <section class="md:col-span-1 bg-white p-6 rounded-2xl shadow-sm border border-amber-100 flex flex-col h-[600px]">
            <h2 class="text-lg font-bold text-amber-900 mb-4 flex items-center justify-between">
                <span>Lesson 7 Vocabulary</span>
                <span class="text-xs bg-amber-100 text-amber-800 px-2 py-1 rounded-full">21 Words</span>
            </h2>
            <div id="vocab-list" class="overflow-y-auto space-y-2 pr-2 flex-grow">
                <!-- Javascript will populate this -->
            </div>
        </section>

        <!-- Right Column: Hanzi Writing Practice Canvas -->
        <section class="md:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-amber-100 flex flex-col items-center justify-between h-[600px]">
            <div class="w-full text-center">
                <h2 id="current-word-title" class="text-2xl font-bold text-stone-900">Select a word</h2>
                <p id="current-word-pinyin" class="text-amber-700 font-medium text-lg"></p>
                <p id="current-word-meaning" class="text-stone-500 text-sm"></p>
            </div>

            <!-- Writing Target Box -->
            <div class="my-auto flex flex-col items-center justify-center">
                <div id="character-target" class="w-48 h-48 border-2 border-dashed border-amber-300 rounded-xl bg-amber-50/30 flex items-center justify-center relative shadow-inner">
                    <span id="placeholder-text" class="text-stone-400 text-sm">Click a word to practice</span>
                </div>
                <div id="multi-char-container" class="flex space-x-2 mt-4"></div>
            </div>

            <!-- Control Buttons -->
            <div class="flex space-x-4 w-full justify-center">
                <button onclick="animateCurrentCharacter()" class="bg-amber-700 text-white px-5 py-2.5 rounded-xl font-semibold shadow hover:bg-amber-800 transition active:scale-95 text-sm">
                    Animate Strokes
                </button>
                <button onclick="quizCurrentCharacter()" class="bg-stone-200 text-stone-700 px-5 py-2.5 rounded-xl font-semibold hover:bg-stone-300 transition active:scale-95 text-sm">
                    Quiz Me
                </button>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-amber-200 py-4 text-center text-xs text-stone-500">
        &copy; 2026 Boba Break Study. Made with 🧋 and dedication.
    </footer>

    <!-- JavaScript Logic -->
    <script>
        // Updated writing characters for Lesson 7
        const writingCharacters = [
            { hanzi: "在", pinyin: "zài", meaning: "at / in / on" },
            { hanzi: "正在", pinyin: "zhèngzài", meaning: "in the middle of" },
            { hanzi: "家", pinyin: "jiā", meaning: "home / family" },
            { hanzi: "日本", pinyin: "Rìběn", meaning: "Japan" },
            { hanzi: "醫院", pinyin: "yīyuàn", meaning: "hospital" },
            { hanzi: "辦公室", pinyin: "bàngōngshì", meaning: "office" },
            { hanzi: "學校", pinyin: "xuéxiào", meaning: "school" },
            { hanzi: "教室", pinyin: "jiàoshì", meaning: "classroom" },
            { hanzi: "公園", pinyin: "gōngyuán", meaning: "park" },
            { hanzi: "哪裡", pinyin: "nǎlǐ", meaning: "where" },
            { hanzi: "讀書", pinyin: "dúshū", meaning: "study / read" },
            { hanzi: "上班", pinyin: "shàngbān", meaning: "go to work" },
            { hanzi: "上課", pinyin: "shàngkè", meaning: "attend class" },
            { hanzi: "運動", pinyin: "yùndòng", meaning: "exercise / sports" },
            { hanzi: "玩", pinyin: "wán", meaning: "play" },
            { hanzi: "遊戲", pinyin: "yóuxì", meaning: "game" },
            { hanzi: "蘋果", pinyin: "píngguǒ", meaning: "apple" },
            { hanzi: "香蕉", pinyin: "xiāngjiāo", meaning: "banana" },
            { hanzi: "教學", pinyin: "jiàoxué", meaning: "teaching" },
            { hanzi: "對", pinyin: "duì", meaning: "correct / right" },
            { hanzi: "和", pinyin: "hé", meaning: "and / with" }
        ];

        let currentIndex = 0;
        let currentWriter = null;

        const vocabListEl = document.getElementById('vocab-list');
        const titleEl = document.getElementById('current-word-title');
        const pinyinEl = document.getElementById('current-word-pinyin');
        const meaningEl = document.getElementById('current-word-meaning');
        const targetEl = document.getElementById('character-target');
        const multiContainer = document.getElementById('multi-char-container');
        const placeholderEl = document.getElementById('placeholder-text');

        // Render Vocabulary List
        function renderVocabList() {
            vocabListEl.innerHTML = '';
            writingCharacters.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = `p-3 rounded-xl border cursor-pointer transition flex justify-between items-center ${index === currentIndex ? 'border-amber-500 bg-amber-50/50' : 'border-stone-100 hover:border-amber-200 bg-stone-50'}`;
                card.innerHTML = `
                    <div>
                        <span class="font-bold text-lg text-stone-900">${item.hanzi}</span>
                        <span class="text-xs text-stone-500 ml-2">${item.pinyin}</span>
                    </div>
                    <span class="text-xs text-stone-600 truncate max-w-[120px]">${item.meaning}</span>
                `;
                card.onclick = () => selectWord(index);
                vocabListEl.appendChild(card);
            });
        }

        // Select Word to Practice
        function selectWord(index) {
            currentIndex = index;
            renderVocabList();
            
            const data = writingCharacters[currentIndex];
            titleEl.textContent = data.hanzi;
            pinyinEl.textContent = data.pinyin;
            meaningEl.textContent = data.meaning;

            targetEl.innerHTML = '';
            multiContainer.innerHTML = '';

            const firstChar = data.hanzi.charAt(0);
            
            // Render single main character writer
            currentWriter = HanziWriter.create(targetEl, firstChar, {
                width: 170,
                height: 170,
                padding: 5,
                showOutline: true,
                strokeAnimationSpeed: 1,
                strokeColor: '#78350f',
                outlineColor: '#d6d3d1',
                drawingColor: '#b45309'
            });

            // If multi-character word, show previews for other characters
            if (data.hanzi.length > 1) {
                for (let i = 0; i < data.hanzi.length; i++) {
                    const charBox = document.createElement('div');
                    charBox.className = `w-12 h-12 border rounded-lg flex items-center justify-center cursor-pointer text-lg font-bold ${i === 0 ? 'border-amber-600 bg-amber-100 text-amber-900' : 'border-stone-200 bg-stone-50 text-stone-600'}`;
                    charBox.textContent = data.hanzi[i];
                    charBox.onclick = () => {
                        targetEl.innerHTML = '';
                        currentWriter = HanziWriter.create(targetEl, data.hanzi[i], {
                            width: 170,
                            height: 170,
                            padding: 5,
                            showOutline: true,
                            strokeAnimationSpeed: 1,
                            strokeColor: '#78350f',
                            outlineColor: '#d6d3d1',
                            drawingColor: '#b45309'
                        });
                        // Highlight selected mini box
                        Array.from(multiContainer.children).forEach((child, idx) => {
                            child.className = `w-12 h-12 border rounded-lg flex items-center justify-center cursor-pointer text-lg font-bold ${idx === i ? 'border-amber-600 bg-amber-100 text-amber-900' : 'border-stone-200 bg-stone-50 text-stone-600'}`;
                        });
                    };
                    multiContainer.appendChild(charBox);
                }
            }
        }

        function animateCurrentCharacter() {
            if (currentWriter) {
                currentWriter.animateCharacter();
            }
        }

        function quizCurrentCharacter() {
            if (currentWriter) {
                currentWriter.quiz({
                    onComplete: function(summary) {
                        alert("Great job! Character completed perfectly.");
                    }
                });
            }
        }

        // Initialize on load
        renderVocabList();
        selectWord(0);
    </script>
</body>
</html>

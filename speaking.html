<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Boba Break Study - AI Speaking</title>

    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">

    <style>
        /* ================================
           BASE
        ================================= */

        body {
            background-color: #f8f9fa;
            display: flex;
            min-height: 100vh;
            color: #5c4033;
        }

        .app-container {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }

        .main-content {
            flex: 1;
            padding: 20px;
            min-width: 0;
        }

        /* ================================
           CARD
        ================================= */

        .card {
            background: #ffffff;
            border: 1px solid #eaeaea;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        /* ================================
           HEADER
        ================================= */

        .page-header {
            padding: 22px 24px;
            margin-bottom: 16px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .page-title {
            margin: 0;
            font-size: 25px;
            color: #5c4033;
        }

        .page-subtitle {
            margin: 6px 0 0;
            color: #8a7567;
            font-size: 14px;
        }

        .status-box {
            display: flex;
            align-items: center;
            gap: 7px;

            padding: 7px 11px;
            border-radius: 20px;

            background: #f3e5d8;
            color: #765437;

            font-size: 12px;
            font-weight: 600;

            white-space: nowrap;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #b5835a;
        }

        .status-box.thinking .status-dot {
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }

        /* ================================
           CHAT CARD
        ================================= */

        .chat-card {
            padding: 0;
            overflow: hidden;
        }

        .chat-area {
            height: calc(100vh - 330px);
            min-height: 430px;
            max-height: 760px;

            overflow-y: auto;
            padding: 22px;

            scroll-behavior: smooth;
        }

        /* ================================
           MESSAGE
        ================================= */

        .message-row {
            display: flex;
            margin-bottom: 17px;
            width: 100%;
        }

        .message-row.ai {
            justify-content: flex-start;
        }

        .message-row.user {
            justify-content: flex-end;
        }

        .message {
            max-width: 78%;
            padding: 12px 15px;

            border-radius: 13px;

            font-size: 15px;
            line-height: 1.65;

            word-break: break-word;
        }

        .message.ai {
            background: #ffffff;
            border: 1px solid #e7e0db;
            color: #5c4033;

            border-top-left-radius: 4px;
        }

        .message.user {
            background: #f3e5d8;
            color: #5c4033;

            border-top-right-radius: 4px;
        }

        .message-label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 4px;
            opacity: 0.65;
        }

        .message-text {
            white-space: pre-wrap;
        }

        /* ================================
           MESSAGE ACTIONS
        ================================= */

        .message-actions {
            display: flex;
            gap: 6px;
            margin-top: 9px;
        }

        .listen-button {
            border: none;
            background: #f8f1eb;
            color: #765437;

            border-radius: 8px;
            padding: 5px 9px;

            cursor: pointer;
            font-size: 12px;

            transition: 0.15s;
        }

        .listen-button:hover {
            background: #eee0d3;
        }

        /* ================================
           TYPING
        ================================= */

        .typing-indicator {
            display: none;
            align-items: center;
            gap: 5px;

            padding: 11px 14px;
            width: fit-content;

            border: 1px solid #e7e0db;
            border-radius: 13px;
            border-top-left-radius: 4px;

            background: #ffffff;
        }

        .typing-indicator.show {
            display: flex;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #b5835a;

            animation: typing 1.2s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.15s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
            }

            30% {
                transform: translateY(-4px);
            }
        }

        /* ================================
           INPUT
        ================================= */

        .input-section {
            border-top: 1px solid #eeeeee;
            padding: 15px;
            background: #ffffff;
        }

        .input-row {
            display: flex;
            align-items: flex-end;
            gap: 8px;
        }

        .input-button {
            flex: 0 0 auto;

            width: 43px;
            height: 43px;

            border: none;
            border-radius: 10px;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 16px;

            transition: 0.15s;
        }

        .mic-button {
            background: #f3e5d8;
            color: #765437;
        }

        .mic-button:hover {
            background: #ead9c9;
        }

        .mic-button.recording {
            background: #765437;
            color: #ffffff;
        }

        .send-button {
            background: #765437;
            color: #ffffff;
        }

        .send-button:hover {
            background: #5c4033;
        }

        .send-button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        #messageInput {
            flex: 1;

            min-height: 43px;
            max-height: 120px;

            resize: none;

            border: 1px solid #ddd4cd;
            border-radius: 10px;

            padding: 11px 13px;

            font-family: inherit;
            font-size: 15px;

            color: #5c4033;
            background: #ffffff;

            outline: none;
        }

        #messageInput:focus {
            border-color: #b5835a;
        }

        #messageInput::placeholder {
            color: #aaa09a;
        }

        .input-hint {
            margin: 7px 4px 0;

            font-size: 11px;
            color: #9a8c82;
        }

        /* ================================
           SETTINGS
        ================================= */

        .settings-card {
            margin-top: 16px;
            padding: 17px 20px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;

            flex-wrap: wrap;
        }

        .settings-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .setting-label {
            font-size: 13px;
            color: #765f50;
            font-weight: 600;
        }

        .level-select {
            border: 1px solid #ddd4cd;
            border-radius: 8px;

            background: #ffffff;
            color: #5c4033;

            padding: 8px 11px;

            font-family: inherit;
            font-size: 13px;

            outline: none;
        }

        .level-select:focus {
            border-color: #b5835a;
        }

        .new-chat-button {
            border: none;

            background: #f3e5d8;
            color: #765437;

            padding: 9px 13px;

            border-radius: 8px;

            font-family: inherit;
            font-size: 13px;
            font-weight: 600;

            cursor: pointer;
        }

        .new-chat-button:hover {
            background: #ead9c9;
        }

        /* ================================
           HELP
        ================================= */

        .help-box {
            margin-top: 12px;
            padding: 13px 16px;

            background: #fffaf5;
            border: 1px solid #eee2d8;
            border-radius: 10px;

            font-size: 12px;
            color: #806e60;

            line-height: 1.6;
        }

        .help-box i {
            color: #b5835a;
            margin-right: 5px;
        }

        /* ================================
           MOBILE
        ================================= */

        @media (max-width: 768px) {

            .main-content {
                padding: 12px;
            }

            .page-header {
                padding: 17px;
            }

            .page-title {
                font-size: 21px;
            }

            .page-subtitle {
                font-size: 12px;
            }

            .status-box {
                font-size: 10px;
                padding: 6px 8px;
            }

            .chat-area {
                height: calc(100vh - 320px);
                min-height: 400px;
                padding: 15px;
            }

            .message {
                max-width: 88%;
                font-size: 14px;
            }

            .settings-card {
                align-items: flex-start;
                flex-direction: column;
            }

            .settings-left {
                width: 100%;
            }

            .new-chat-button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="app-container">

    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Main -->
    <main class="main-content">

        <!-- Header -->
        <div class="card page-header">

            <div>
                <h1 class="page-title">
                    🧋 Boba AI Speaking
                </h1>

                <p class="page-subtitle">
                    Practice Taiwan Mandarin through conversation.
                </p>
            </div>

            <div class="status-box" id="statusBox">
                <span class="status-dot"></span>
                <span id="statusText">Ready</span>
            </div>

        </div>


        <!-- Chat -->
        <div class="card chat-card">

            <div class="chat-area" id="chatArea">

                <!-- Welcome -->
                <div class="message-row ai">

                    <div class="message ai">

                        <span class="message-label">
                            🧋 Boba AI
                        </span>

                        <div class="message-text">
                            你好！我是 Boba AI。
                            <br>
                            今天想聊什麼？
                        </div>

                        <div class="message-actions">
                            <button
                                class="listen-button"
                                onclick="speakText('你好！我是 Boba AI。今天想聊什麼？')">
                                <i class="fa-solid fa-volume-high"></i>
                                Listen
                            </button>
                        </div>

                    </div>

                </div>

            </div>


            <!-- Input -->
            <div class="input-section">

                <div class="input-row">

                    <button
                        class="input-button mic-button"
                        id="micButton"
                        title="Speak"
                        onclick="toggleSpeechRecognition()">

                        <i class="fa-solid fa-microphone"></i>

                    </button>


                    <textarea
                        id="messageInput"
                        rows="1"
                        placeholder="Type in Mandarin..."
                        autocomplete="off"></textarea>


                    <button
                        class="input-button send-button"
                        id="sendButton"
                        title="Send"
                        onclick="sendMessage()">

                        <i class="fa-solid fa-paper-plane"></i>

                    </button>

                </div>

                <div class="input-hint">
                    Press Enter to send · Shift + Enter for a new line
                </div>

            </div>

        </div>


        <!-- Settings -->
        <div class="card settings-card">

            <div class="settings-left">

                <span class="setting-label">
                    <i class="fa-solid fa-sliders"></i>
                    Level
                </span>

                <select
                    id="levelSelect"
                    class="level-select">

                    <option value="Beginner">
                        Beginner
                    </option>

                    <option value="Elementary">
                        Elementary
                    </option>

                    <option value="Intermediate">
                        Intermediate
                    </option>

                </select>

            </div>


            <button
                class="new-chat-button"
                onclick="newChat()">

                <i class="fa-solid fa-rotate-left"></i>
                New Chat

            </button>

        </div>


        <!-- Help -->
        <div class="help-box">

            <i class="fa-solid fa-lightbulb"></i>

            Try writing simple Traditional Chinese sentences.
            You can also press the microphone button and speak
            Taiwan Mandarin.

        </div>

    </main>

</div>


<script>

    /* =========================================
       CHAT STATE
    ========================================= */

    let chatHistory = [];

    let isThinking = false;

    let recognition = null;
    let isRecording = false;


    /* =========================================
       ELEMENTS
    ========================================= */

    const chatArea = document.getElementById("chatArea");
    const messageInput = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const micButton = document.getElementById("micButton");

    const levelSelect = document.getElementById("levelSelect");

    const statusBox = document.getElementById("statusBox");
    const statusText = document.getElementById("statusText");


    /* =========================================
       STATUS
    ========================================= */

    function setStatus(text, thinking = false) {

        statusText.textContent = text;

        if (thinking) {
            statusBox.classList.add("thinking");
        } else {
            statusBox.classList.remove("thinking");
        }
    }


    /* =========================================
       ESCAPE HTML
    ========================================= */

    function escapeHTML(text) {

        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    /* =========================================
       ADD USER MESSAGE
    ========================================= */

    function addUserMessage(text) {

        const row = document.createElement("div");

        row.className = "message-row user";

        row.innerHTML = `
            <div class="message user">
                <span class="message-label">
                    You
                </span>

                <div class="message-text">
                    ${escapeHTML(text)}
                </div>
            </div>
        `;

        chatArea.appendChild(row);

        scrollToBottom();
    }


    /* =========================================
       ADD AI MESSAGE
    ========================================= */

    function addAIMessage(text) {

        const row = document.createElement("div");

        row.className = "message-row ai";

        const safeText = escapeHTML(text);

        row.innerHTML = `
            <div class="message ai">

                <span class="message-label">
                    🧋 Boba AI
                </span>

                <div class="message-text">
                    ${safeText}
                </div>

                <div class="message-actions">

                    <button
                        class="listen-button"
                        onclick="speakText(${JSON.stringify(text)})">

                        <i class="fa-solid fa-volume-high"></i>
                        Listen

                    </button>

                </div>

            </div>
        `;

        chatArea.appendChild(row);

        scrollToBottom();
    }


    /* =========================================
       TYPING INDICATOR
    ========================================= */

    function showTyping() {

        if (document.getElementById("typingIndicator")) {
            return;
        }

        const row = document.createElement("div");

        row.className = "message-row ai";

        row.id = "typingRow";

        row.innerHTML = `
            <div
                class="typing-indicator show"
                id="typingIndicator">

                <span class="typing-dot"></span>
                <span class="typing-dot"></span>
                <span class="typing-dot"></span>

            </div>
        `;

        chatArea.appendChild(row);

        scrollToBottom();
    }


    function hideTyping() {

        const row = document.getElementById("typingRow");

        if (row) {
            row.remove();
        }
    }


    /* =========================================
       SCROLL
    ========================================= */

    function scrollToBottom() {

        setTimeout(() => {

            chatArea.scrollTop = chatArea.scrollHeight;

        }, 30);
    }


    /* =========================================
       SEND MESSAGE
    ========================================= */

    async function sendMessage() {

        if (isThinking) {
            return;
        }

        const message = messageInput.value.trim();

        if (!message) {
            return;
        }


        /* Add user message to UI */
        addUserMessage(message);


        /* Clear input */
        messageInput.value = "";

        autoResize();


        /* Disable input */
        isThinking = true;

        sendButton.disabled = true;

        messageInput.disabled = true;


        /* Add to conversation history */
        chatHistory.push({
            role: "user",
            content: message
        });


        showTyping();

        setStatus("Thinking...", true);


        try {

            const response = await fetch("https://boba-break-study.vercel.app/api/chat", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    message: message,

                    level: levelSelect.value,

                    history: chatHistory

                })

            });


            let data = {};

            try {
                data = await response.json();
            } catch (jsonError) {
                throw new Error("The server returned an invalid response.");
            }


            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Something went wrong with the AI server."
                );

            }


            const aiReply = data.reply;

            if (!aiReply) {
                throw new Error("The AI returned an empty response.");
            }


            /* Save AI response */
            chatHistory.push({
                role: "assistant",
                content: aiReply
            });


            hideTyping();

            addAIMessage(aiReply);


            /* Automatically speak AI response */
            speakText(aiReply);


            setStatus("Online", false);


        } catch (error) {

            console.error(error);

            hideTyping();

            addAIMessage(
                "抱歉，現在連不上 AI。請稍後再試一次。\n\n" +
                "Sorry, I couldn't connect to the AI right now."
            );

            setStatus("Connection error", false);

        } finally {

            isThinking = false;

            sendButton.disabled = false;

            messageInput.disabled = false;

            messageInput.focus();

        }
    }


    /* =========================================
       TEXT TO SPEECH
    ========================================= */

    function speakText(text) {

        if (!("speechSynthesis" in window)) {
            return;
        }

        window.speechSynthesis.cancel();


        const utterance = new SpeechSynthesisUtterance(text);

        utterance.lang = "zh-TW";

        utterance.rate = 0.82;

        utterance.pitch = 1;


        /*
         * Try to find a Taiwan Mandarin voice.
         */

        const voices = window.speechSynthesis.getVoices();

        const taiwanVoice = voices.find(voice =>
            voice.lang &&
            (
                voice.lang.toLowerCase() === "zh-tw" ||
                voice.lang.toLowerCase().startsWith("zh-tw")
            )
        );


        if (taiwanVoice) {
            utterance.voice = taiwanVoice;
        }


        window.speechSynthesis.speak(utterance);
    }


    /* =========================================
       SPEECH RECOGNITION
    ========================================= */

    function setupSpeechRecognition() {

        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;


        if (!SpeechRecognition) {

            micButton.title =
                "Speech recognition is not supported in this browser.";

            return;

        }


        recognition = new SpeechRecognition();

        recognition.lang = "zh-TW";

        recognition.continuous = false;

        recognition.interimResults = false;


        recognition.onstart = function() {

            isRecording = true;

            micButton.classList.add("recording");

            setStatus("Listening...", false);

        };


        recognition.onresult = function(event) {

            const transcript =
                event.results[0][0].transcript;

            messageInput.value =
                transcript;

            autoResize();

        };


        recognition.onerror = function(event) {

            console.error(
                "Speech recognition error:",
                event.error
            );

        };


        recognition.onend = function() {

            isRecording = false;

            micButton.classList.remove("recording");

            setStatus("Online", false);

        };

    }


    function toggleSpeechRecognition() {

        if (!recognition) {

            alert(
                "Speech recognition is not supported in this browser."
            );

            return;

        }


        if (isRecording) {

            recognition.stop();

        } else {

            try {

                recognition.start();

            } catch (error) {

                console.error(error);

            }

        }

    }


    /* =========================================
       NEW CHAT
    ========================================= */

    function newChat() {

        window.speechSynthesis.cancel();

        chatHistory = [];

        hideTyping();


        chatArea.innerHTML = `

            <div class="message-row ai">

                <div class="message ai">

                    <span class="message-label">
                        🧋 Boba AI
                    </span>

                    <div class="message-text">
                        你好！我是 Boba AI。
                        <br>
                        今天想聊什麼？
                    </div>

                    <div class="message-actions">

                        <button
                            class="listen-button"
                            onclick="speakText('你好！我是 Boba AI。今天想聊什麼？')">

                            <i class="fa-solid fa-volume-high"></i>
                            Listen

                        </button>

                    </div>

                </div>

            </div>

        `;


        setStatus("Ready", false);

        messageInput.value = "";

        autoResize();

        messageInput.focus();

    }


    /* =========================================
       TEXTAREA AUTO RESIZE
    ========================================= */

    function autoResize() {

        messageInput.style.height = "auto";

        messageInput.style.height =
            Math.min(messageInput.scrollHeight, 120) + "px";

    }


    /* =========================================
       KEYBOARD
    ========================================= */

    messageInput.addEventListener("keydown", function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    });


    messageInput.addEventListener(
        "input",
        autoResize
    );


    /* =========================================
       INITIALIZE
    ========================================= */

    setupSpeechRecognition();

    autoResize();

    setStatus("Ready", false);


    /* Load sidebar */
</script>

<script src="script.js"></script>

</body>
</html>

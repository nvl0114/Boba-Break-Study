<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boba Break Study - Stroke Order</title>
    <!-- Include Hanzi Writer Library for stroke animations -->
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
    <!-- Include pinyin-pro Library for automatic pinyin generation -->
    <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.16.0/dist/index.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f8f9fa;
            display: flex;
            min-height: 100vh;
        }

        /* Main Content Layout */
        .main-content {
            flex: 1;
            padding: 20px;
        }
        .card {
            .card {
    width: 100%;
}background: #ffffff;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            border: 1px solid #eaeaea;
        }
        .card h2 {
            font-size: 20px;
            margin-bottom: 15px;
            color: #111;
        }
        
        /* Search Box */
        .search-box {
            display: flex;
            border: 1px solid #ddd;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .search-box input {
            flex: 1;
            padding: 10px 14px;
            border: none;
            outline: none;
            font-size: 14px;
        }
        .search-box button {
            background-color: #b5835a;
            color: white;
            border: none;
            padding: 0 20px;
            cursor: pointer;
            font-weight: bold;
        }
        .search-hint {
            font-size: 12px;
            color: #666;
        }

        /* Stroke Display Section */
        .stroke-display {
            width: 100%;
            text-align: center;
            border: 1px solid #eaeaea;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            background: #fff;
            display: flex;
            justify-content: center;
        }
        #character-target {
            width: 100%;
            width: 500px;
            height: 500px;
        }
        .character-info p {
            font-size: 14px;
            color: #333;
            margin-bottom: 6px;
        }

        /* Custom Data / Backup Section */
        .backup-grid {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            overflow-x: auto;
        }
        .backup-item {
            width: 65px;
            height: 65px;
            border: 1px solid #ddd;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #aaa;
            background: #fafafa;
            flex-shrink: 0;
        }
        
    </style>
</head>
<body>
    <div class="app-container">

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="logo-area">
            <div class="logo-top">
            <img src="logo.png"
                 alt="Boba Break Study Logo"
                 class="logo-img"
                 loading="lazy">

            <h2>
                Boba Break<br>
                <span>Study</span>
            </h2>
            </div>
            <p class="sidebar-jargon">Sip, Study, and Sweeten Your Mandarin Journey</p>
        </div>

        <nav aria-label="Main Navigation">
            <ul class="nav-menu">
                <li>
    <a href="index.html">
        <i class="fa-solid fa-chart-pie"></i>
        Dashboard
    </a>
</li>

                <li>
                    <a href="#">
                        <i class="fa-solid fa-book-open"></i>
                        Courses
                    </a>
                </li>
                <li class="active">
    <a href="hanzi.html">
        <i class="fa-solid fa-pen"></i>
        Hanzi Stroke Order
    </a>
</li>

                <li>
                    <a href="https://cbt.sc-top.org.tw/sctopj/">
                        <i class="fa-solid fa-clipboard-check"></i>
                        Mock Test
                    </a>
                </li>

                <li>
                    <a href="about.html">
                        <i class="fa-solid fa-circle-info"></i>
                        About
                    </a>
                </li>
            </ul>
        </nav>

    </aside>

    <!-- Main Content Area -->
    <div class="main-content">
        
        <!-- Search Card -->
        <div class="card">
            <h2>Hanzi Stroke Order Finder</h2>
            <div class="search-box">
                <input type="text" id="char-input" placeholder="Enter a traditional Hanzi character (e.g. 學)">
                <button id="search-btn">Search</button>
            </div>
            <p class="search-hint">Enter a traditional Hanzi character.</p>
        </div>

        <!-- Result Card -->
        <div class="card">
            <div class="stroke-display">
                <!-- Hanzi Writer Target Container -->
                <div id="character-target"></div>
            </div>
            <div class="character-info" id="char-info">
    <p><strong>Hanzi:</strong> 學</p>
    <p><strong>Pinyin:</strong> xué</p>
    
</div>
        <!-- Custom Data / Backup Card -->
        
    <!-- JavaScript Implementation -->
    <script>

let writer = HanziWriter.create('character-target', '學', {
    width: 300,
    height: 300,
    padding: 5,
    showOutline: true,
    strokeAnimationSpeed: 1,
    strokeColor: '#333333'
});

writer.animateCharacter();


const inputField = document.getElementById('char-input');
const searchButton = document.getElementById('search-btn');
const infoBox = document.getElementById('char-info');


function handleSearch() {

    const val = inputField.value.trim();

    if (val.length > 0) {

        const targetChar = val[0];

        document.getElementById('character-target').innerHTML = "";


        try {

            writer = HanziWriter.create(
                'character-target',
                targetChar,
                {
                    width: 3000,
                    height: 300,
                    padding: 5,
                    showOutline: true,
                    strokeAnimationSpeed: 1,
                    strokeColor: '#333333',

                    onLoadCharDataError: function() {
                        document.getElementById('character-target').innerHTML =
                        '<p style="color:red;font-size:12px;margin-top:80px;">Character not found.</p>';
                    }
                }
            );


            writer.animateCharacter();


            let pinyinResult = "-";


            try {

                pinyinResult = pinyinPro.pinyin(
                    targetChar,
                    {
                        toneType: 'symbol'
                    }
                );

            } catch(error) {

                pinyinResult = "-";

            }


            infoBox.innerHTML = `
                <p><strong>Hanzi:</strong> ${targetChar}</p>
                <p><strong>Pinyin:</strong> ${pinyinResult}</p>
            `;


        } catch(error) {

            console.log(error);

            infoBox.innerHTML = `
                <p><strong>Hanzi:</strong> ${targetChar}</p>
                <p><strong>Pinyin:</strong> -</p>
            `;

        }

    }

}


searchButton.addEventListener(
    'click',
    handleSearch
);


inputField.addEventListener(
    'keypress',
    function(e) {

        if (e.key === "Enter") {
            handleSearch();
        }

    }
);

</script>

    </script>
  </div>          
    </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Boba Break Study - Stroke Order</title>


<!-- =========================================
     HANZI WRITER
========================================== -->

<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>


<!-- =========================================
     PINYIN PRO
========================================== -->

<script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.16.0/dist/index.js"></script>


<!-- =========================================
     PINYIN → ZHUYIN
========================================== -->

<script src="https://cdn.jsdelivr.net/npm/pinyin-to-bopomofo@latest/dist/index.umd.js"></script>


<!-- =========================================
     JSPDF FOR WORKSHEET GENERATION
========================================== -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>


<style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
    }


    body {
        background-color: #f8f9fa;
        display: flex;
        min-height: 100vh;
    }


    /* =========================================
       MAIN CONTENT
    ========================================== */

    .main-content {
        flex: 1;
        padding: 20px;
    }


    .card {
        width: 100%;
        background: #ffffff;
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 20px;

        box-shadow:
            0 2px 5px rgba(0,0,0,0.03);

        border: 1px solid #eaeaea;
    }


    .card h2 {
        font-size: 20px;
        margin-bottom: 15px;
        color: #111;
    }


    /* =========================================
       SEARCH
    ========================================== */

    .search-box {
        display: flex;

        border: 1px solid #ddd;

        border-radius: 6px;

        overflow: hidden;

        margin-bottom: 8px;
    }


    .search-box input {
        flex: 1;

        padding: 10px 14px;

        border: none;

        outline: none;

        font-size: 14px;
    }


    .search-box button {
        background-color: #b5835a;

        color: white;

        border: none;

        padding: 0 20px;

        cursor: pointer;

        font-weight: bold;
    }


    .search-box button:hover {
        background-color: #9d704c;
    }


    .search-hint {
        font-size: 12px;
        color: #666;
    }


    /* =========================================
       CHARACTER RESULTS
    ========================================== */

    #results-container {
        display: flex;
        flex-direction: column;
        gap: 20px;
    }


    .character-result {
        width: 100%;

        background: #ffffff;

        border: 1px solid #eaeaea;

        border-radius: 12px;

        padding: 20px;

        box-shadow:
            0 2px 5px rgba(0,0,0,0.03);
    }


    .character-number {
        font-size: 13px;

        color: #888;

        margin-bottom: 10px;

        text-align: left;

        font-weight: bold;
    }


    /* =========================================
       STROKE DISPLAY
    ========================================== */

    .stroke-display {

        width: 100%;

        text-align: center;

        border: 1px solid #eaeaea;

        border-radius: 8px;

        padding: 20px;

        margin-bottom: 15px;

        background: #fff;

        display: flex;

        justify-content: center;

        align-items: center;

    }


    .character-target {

        width: 600px;

        height: 300px;

    }


    /* =========================================
       CHARACTER INFO
    ========================================== */

    .character-info {

        text-align: center;

        font-family:
            "Comic Sans MS",
            "Segoe UI",
            sans-serif;

        margin-top: 15px;

    }


    .character-info p {

        font-size: 20px;

        color: #333;

        margin-bottom: 10px;

        font-weight: 500;

    }


    .character-info strong {

        color: #b87333;

    }


    /* =========================================
       MEANING
    ========================================== */

    .meaning-text {

        max-width: 600px;

        margin:
            0 auto 12px auto;

        line-height: 1.5;

    }


    .meaning-label {

        color: #b87333;

        font-weight: bold;

    }


    .meaning-value {

        color: #333;

    }


    .meaning-loading {

        color: #888;

        font-size: 15px;

    }


    .meaning-unavailable {

        color: #999;

        font-size: 15px;

    }


    /* =========================================
       SOUND & PDF BUTTONS
    ========================================== */

    .button-group {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        margin-top: 10px;
    }


    .sound-btn, .pdf-btn {

        padding: 9px 18px;

        border: none;

        border-radius: 25px;

        color: white;

        cursor: pointer;

        font-size: 14px;

        font-weight: bold;

        transition:
            background-color 0.2s ease,
            transform 0.15s ease,
            box-shadow 0.2s ease;

    }


    .sound-btn {
        background-color: #b5835a;
    }

    .sound-btn:hover {
        background-color: #9d704c;
        transform: translateY(-1px);
    }


    .pdf-btn {
        background-color: #765437;
        border-radius: 20px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
    }

    .pdf-btn:hover {
        background-color: #5d412a;
        transform: translateY(-1px);
    }

    .pdf-btn:disabled {
        opacity: 0.6;
        cursor: wait;
    }


    .sound-btn:active, .pdf-btn:active {

        transform: scale(0.96);

    }


    /* =========================================
       SOUND PLAYING
    ========================================== */

    .sound-btn.speaking {

        background-color: #765437;

        animation:
            soundPulse 1.2s infinite;

    }


    @keyframes soundPulse {

        0% {

            box-shadow:
                0 0 0 0
                rgba(181, 131, 90, 0.55);

        }

        70% {

            box-shadow:
                0 0 0 12px
                rgba(181, 131, 90, 0);

        }

        100% {

            box-shadow:
                0 0 0 0
                rgba(181, 131, 90, 0);

        }

    }


    /* =========================================
       STROKE LOADING
    ========================================== */

    .stroke-loading {

        color: #888;

        font-size: 13px;

        margin-top: 120px;

    }


    .stroke-error {

        color: #b44;

        font-size: 13px;

        margin-top: 120px;

    }


    /* =========================================
       MOBILE
    ========================================== */

    @media screen and (max-width: 768px) {

        .stroke-display {

            max-width: 300px;

            margin-left: auto;

            margin-right: auto;

            padding: 5px;

        }


        .character-target {

            width: 300px;

            height: 300px;

        }


        .character-info p {

            font-size: 18px;

        }

    }

</style>

</head>
<body>

<div class="app-container">

    <!-- =========================================
         SIDEBAR
    ========================================== -->

    <div id="sidebar-container"></div>


    <!-- =========================================
         MAIN CONTENT
    ========================================== -->

    <div class="main-content">


        <!-- =====================================
             SEARCH CARD
        ====================================== -->

        <div class="card">

            <h2>
                Hanzi Stroke Order Finder
            </h2>


            <div class="search-box">

                <input
                    type="text"
                    id="char-input"
                    placeholder="Enter up to 3 traditional Hanzi characters (e.g. 學中文)"
                    maxlength="3"
                >


                <button id="search-btn">
                    Search
                </button>

            </div>


            <p class="search-hint">

                Enter up to 3 traditional Hanzi characters.
                Each character will be shown separately.

            </p>

        </div>



        <!-- =====================================
             RESULT CARD
        ====================================== -->

        <div id="results-container">


            <!-- =================================
                 DEFAULT CHARACTER
        ================================== -->

            <div class="character-result">


                <div class="character-number">

                    Character 1

                </div>


                <div class="stroke-display">

                    <div
                        class="character-target"
                        id="character-target-0"
                    >

                        <p class="stroke-loading">
                            Loading...
                        </p>

                    </div>

                </div>



                <div
                    class="character-info"
                    id="char-info-0"
                >

                    <p>

                        <strong>Hanzi:</strong>

                        學

                    </p>


                    <p>

                        <strong>Pinyin:</strong>

                        xué

                    </p>


                    <p>

                        <strong>Zhuyin:</strong>

                        ㄒㄩㄝˊ

                    </p>


                    <p class="meaning-text">

                        <span class="meaning-label">

                            Meaning:

                        </span>


                        <span class="meaning-value">

                            to study; to learn

                        </span>

                    </p>


                    <div class="button-group">
                        <button
                            class="sound-btn"
                            id="sound-btn-0"
                            onclick="speakChinese(0)"
                        >

                            🔊

                            <span id="sound-text-0">

                                Listen

                            </span>

                        </button>

                        <button
                            class="pdf-btn"
                            id="pdf-btn-0"
                            onclick="generatePDFWorksheet(0)"
                        >
                            <i class="fa-solid fa-file-pdf"></i> Generate Worksheet PDF
                        </button>
                    </div>

                </div>

            </div>

        </div>


    </div>

</div>

<script>


/* =========================================
   CURRENT CHARACTERS
========================================= */

let currentCharacters = ["學"];


/* =========================================
   WRITER STORAGE
========================================= */

let writers = [];


/* =========================================
   HANZI WRITER SETTINGS
========================================= */

const strokeOptions = {

    padding: 5,

    showOutline: true,

    showCharacter: true,

    strokeAnimationSpeed: 1,

    strokeColor: "#333333"

};


/* =========================================
   ACJK TRADITIONAL DATA LOADER
========================================= */

function loadACJKTraditionalData(
    char,
    onComplete,
    onError
) {

    const url =
        "https://cdn.jsdelivr.net/npm/" +
        "hanzi-writer-data-acjk@latest/" +
        "animCJK/ZhHant/" +
        encodeURIComponent(char) +
        ".json";


    fetch(url)

        .then(function(response) {

            if (!response.ok) {

                throw new Error(
                    "ACJK Traditional data not found"
                );

            }

            return response.json();

        })

        .then(function(data) {

            console.log(
                "ACJK ZhHant loaded:",
                char
            );

            onComplete(data);

        })

        .catch(function(error) {

            console.log(
                "ACJK ZhHant failed:",
                char,
                error
            );


            /*
             * FALLBACK TO ORIGINAL
             * HANZI WRITER DATA
             */

            loadOriginalHanziWriterData(
                char,
                onComplete,
                onError
            );

        });

}



/* =========================================
   ORIGINAL HANZI WRITER FALLBACK
========================================= */

function loadOriginalHanziWriterData(
    char,
    onComplete,
    onError
) {

    const url =
        "https://cdn.jsdelivr.net/npm/" +
        "hanzi-writer-data@latest/" +
        encodeURIComponent(char) +
        ".json";


    fetch(url)

        .then(function(response) {

            if (!response.ok) {

                throw new Error(
                    "Original Hanzi Writer data not found"
                );

            }

            return response.json();

        })

        .then(function(data) {

            console.log(
                "Original Hanzi Writer data loaded:",
                char
            );

            onComplete(data);

        })

        .catch(function(error) {

            console.log(
                "Original data also failed:",
                char,
                error
            );


            if (onError) {

                onError(error);

            }

        });

}



/* =========================================
   CREATE HANZI WRITER
========================================= */

function createStrokeWriter(
    character,
    targetId
) {

    const target =
        document.getElementById(
            targetId
        );


    if (!target) {

        return null;

    }


    target.innerHTML = "";


    const renderWidth =
        window.innerWidth <= 768
            ? 300
            : 600;


    try {

        const writer =
            HanziWriter.create(
                targetId,
                character,
                {

                    width:
                        renderWidth,

                    height:
                        300,

                    padding:
                        strokeOptions.padding,

                    showOutline:
                        strokeOptions.showOutline,

                    showCharacter:
                        strokeOptions.showCharacter,

                    strokeAnimationSpeed:
                        strokeOptions.strokeAnimationSpeed,

                    strokeColor:
                        strokeOptions.strokeColor,


                    /*
                     * Traditional ACJK first,
                     * original dataset second.
                     */

                    charDataLoader:
                        function(
                            char,
                            onComplete,
                            onError
                        ) {

                            loadACJKTraditionalData(
                                char,
                                onComplete,
                                onError
                            );

                        },


                    onLoadCharDataSuccess:
                        function(data) {

                            console.log(
                                "Stroke data successfully loaded:",
                                character
                            );

                        },


                    onLoadCharDataError:
                        function(error) {

                            console.log(
                                "Final stroke data error:",
                                error
                            );


                            target.innerHTML = `

                                <p class="stroke-error">

                                    Stroke order data
                                    is not available
                                    for this character.

                                </p>

                            `;

                        }

                }
            );


        /*
         * Animate automatically
         */

        writer.animateCharacter();


        return writer;

    }

    catch(error) {

        console.log(
            "Hanzi Writer creation error:",
            error
        );


        target.innerHTML = `

            <p class="stroke-error">

                Unable to load stroke order.

            </p>

        `;


        return null;

    }

}



/* =========================================
   ELEMENTS
========================================= */

const inputField =
    document.getElementById(
        "char-input"
    );


const searchButton =
    document.getElementById(
        "search-btn"
    );


const resultsContainer =
    document.getElementById(
        "results-container"
    );



/* =========================================
   INITIAL CHARACTER
========================================= */

writers[0] =
    createStrokeWriter(
        "學",
        "character-target-0"
    );



/* =========================================
   CREATE RESULT CARD
========================================= */

function createCharacterCard(
    character,
    index
) {

    return `

        <div class="character-result">

            <div class="character-number">

                Character ${index + 1}

            </div>


            <div class="stroke-display">

                <div
                    class="character-target"
                    id="character-target-${index}"
                >

                    <p class="stroke-loading">

                        Loading...

                    </p>

                </div>

            </div>


            <div
                class="character-info"
                id="char-info-${index}"
            >

                <p>

                    <strong>Hanzi:</strong>

                    ${character}

                </p>


                <p>

                    <strong>Pinyin:</strong>

                    <span id="pinyin-value-${index}">

                        Loading...

                    </span>

                </p>


                <p>

                    <strong>Zhuyin:</strong>

                    <span id="zhuyin-value-${index}">

                        Loading...

                    </span>

                </p>


                <p class="meaning-text">

                    <span class="meaning-label">

                        Meaning:

                    </span>


                    <span
                        class="meaning-loading"
                        id="meaning-value-${index}"
                    >

                        Looking up...

                    </span>

                </p>


                <div class="button-group">
                    <button
                        class="sound-btn"
                        id="sound-btn-${index}"
                        onclick="speakChinese(${index})"
                    >

                        🔊

                        <span id="sound-text-${index}">

                            Listen

                        </span>

                    </button>

                    <button
                        class="pdf-btn"
                        id="pdf-btn-${index}"
                        onclick="generatePDFWorksheet(${index})"
                    >
                        <i class="fa-solid fa-file-pdf"></i> Generate Worksheet PDF
                    </button>
                </div>

            </div>

        </div>

    `;

}



/* =========================================
   SEARCH
========================================= */

async function handleSearch() {

    const val =
        inputField.value.trim();


    if (val.length === 0) {

        return;

    }


    /*
     * Take maximum 3 characters
     */

    const characters =
        Array.from(val).slice(0, 3);


    currentCharacters =
        characters;


    /*
     * Stop speech
     */

    if (
        "speechSynthesis" in window
    ) {

        speechSynthesis.cancel();

    }


    resetAllSoundButtons();


    /*
     * Clear old writers
     */

    writers = [];


    /*
     * Create cards
     */

    resultsContainer.innerHTML = "";


    characters.forEach(
        function(character, index) {

            resultsContainer.insertAdjacentHTML(
                "beforeend",
                createCharacterCard(
                    character,
                    index
                )
            );

        }
    );


    /*
     * Create stroke writers
     */

    characters.forEach(
        function(character, index) {

            writers[index] =
                createStrokeWriter(
                    character,
                    `character-target-${index}`
                );

        }
    );


    /*
     * Load dictionary information
     * independently for each character
     */

    const dictionaryPromises =
        characters.map(
            function(character, index) {

                return loadDictionaryData(
                    character,
                    index
                );

            }
        );


    await Promise.all(
        dictionaryPromises
    );

}



/* =========================================
   TAIWAN MANDARIN API
========================================= */

async function loadDictionaryData(
    targetChar,
    index
) {

    const encodedChar =
        encodeURIComponent(
            targetChar
        );


    const apiUrl =
        "https://api.taiwanmandarin.com/" +
        "characters/" +
        encodedChar;


    try {

        const response =
            await fetch(
                apiUrl
            );


        if (!response.ok) {

            throw new Error(
                "Character not found in dictionary"
            );

        }


        const data =
            await response.json();



        /*
         * Pinyin
         */

        let pinyinResult =
            data.pinyin || "-";



        /*
         * Zhuyin
         */

        let zhuyinResult =
            data.bopomofo || "-";



        /*
         * English
         */

        let meaningResult =
            data.english || "";



        /*
         * Update Pinyin
         */

        const pinyinElement =
            document.getElementById(
                `pinyin-value-${index}`
            );


        if (pinyinElement) {

            pinyinElement.textContent =
                pinyinResult;

        }



        /*
         * Update Zhuyin
         */

        const zhuyinElement =
            document.getElementById(
                `zhuyin-value-${index}`
            );


        if (zhuyinElement) {

            zhuyinElement.textContent =
                zhuyinResult;

        }



        /*
         * Update English meaning
         */

        const meaningElement =
            document.getElementById(
                `meaning-value-${index}`
            );


        if (meaningElement) {

            if (meaningResult) {

                meaningElement.textContent =
                    meaningResult;

                meaningElement.className =
                    "meaning-value";

            }

            else {

                meaningElement.textContent =
                    "Meaning not available yet.";

                meaningElement.className =
                    "meaning-unavailable";

            }

        }

    }

    catch(error) {

        console.log(
            "Taiwan Mandarin API error:",
            targetChar,
            error
        );


        /*
         * Pinyin Pro fallback
         */

        let pinyinResult = "-";

        let zhuyinResult = "-";


        try {

            pinyinResult =
                pinyinPro.pinyin(
                    targetChar,
                    {
                        toneType:
                            "symbol"
                    }
                );


            let numberPinyin =
                pinyinPro.pinyin(
                    targetChar,
                    {

                        toneType:
                            "number",

                        type:
                            "array"

                    }
                );


            numberPinyin =
                numberPinyin[0];


            zhuyinResult =
                convertPinyinToZhuyin(
                    numberPinyin
                );

        }

        catch(fallbackError) {

            console.log(
                "Pinyin fallback error:",
                fallbackError
            );

        }



        /*
         * Update fallback Pinyin
         */

        const pinyinElement =
            document.getElementById(
                `pinyin-value-${index}`
            );


        if (pinyinElement) {

            pinyinElement.textContent =
                pinyinResult;

        }



        /*
         * Update fallback Zhuyin
         */

        const zhuyinElement =
            document.getElementById(
                `zhuyin-value-${index}`
            );


        if (zhuyinElement) {

            zhuyinElement.textContent =
                zhuyinResult;

        }



        /*
         * Meaning unavailable
         */

        const meaningElement =
            document.getElementById(
                `meaning-value-${index}`
            );


        if (meaningElement) {

            meaningElement.textContent =
                "Meaning not available yet.";

            meaningElement.className =
                "meaning-unavailable";

        }

    }

}



/* =========================================
   SEARCH BUTTON
========================================= */

searchButton.addEventListener(
    "click",
    handleSearch
);



/* =========================================
   ENTER KEY
========================================= */

inputField.addEventListener(
    "keypress",
    function(event) {

        if (event.key === "Enter") {

            handleSearch();

        }

    }
);



/* =========================================
   TEXT TO SPEECH
========================================= */

function speakChinese(index) {

    if (
        !("speechSynthesis" in window)
    ) {

        alert(
            "Your browser does not support text-to-speech."
        );

        return;

    }


    /*
     * Stop if currently speaking
     */

    if (
        speechSynthesis.speaking
    ) {

        speechSynthesis.cancel();

        resetAllSoundButtons();

        return;

    }


    const character =
        currentCharacters[index];


    if (!character) {

        return;

    }


    /*
     * Create utterance
     */

    const utterance =
        new SpeechSynthesisUtterance(
            character
        );


    /*
     * Taiwan Mandarin
     */

    utterance.lang =
        "zh-TW";


    /*
     * Learning speed
     */

    utterance.rate =
        0.75;


    utterance.pitch =
        1;



    /*
     * Start
     */

    utterance.onstart =
        function() {

            setSpeakingButton(
                index
            );

        };



    /*
     * End

     */

    utterance.onend =
        function() {

            resetSoundButton(
                index
            );

        };



    /*
     * Error
     */

    utterance.onerror =
        function() {

            resetSoundButton(
                index
            );

        };


    speechSynthesis.cancel();


    speechSynthesis.speak(
        utterance
    );

}



/* =========================================
   SOUND BUTTON - PLAYING
========================================= */

function setSpeakingButton(
    index
) {

    const button =
        document.getElementById(
            `sound-btn-${index}`
        );


    const text =
        document.getElementById(
            `sound-text-${index}`
        );


    if (!button) {

        return;

    }


    button.classList.add(
        "speaking"
    );


    if (text) {

        text.textContent =
            "Speaking...";

    }

}



/* =========================================
   SOUND BUTTON - RESET
========================================= */

function resetSoundButton(
    index
) {

    const button =
        document.getElementById(
            `sound-btn-${index}`
        );


    const text =
        document.getElementById(
            `sound-text-${index}`
        );


    if (!button) {

        return;

    }


    button.classList.remove(
        "speaking"
    );


    if (text) {

        text.textContent =
            "Listen";

    }

}



/* =========================================
   RESET ALL SOUND BUTTONS
========================================= */

function resetAllSoundButtons() {

    document
        .querySelectorAll(
            ".sound-btn"
        )
        .forEach(
            function(button) {

                button.classList.remove(
                    "speaking"
                );

            }
        );


    document
        .querySelectorAll(
            "[id^='sound-text-']"
        )
        .forEach(
            function(text) {

                text.textContent =
                    "Listen";

            }
        );

}



/* =========================================
   PINYIN → ZHUYIN FALLBACK
========================================= */

function convertPinyinToZhuyin(
    pinyinStr
) {

    if (!pinyinStr) {

        return "";

    }


    pinyinStr =
        pinyinStr
            .toLowerCase()
            .trim();



    /*
     * Tone map
     */

    const toneMap = {

        "ā": "a1",
        "á": "a2",
        "ǎ": "a3",
        "à": "a4",

        "ē": "e1",
        "é": "e2",
        "ě": "e3",
        "è": "e4",

        "ī": "i1",
        "í": "i2",
        "ǐ": "i3",
        "ì": "i4",

        "ō": "o1",
        "ó": "o2",
        "ǒ": "o3",
        "ò": "o4",

        "ū": "u1",
        "ú": "u2",
        "ǔ": "u3",
        "ù": "u4",

        "ǖ": "ü1",
        "ǘ": "ü2",
        "ǚ": "ü3",
        "ǜ": "ü4"

    };



    /*
     * Zhuyin tone symbols
     */

    const zhuyinTones = {

        "1": "",

        "2": "ˊ",

        "3": "ˇ",

        "4": "ˋ",

        "5": "˙"

    };


    let toneNum = "1";



    /*
     * Tone number
     */

    if (
        /[1-5]$/.test(
            pinyinStr
        )
    ) {

        toneNum =
            pinyinStr.slice(-1);


        pinyinStr =
            pinyinStr.slice(
                0,
                -1
            );

    }


    /*
     * Tone mark
     */

    else {

        for (
            let char of pinyinStr
        ) {

            if (
                toneMap[char]
            ) {

                const converted =
                    toneMap[char];


                pinyinStr =
                    pinyinStr.replace(
                        char,
                        converted[0]
                    );


                toneNum =
                    converted[1];


                break;

            }

        }

    }



    const toneSymbol =
        zhuyinTones[toneNum] || "";



    /*
     * Initials
     */

    const initials = {

        "zh": "ㄓ",
        "ch": "ㄔ",
        "sh": "ㄕ",

        "b": "ㄅ",
        "p": "ㄆ",
        "m": "ㄇ",
        "f": "ㄈ",

        "d": "ㄉ",
        "t": "ㄊ",
        "n": "ㄋ",
        "l": "ㄌ",

        "g": "ㄍ",
        "k": "ㄎ",
        "h": "ㄏ",

        "j": "ㄐ",
        "q": "ㄑ",
        "x": "ㄒ",

        "r": "ㄖ",
        "z": "ㄗ",
        "c": "ㄘ",
        "s": "ㄙ"

    };



    /*
     * Finals
     */

    const finals = {

        "a": "ㄚ",
        "o": "ㄛ",
        "e": "ㄜ",
        "er": "ㄦ",

        "ai": "ㄞ",
        "ei": "ㄟ",
        "ao": "ㄠ",
        "ou": "ㄡ",

        "an": "ㄢ",
        "en": "ㄣ",

        "ang": "ㄤ",
        "eng": "ㄥ",

        "i": "ㄧ",
        "u": "ㄨ",
        "ü": "ㄩ",

        "wa": "ㄨㄚ",
        "wo": "ㄨㄛ",
        "wai": "ㄨㄞ",
        "wei": "ㄨㄟ",

        "wan": "ㄨㄢ",
        "wen": "ㄨㄣ",
        "wang": "ㄨㄤ",
        "weng": "ㄨㄥ",

        "ya": "ㄧㄚ",
        "yo": "ㄧㄛ",
        "ye": "ㄧㄝ",

        "yao": "ㄧㄠ",
        "you": "ㄧㄡ",

        "yan": "ㄧㄢ",
        "yin": "ㄧㄣ",

        "yang": "ㄧㄤ",
        "ying": "ㄧㄥ",

        "wu": "ㄨ",
        "yi": "ㄧ",
        "yu": "ㄩ",

        "ia": "ㄧㄚ",
        "io": "ㄧㄛ",
        "ie": "ㄧㄝ",

        "iao": "ㄧㄠ",
        "iu": "ㄧㄡ",

        "ian": "ㄧㄢ",
        "in": "ㄧㄣ",

        "iang": "ㄧㄤ",
        "ing": "ㄧㄥ",

        "ua": "ㄨㄚ",
        "uo": "ㄨㄛ",

        "uai": "ㄨㄞ",
        "ui": "ㄨㄟ",

        "uan": "ㄨㄢ",
        "un": "ㄨㄣ",

        "uang": "ㄨㄤ",
        "ong": "ㄨㄥ",

        "üe": "ㄩㄝ",
        "üan": "ㄩㄢ",
        "ün": "ㄩㄣ",

        "iong": "ㄩㄥ"

    };



    let result = "";

    let initial = "";



    /*
     * Find initial
     */

    for (
        let key of Object.keys(initials)
    ) {

        if (
            pinyinStr.startsWith(key)
        ) {

            initial = key;

            break;

        }

    }



    if (initial) {

        result +=
            initials[initial];


        pinyinStr =
            pinyinStr.slice(
                initial.length
            );

    }



    /*
     * Find final
     */

    if (
        finals[pinyinStr]
    ) {

        result +=
            finals[pinyinStr];

    }

    else {

        result +=
            pinyinStr;

    }



    return result +
           toneSymbol;

}


/* =========================================
   TEXT → IMAGE HELPER
   ---------------------------------------
   jsPDF's built-in fonts (Helvetica etc.)
   only support basic Latin (WinAnsi)
   characters. Hanzi, pinyin tone marks
   (ā ǒ ü ...) and Zhuyin symbols
   (ㄓㄨㄥ) are outside that range and
   get corrupted if drawn with doc.text().

   The browser's <canvas> can render
   these correctly using system fonts,
   so we render the text to a canvas
   first, then embed the canvas as a
   PNG image inside the PDF instead of
   drawing it as PDF text.
========================================= */

function renderTextAsImage(
    text,
    fontSizePt,
    color,
    fontWeight
) {

    const scale = 4;

    const canvas =
        document.createElement(
            "canvas"
        );

    const ctx =
        canvas.getContext(
            "2d"
        );

    const fontSpec =
        `${fontWeight || "normal"} ` +
        `${fontSizePt * scale}px ` +
        `"Noto Sans TC", "Microsoft JhengHei", ` +
        `"PingFang TC", Arial, sans-serif`;

    ctx.font = fontSpec;

    const metrics =
        ctx.measureText(text);

    const paddingPx =
        6 * scale;

    canvas.width =
        Math.ceil(metrics.width) +
        (paddingPx * 2);

    canvas.height =
        Math.ceil(fontSizePt * scale * 1.6);

    /*
     * Resizing the canvas resets
     * the 2D context, so font
     * settings must be reapplied.
     */

    ctx.font = fontSpec;

    ctx.fillStyle =
        color || "#000000";

    ctx.textBaseline = "top";

    ctx.fillText(
        text,
        paddingPx,
        paddingPx * 0.3
    );

    return {

        dataUrl:
            canvas.toDataURL("image/png"),

        widthPx: canvas.width,

        heightPx: canvas.height

    };

}



/*
 * Place a text-image on the PDF at
 * a fixed height (mm), preserving
 * its aspect ratio.
 */

function addTextImageToPDF(
    doc,
    text,
    x,
    y,
    fontSizePt,
    color,
    fontWeight,
    heightMm
) {

    const rendered =
        renderTextAsImage(
            text,
            fontSizePt,
            color,
            fontWeight
        );

    const aspect =
        rendered.widthPx / rendered.heightPx;

    const finalHeight =
        heightMm;

    const finalWidth =
        finalHeight * aspect;

    doc.addImage(
        rendered.dataUrl,
        "PNG",
        x,
        y,
        finalWidth,
        finalHeight
    );

    return finalWidth;

}


/* =========================================
   FETCH RAW CHARACTER STROKE DATA
   ---------------------------------------
   Returns the raw hanzi-writer-data JSON
   (with .strokes / .medians arrays) so we
   can build a stroke-by-stroke sequence,
   instead of only a finished character.
========================================= */

function fetchCharacterData(char) {

    return new Promise(function(resolve) {

        loadACJKTraditionalData(
            char,
            function(data) {
                resolve(data);
            },
            function() {
                resolve(null);
            }
        );

    });

}



/* =========================================
   RENDER A CHARACTER-DATA OBJECT TO PNG
   ---------------------------------------
   Feeds a (possibly truncated) character
   data object into a real HanziWriter
   instance via a custom charDataLoader,
   waits for the real "data loaded"
   callback (never a guessed timeout),
   then snapshots the resulting SVG to a
   PNG. Because HanziWriter itself does
   the positioning/scaling, we never have
   to guess stroke coordinate transforms.
========================================= */

function renderCharDataToPNG(
    char,
    charDataObj,
    sizePx
) {

    return new Promise(function(resolve) {

        if (!charDataObj) {

            resolve(null);
            return;

        }

        const tempDiv =
            document.createElement("div");

        tempDiv.style.width = sizePx + "px";
        tempDiv.style.height = sizePx + "px";
        tempDiv.style.position = "absolute";
        tempDiv.style.left = "-9999px";

        document.body.appendChild(tempDiv);

        function cleanupAndResolve(result) {

            if (tempDiv.parentNode) {

                document.body.removeChild(tempDiv);

            }

            resolve(result);

        }

        try {

            HanziWriter.create(
                tempDiv,
                char,
                {

                    width: sizePx,
                    height: sizePx,
                    padding: Math.round(sizePx * 0.06),

                    showOutline: false,
                    showCharacter: true,
                    strokeColor: "#1a1a1a",

                    charDataLoader:
                        function(c, onComplete) {

                            onComplete(charDataObj);

                        },

                    onLoadCharDataSuccess:
                        function() {

                            requestAnimationFrame(function() {

                                requestAnimationFrame(function() {

                                    try {

                                        const svgEl =
                                            tempDiv.querySelector("svg");

                                        if (!svgEl) {

                                            cleanupAndResolve(null);
                                            return;

                                        }

                                        const svgString =
                                            new XMLSerializer()
                                                .serializeToString(svgEl);

                                        const svgBlob =
                                            new Blob(
                                                [svgString],
                                                { type: "image/svg+xml;charset=utf-8" }
                                            );

                                        const URLObj =
                                            window.URL ||
                                            window.webkitURL ||
                                            window;

                                        const blobURL =
                                            URLObj.createObjectURL(svgBlob);

                                        const img = new Image();

                                        img.onload = function() {

                                            const canvas =
                                                document.createElement("canvas");

                                            canvas.width = sizePx;
                                            canvas.height = sizePx;

                                            const ctx2d =
                                                canvas.getContext("2d");

                                            ctx2d.drawImage(
                                                img, 0, 0, sizePx, sizePx
                                            );

                                            const pngData =
                                                canvas.toDataURL("image/png");

                                            URLObj.revokeObjectURL(blobURL);

                                            cleanupAndResolve(pngData);

                                        };

                                        img.onerror = function() {

                                            URLObj.revokeObjectURL(blobURL);
                                            cleanupAndResolve(null);

                                        };

                                        img.src = blobURL;

                                    }

                                    catch (e) {

                                        console.log(
                                            "Error snapshotting character SVG",
                                            e
                                        );

                                        cleanupAndResolve(null);

                                    }

                                });

                            });

                        },

                    onLoadCharDataError:
                        function() {

                            cleanupAndResolve(null);

                        }

                }
            );

        }

        catch (e) {

            console.log(
                "Error creating writer for PNG render",
                e
            );

            cleanupAndResolve(null);

        }

    });

}



/* =========================================
   BUILD STROKE-BY-STROKE SEQUENCE
   ---------------------------------------
   Renders strokes 1, 1-2, 1-2-3, ... up to
   the full character, by re-rendering the
   same data truncated to the first N
   strokes each time. Each render goes
   through the real HanziWriter pipeline,
   so the shapes are always correct.
========================================= */

async function buildStrokeOrderSequence(
    char,
    fullData,
    stepSizePx
) {

    if (
        !fullData ||
        !Array.isArray(fullData.strokes) ||
        fullData.strokes.length === 0
    ) {

        return null;

    }

    const total = fullData.strokes.length;
    const steps = [];

    for (let k = 1; k <= total; k++) {

        const truncatedData =
            Object.assign(
                {},
                fullData,
                {
                    strokes: fullData.strokes.slice(0, k),
                    medians:
                        Array.isArray(fullData.medians)
                            ? fullData.medians.slice(0, k)
                            : fullData.medians
                }
            );

        const stepPng =
            await renderCharDataToPNG(
                char,
                truncatedData,
                stepSizePx
            );

        steps.push(stepPng);

    }

    return { total: total, steps: steps };

}



/* =========================================
   DRAW A LIGHT-OPACITY IMAGE
   ---------------------------------------
   Used to turn the solid black character
   render into a faint tracing guide
   without needing a second, separately
   colored asset.
========================================= */

function addImageWithOpacity(
    doc,
    imgData,
    x,
    y,
    w,
    h,
    opacity
) {

    try {

        doc.saveGraphicsState();
        doc.setGState(new doc.GState({ opacity: opacity }));
        doc.addImage(imgData, "PNG", x, y, w, h);
        doc.restoreGraphicsState();

    }

    catch (e) {

        // GState not available - fall back to full opacity
        doc.addImage(imgData, "PNG", x, y, w, h);

    }

}



/* =========================================
   GENERATE WORKSHEET PDF USING JSPDF
========================================= */

async function generatePDFWorksheet(index) {

    if (!window.jspdf) {
        alert("jsPDF library is not loaded yet.");
        return;
    }

    const pdfButton =
        document.getElementById(
            `pdf-btn-${index}`
        );

    const originalButtonHTML =
        pdfButton ? pdfButton.innerHTML : null;

    if (pdfButton) {

        pdfButton.disabled = true;

        pdfButton.innerHTML =
            '<i class="fa-solid fa-spinner fa-spin"></i> Generating...';

    }

    try {

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({
            orientation: "portrait",
            unit: "mm",
            format: "a4"
        });

        const char = currentCharacters[index];
        if (!char) return;

        const pinyinEl = document.getElementById(`pinyin-value-${index}`);
        const zhuyinEl = document.getElementById(`zhuyin-value-${index}`);
        const meaningEl = document.getElementById(`meaning-value-${index}`);

        const pinyinText = pinyinEl ? pinyinEl.textContent.trim() : "-";
        const zhuyinText = zhuyinEl ? zhuyinEl.textContent.trim() : "-";
        const meaningText = meaningEl ? meaningEl.textContent.trim() : "-";

        const pageWidth = 210;
        const margin = 15;
        const contentWidth = pageWidth - (margin * 2);
        let currentY = 18;

        /*
         * Fetch the raw stroke data once, then
         * derive both the clean full-character
         * image and the stroke-order sequence
         * from that same data - no re-fetching,
         * no timeout guessing.
         */

        const fullData = await fetchCharacterData(char);

        const charImgData =
            await renderCharDataToPNG(char, fullData, 360);

        const strokeSequence =
            fullData
                ? await buildStrokeOrderSequence(char, fullData, 200)
                : null;

        /* ---------------------------------
           TITLE  (contains Hanzi -> image)
        ---------------------------------- */

        const titleWidth =
            addTextImageToPDF(
                doc,
                `${char}  Writing Practice`,
                margin,
                currentY,
                20,
                "#4a90d9",
                "bold",
                10
            );

        currentY += 14;

        doc.setFont("Helvetica", "normal");
        doc.setFontSize(10);
        doc.setTextColor(100, 100, 100);
        doc.text(
            "Name: _______________________    Date: ___________________",
            margin,
            currentY
        );

        currentY += 10;

        /* ---------------------------------
           STROKE ORDER ROW
        ---------------------------------- */

        doc.setFillColor(74, 144, 217);
        doc.roundedRect(margin, currentY - 4.5, 26, 7, 1.5, 1.5, "F");

        doc.setFont("Helvetica", "bold");
        doc.setFontSize(9);
        doc.setTextColor(255, 255, 255);
        doc.text("Stroke Order", margin + 3, currentY);

        if (strokeSequence && strokeSequence.steps.length > 0) {

            const stepBox = 13;
            const stepGap = 2;
            const maxPerRow = Math.floor(
                (contentWidth - 30) / (stepBox + stepGap)
            );

            let stepX = margin + 30;
            let stepY = currentY - 6.5;
            let colCount = 0;

            for (let i = 0; i < strokeSequence.steps.length; i++) {

                if (colCount >= maxPerRow) {

                    colCount = 0;
                    stepX = margin + 30;
                    stepY += stepBox + stepGap;

                }

                doc.setDrawColor(220, 220, 220);
                doc.setLineWidth(0.2);
                doc.rect(stepX, stepY, stepBox, stepBox);

                const stepImg = strokeSequence.steps[i];

                if (stepImg) {

                    doc.addImage(
                        stepImg,
                        "PNG",
                        stepX + 0.8,
                        stepY + 0.8,
                        stepBox - 1.6,
                        stepBox - 1.6
                    );

                }

                stepX += stepBox + stepGap;
                colCount++;

            }

            currentY = stepY + stepBox + 8;

        }

        else {

            doc.setFont("Helvetica", "italic");
            doc.setFontSize(8);
            doc.setTextColor(150, 150, 150);
            doc.text(
                "Stroke order data unavailable for this character.",
                margin + 30,
                currentY
            );

            currentY += 10;

        }

        /* ---------------------------------
           CHARACTER INFO BOX
        ---------------------------------- */

        doc.setFillColor(245, 245, 245);
        doc.roundedRect(margin, currentY, contentWidth, 22, 2, 2, "F");

        addTextImageToPDF(
            doc,
            `Character: ${char}`,
            margin + 5,
            currentY + 3,
            13,
            "#b5835a",
            "bold",
            6
        );

        addTextImageToPDF(
            doc,
            `Pinyin: ${pinyinText}   |   Zhuyin: ${zhuyinText}`,
            margin + 5,
            currentY + 10,
            9,
            "#3c3c3c",
            "normal",
            5
        );

        doc.setFont("Helvetica", "normal");
        doc.setFontSize(9);
        doc.setTextColor(60, 60, 60);

        let shortMeaning = meaningText;
        if (shortMeaning.length > 75) {
            shortMeaning = shortMeaning.substring(0, 72) + "...";
        }
        doc.text(`Meaning: ${shortMeaning}`, margin + 5, currentY + 19);

        currentY += 30;

        /* ---------------------------------
           PRACTICE GRID
           Row 1: dark example + faded guides
           Row 2: all faded guides
           Remaining rows: blank for practice
        ---------------------------------- */

        const cols = 8;
        const rows = 6;
        const boxSize = contentWidth / cols;
        const guidedRows = charImgData ? 2 : 0;

        for (let r = 0; r < rows; r++) {

            for (let c = 0; c < cols; c++) {

                const boxX = margin + (c * boxSize);
                const boxY = currentY + (r * boxSize);

                doc.setDrawColor(180, 180, 180);
                doc.setLineWidth(0.3);
                doc.rect(boxX, boxY, boxSize, boxSize);

                doc.setDrawColor(215, 215, 225);
                doc.setLineDashPattern([0.5, 0.5], 0);
                doc.line(
                    boxX + (boxSize / 2), boxY,
                    boxX + (boxSize / 2), boxY + boxSize
                );
                doc.line(
                    boxX, boxY + (boxSize / 2),
                    boxX + boxSize, boxY + (boxSize / 2)
                );
                doc.setLineDashPattern([], 0);

                if (charImgData && r < guidedRows) {

                    const pad = boxSize * 0.08;

                    if (r === 0 && c === 0) {

                        // Bold, dark reference example
                        doc.addImage(
                            charImgData, "PNG",
                            boxX + pad, boxY + pad,
                            boxSize - (pad * 2), boxSize - (pad * 2)
                        );

                    }

                    else {

                        // Faint tracing guide
                        addImageWithOpacity(
                            doc, charImgData,
                            boxX + pad, boxY + pad,
                            boxSize - (pad * 2), boxSize - (pad * 2),
                            0.22
                        );

                    }

                }

            }

        }

        currentY += (rows * boxSize) + 10;

        /* ---------------------------------
           FOOTER
        ---------------------------------- */

        doc.setFont("Helvetica", "italic");
        doc.setFontSize(8);
        doc.setTextColor(150, 150, 150);
        doc.text(
            "Generated by Boba Break Study - Hanzi Stroke & Worksheet Module",
            margin,
            290
        );

        doc.save(`BobaBreakStudy_Worksheet_${char}.pdf`);

    }

    catch (e) {

        console.log("PDF generation error:", e);
        alert("Sorry, something went wrong generating the PDF. Please try again.");

    }

    finally {

        if (pdfButton) {

            pdfButton.disabled = false;

            if (originalButtonHTML !== null) {

                pdfButton.innerHTML = originalButtonHTML;

            }

        }

    }

}

<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hanzi Stroke Order</title>

    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@2.1.0/dist/hanzi-writer-lib.min.js"></script>

</head>

<body>

    <h1>Hanzi Stroke Order</h1>

    <input id="hanziInput" type="text" placeholder="Masukkan Hanzi">

    <button onclick="searchHanzi()">Cari</button>

    <div id="character-target"></div>


<script>

const writer = HanziWriter.create(
    'character-target',
    '你',
    {
        width: 300,
        height: 300,
        showOutline: true
    }
);


function searchHanzi(){

    let hanzi = document.getElementById("hanziInput").value;

    writer.setCharacter(hanzi);

    writer.animateCharacter();

}

</script>


</body>

</html>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Include Hanzi Writer Library for stroke animations -->
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
    <!-- Include pinyin-pro Library for automatic pinyin generation -->

    <!-- Include Pinyin to Zhuyin converter library -->
    <script src="https://cdn.jsdelivr.net/npm/pinyin-to-bopomofo@latest/dist/index.umd.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f8f9fa;
            display: flex;
            min-height: 100vh;
        }

        /* Main Content Layout */
        .main-content {
            flex: 1;
            padding: 20px;
        }
        .card {
            width: 100%;
            background: #ffffff;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            border: 1px solid #eaeaea;
        }
        .card h2 {
            font-size: 20px;
            margin-bottom: 15px;
            color: #111;
        }
        
        /* Search Box */
        .search-box {
            display: flex;
            border: 1px solid #ddd;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .search-box input {
            flex: 1;
            padding: 10px 14px;
            border: none;
            outline: none;
            font-size: 14px;
        }
        .search-box button {
            background-color: #b5835a;
            color: white;
            border: none;
            padding: 0 20px;
            cursor: pointer;
            font-weight: bold;
        }
        .search-hint {
            font-size: 12px;
            color: #666;
        }

        /* Stroke Display Section */
        .stroke-display {
            width: 100%;
            text-align: center;
            border: 1px solid #eaeaea;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            background: #fff;
            display: flex;
            justify-content: center;
        }
        #character-target {
            width: 600px;
            height: 300px;
        }
        .character-info {
    text-align: center;
    font-family: "Comic Sans MS", "Segoe UI", sans-serif;
    margin-top: 15px;
}

.character-info p {
    font-size: 20px;
    color: #333;
    margin-bottom: 10px;
    font-weight: 500;
}

.character-info strong {
    color: #b87333;
}
        }

        
/* 2. Responsive Media Query for Mobile (Automatically adjusts to 300x300 and centers) */
        @media screen and (max-width: 768px) {
            .stroke-display {
                max-width: 300px;
                margin-left: auto;
                margin-right: auto;
            }
            #character-target {
                width: 300px;
                height: 300px;
            }
        }
        /* Custom Data / Backup Section */
        .backup-grid {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            overflow-x: auto;
        }
        .backup-item {
            width: 65px;
            height: 65px;
            border: 1px solid #ddd;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #aaa;
            background: #fafafa;
            flex-shrink: 0;
        }
        
    </style>
</head>
<body>

        </div>

        <nav aria-label="Main Navigation">
            <ul class="nav-menu">
                <li>
    <a href="index.html">
        <i class="fa-solid fa-chart-pie"></i>

</li>

                <li>

                <li class="active">

</li>

    <!-- Main Content Area -->
    <div class="main-content">
        
        <!-- Search Card -->
        <div class="card">
            <h2>Hanzi Stroke Order Finder</h2>
            <div class="search-box">
                <input type="text" id="char-input" placeholder="Enter a traditional Hanzi character (e.g. 學)">
                <button id="search-btn">Search</button>
            </div>
            <p class="search-hint">Enter a traditional Hanzi character.</p>
        </div>

        <!-- Result Card -->
        <div class="card">
            <div class="stroke-display">
                <!-- Hanzi Writer Target Container -->
                <div id="character-target"></div>
            </div>
            <div class="character-info" id="char-info">
    <p><strong>Hanzi:</strong> 學</p>
    <p><strong>Pinyin:</strong> xué</p>
    <p><strong>Zhuyin:</strong> ㄒㄩㄝˊ</p>
</div>
        <!-- Custom Data / Backup Card -->
        
    <!-- JavaScript Implementation -->

    <script>
        // 1. Deteksi ukuran layar otomatis saat pertama kali halaman dibuka
        let initialWidth = window.innerWidth <= 768 ? 300 : 600;

        let writer = HanziWriter.create('character-target', '學', {
            width: initialWidth,
            height: 300,
            padding: 5,
            showOutline: true,
            showCharacter: true,
            strokeAnimationSpeed: 1,
            strokeColor: '#333333'
        });

        writer.animateCharacter();

        const inputField = document.getElementById('char-input');
        const searchButton = document.getElementById('search-btn');
        const infoBox = document.getElementById('char-info');

        function handleSearch() {
            const val = inputField.value.trim();

            if (val.length > 0) {
                const targetChar = val[0];
                writer = null;
                document.getElementById('character-target').innerHTML = "";

                // 2. Deteksi ukuran layar otomatis saat tombol search diklik
                let renderWidth = window.innerWidth <= 768 ? 300 : 600;

                try {
                    writer = HanziWriter.create(
                        'character-target',
                        targetChar,
                        {
                            width: renderWidth,
                            height: 300,
                            padding: 5,
                            showOutline: true,
                            showCharacter: true,
                            strokeAnimationSpeed: 1,
                            strokeColor: '#333333',

                            onLoadCharDataError: function() {
                                document.getElementById('character-target').innerHTML =
                                '<p style="color:red;font-size:12px;margin-top:80px;">Character not found.</p>';
                            }
                        }
                    );

                    writer.animateCharacter();

                    let pinyinResult = "-";
                    let zhuyinResult = "-";
                    
                    try {
                        pinyinResult = pinyinPro.pinyin(
                            targetChar,
                            { toneType: 'symbol' }
                        );
 
                        let numPinyin = pinyinPro.pinyin(
                            targetChar,
                            { 
                                toneType: 'number',
                                type: 'array'
                            }
                                
                        );

                        numPinyin = numPinyin[0];

                        zhuyinResult = convertPinyinToZhuyin(numPinyin);
                        
                    } catch(error) {
                        console.log(error);
                        pinyinResult = "-";
                        zhuyinResult = "-";
                    }

                    infoBox.innerHTML = `
                        <p><strong>Hanzi:</strong> ${targetChar}</p>
                        <p><strong>Pinyin:</strong> ${pinyinResult}</p>
                        <p><strong>Zhuyin:</strong> ${zhuyinResult}</p>
                    `;

                } catch(error) {
                    console.log(error);
                    infoBox.innerHTML = `
                        <p><strong>Hanzi:</strong> ${targetChar}</p>
                        <p><strong>Pinyin:</strong> -</p>
                        <p><strong>Zhuyin:</strong> -</p>
                    `;
                }
            }
        }

        searchButton.addEventListener('click', handleSearch);

        inputField.addEventListener('keypress', function(e) {
            if (e.key === "Enter") {
                handleSearch();
            }
        });

        // Fungsi helper untuk menerjemahkan teks Pinyin ke Zhuyin secara akurat
        function convertPinyinToZhuyin(pinyinStr) {

    const initials = {
        'zh':'ㄓ', 'ch':'ㄔ', 'sh':'ㄕ',
        'b':'ㄅ', 'p':'ㄆ', 'm':'ㄇ', 'f':'ㄈ',
        'd':'ㄉ', 't':'ㄊ', 'n':'ㄋ', 'l':'ㄌ',
        'g':'ㄍ', 'k':'ㄎ', 'h':'ㄏ',
        'j':'ㄐ', 'q':'ㄑ', 'x':'ㄒ',
        'r':'ㄖ', 'z':'ㄗ', 'c':'ㄘ', 's':'ㄙ'
    };

    const finals = {
        'a':'ㄚ',
        'o':'ㄛ',
        'e':'ㄜ',
        'ai':'ㄞ',
        'ei':'ㄟ',
        'ao':'ㄠ',
        'ou':'ㄡ',
        'an':'ㄢ',
        'en':'ㄣ',
        'ang':'ㄤ',
        'eng':'ㄥ',
        'er':'ㄦ',
        'i':'ㄧ',
        'u':'ㄨ',
        'ü':'ㄩ'
    };

    let tone = '';

    // ambil nada
    if (/[1-5]$/.test(pinyinStr)) {
        let num = pinyinStr.slice(-1);
        pinyinStr = pinyinStr.slice(0,-1);

        if(num === '2') tone = 'ˊ';
        if(num === '3') tone = 'ˇ';
        if(num === '4') tone = 'ˋ';
        if(num === '5') tone = '˙';
    }

    let result = '';

    // cek initial
    let initial = '';
    for (let key of Object.keys(initials)) {
        if (pinyinStr.startsWith(key)) {
            initial = key;
            break;
        }
    }

    if(initial){
        result += initials[initial];
        pinyinStr = pinyinStr.slice(initial.length);
    }

    // final
    if(finals[pinyinStr]){
        result += finals[pinyinStr];
    } else {
        result += pinyinStr;
    }

    return result + tone;
}
    </script>
  </div>

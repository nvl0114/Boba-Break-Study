<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Boba Break Study - Stroke Order</title>


    <!-- Hanzi Writer -->
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>

    <!-- Pinyin Pro -->
    <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.16.0/dist/index.js"></script>

    <!-- Pinyin → Zhuyin -->
    <script src="https://cdn.jsdelivr.net/npm/pinyin-to-bopomofo@latest/dist/index.umd.js"></script>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }


        body {
            background-color: #f8f9fa;
            display: flex;
            min-height: 100vh;
        }


        /* ================================
           MAIN CONTENT
        ================================= */

        .main-content {
            flex: 1;
            padding: 20px;
        }


        .card {
            width: 100%;
            background: #ffffff;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;

            box-shadow: 0 2px 5px rgba(0,0,0,0.03);

            border: 1px solid #eaeaea;
        }


        .card h2 {
            font-size: 20px;
            margin-bottom: 15px;
            color: #111;
        }


        /* ================================
           SEARCH BOX
        ================================= */

        .search-box {
            display: flex;

            border: 1px solid #ddd;
            border-radius: 6px;

            overflow: hidden;

            margin-bottom: 8px;
        }


        .search-box input {
            flex: 1;

            padding: 10px 14px;

            border: none;
            outline: none;

            font-size: 14px;
        }


        .search-box button {
            background-color: #b5835a;

            color: white;

            border: none;

            padding: 0 20px;

            cursor: pointer;

            font-weight: bold;
        }


        .search-box button:hover {
            background-color: #9d704c;
        }


        .search-hint {
            font-size: 12px;
            color: #666;
        }


        /* ================================
           STROKE DISPLAY
        ================================= */

        .stroke-display {
            width: 100%;

            text-align: center;

            border: 1px solid #eaeaea;

            border-radius: 8px;

            padding: 20px;

            margin-bottom: 15px;

            background: #fff;

            display: flex;

            justify-content: center;

            align-items: center;
        }


        #character-target {
            width: 600px;
            height: 300px;
        }


        /* ================================
           CHARACTER INFO
        ================================= */

        .character-info {
            text-align: center;

            font-family:
                "Comic Sans MS",
                "Segoe UI",
                sans-serif;

            margin-top: 15px;
        }


        .character-info p {
            font-size: 20px;

            color: #333;

            margin-bottom: 10px;

            font-weight: 500;
        }


        .character-info strong {
            color: #b87333;
        }


        /* ================================
           SOUND BUTTON
        ================================= */

        .sound-btn {
            margin-top: 5px;

            padding: 9px 18px;

            border: none;

            border-radius: 25px;

            background-color: #b5835a;

            color: white;

            cursor: pointer;

            font-size: 14px;

            font-weight: bold;

            transition:
                background-color 0.2s ease,
                transform 0.15s ease,
                box-shadow 0.2s ease;
        }


        .sound-btn:hover {
            background-color: #9d704c;

            transform: translateY(-1px);
        }


        .sound-btn:active {
            transform: scale(0.96);
        }


        /* ================================
           SPEAKING EFFECT
        ================================= */

        .sound-btn.speaking {

            background-color: #765437;

            animation: soundPulse 1.2s infinite;

        }


        @keyframes soundPulse {

            0% {
                box-shadow:
                    0 0 0 0
                    rgba(181, 131, 90, 0.55);
            }

            70% {
                box-shadow:
                    0 0 0 12px
                    rgba(181, 131, 90, 0);
            }

            100% {
                box-shadow:
                    0 0 0 0
                    rgba(181, 131, 90, 0);
            }

        }


        /* ================================
           MOBILE
        ================================= */

        @media screen and (max-width: 768px) {

            .stroke-display {

                max-width: 300px;

                margin-left: auto;
                margin-right: auto;

                padding: 5px;
            }


            #character-target {

                width: 300px;
                height: 300px;
            }


            .character-info p {

                font-size: 18px;
            }

        }

    </style>

</head>


<body>


<div class="app-container">


    <!-- ================================
         SIDEBAR
    ================================= -->

    <div id="sidebar-container"></div>


    <!-- ================================
         MAIN CONTENT
    ================================= -->

    <div class="main-content">


        <!-- ================================
             SEARCH CARD
        ================================= -->

        <div class="card">

            <h2>
                Hanzi Stroke Order Finder
            </h2>


            <div class="search-box">

                <input
                    type="text"
                    id="char-input"
                    placeholder="Enter a traditional Hanzi character (e.g. 學)"
                    maxlength="1"
                >


                <button id="search-btn">
                    Search
                </button>

            </div>


            <p class="search-hint">
                Enter a traditional Hanzi character.
            </p>

        </div>



        <!-- ================================
             RESULT CARD
        ================================= -->

        <div class="card">


            <!-- Stroke Animation -->

            <div class="stroke-display">

                <div id="character-target"></div>

            </div>



            <!-- Character Information -->

            <div
                class="character-info"
                id="char-info"
            >

                <p>
                    <strong>Hanzi:</strong>
                    學
                </p>


                <p>
                    <strong>Pinyin:</strong>
                    xué
                </p>


                <p>
                    <strong>Zhuyin:</strong>
                    ㄒㄩㄝˊ
                </p>


                <!-- Sound -->

                <button
                    class="sound-btn"
                    id="sound-btn"
                    onclick="speakChinese()"
                >

                    🔊
                    <span id="sound-text">
                        Listen
                    </span>

                </button>

            </div>


        </div>


    </div>

</div>



<!-- ================================
     JAVASCRIPT
================================= -->

<script>


/* =========================================
   CURRENT CHARACTER
========================================= */

let currentCharacter = "學";



/* =========================================
   CREATE INITIAL HANZI WRITER
========================================= */

let initialWidth =
    window.innerWidth <= 768
        ? 300
        : 600;


let writer =
    HanziWriter.create(
        "character-target",
        "學",
        {

            width: initialWidth,

            height: 300,

            padding: 5,

            showOutline: true,

            showCharacter: true,

            strokeAnimationSpeed: 1,

            strokeColor: "#333333"

        }
    );


writer.animateCharacter();



/* =========================================
   ELEMENTS
========================================= */

const inputField =
    document.getElementById(
        "char-input"
    );


const searchButton =
    document.getElementById(
        "search-btn"
    );


const infoBox =
    document.getElementById(
        "char-info"
    );



/* =========================================
   SEARCH FUNCTION
========================================= */

function handleSearch() {

    const val =
        inputField.value.trim();


    if (val.length === 0) {
        return;
    }


    /*
     * Only use first character
     */

    const targetChar =
        val[0];


    /*
     * Update current character
     * for sound
     */

    currentCharacter =
        targetChar;


    /*
     * Stop any current speech
     */

    if ("speechSynthesis" in window) {

        speechSynthesis.cancel();

    }


    resetSoundButton();



    /*
     * Clear old Hanzi Writer
     */

    writer = null;


    document.getElementById(
        "character-target"
    ).innerHTML = "";



    /*
     * Responsive size
     */

    let renderWidth =
        window.innerWidth <= 768
            ? 300
            : 600;



    try {


        /* =================================
           CREATE HANZI WRITER
        ================================= */

        writer =
            HanziWriter.create(
                "character-target",
                targetChar,
                {

                    width: renderWidth,

                    height: 300,

                    padding: 5,

                    showOutline: true,

                    showCharacter: true,

                    strokeAnimationSpeed: 1,

                    strokeColor: "#333333",


                    onLoadCharDataError:
                        function() {

                            document
                                .getElementById(
                                    "character-target"
                                )
                                .innerHTML = `

                                <p style="
                                    color:red;
                                    font-size:12px;
                                    margin-top:80px;
                                ">
                                    Character not found.
                                </p>

                            `;

                        }

                }
            );


        writer.animateCharacter();



        /* =================================
           PINYIN
        ================================= */

        let pinyinResult = "-";


        /* =================================
           ZHUYIN
        ================================= */

        let zhuyinResult = "-";



        try {


            /*
             * Pinyin with tone marks
             */

            pinyinResult =
                pinyinPro.pinyin(
                    targetChar,
                    {
                        toneType: "symbol"
                    }
                );



            /*
             * Pinyin with tone number
             */

            let numPinyin =
                pinyinPro.pinyin(
                    targetChar,
                    {

                        toneType: "number",

                        type: "array"

                    }
                );


            /*
             * Get first character's
             * pronunciation
             */

            numPinyin =
                numPinyin[0];



            /*
             * Convert Pinyin
             * to Zhuyin
             */

            zhuyinResult =
                convertPinyinToZhuyin(
                    numPinyin
                );


        }

        catch(error) {

            console.log(
                "Pinyin error:",
                error
            );


            pinyinResult = "-";

            zhuyinResult = "-";

        }



        /* =================================
           UPDATE CHARACTER INFO
        ================================= */

        infoBox.innerHTML = `

            <p>
                <strong>Hanzi:</strong>
                ${targetChar}
            </p>


            <p>
                <strong>Pinyin:</strong>
                ${pinyinResult}
            </p>


            <p>
                <strong>Zhuyin:</strong>
                ${zhuyinResult}
            </p>


            <button
                class="sound-btn"
                id="sound-btn"
                onclick="speakChinese()"
            >

                🔊

                <span id="sound-text">
                    Listen
                </span>

            </button>

        `;


    }

    catch(error) {


        console.log(
            "Hanzi Writer error:",
            error
        );


        infoBox.innerHTML = `

            <p>
                <strong>Hanzi:</strong>
                ${targetChar}
            </p>


            <p>
                <strong>Pinyin:</strong>
                -
            </p>


            <p>
                <strong>Zhuyin:</strong>
                -
            </p>


            <button
                class="sound-btn"
                id="sound-btn"
                onclick="speakChinese()"
            >

                🔊
                <span id="sound-text">
                    Listen
                </span>

            </button>

        `;

    }

}



/* =========================================
   SEARCH BUTTON
========================================= */

searchButton.addEventListener(
    "click",
    handleSearch
);



/* =========================================
   ENTER KEY
========================================= */

inputField.addEventListener(
    "keypress",
    function(event) {

        if (event.key === "Enter") {

            handleSearch();

        }

    }
);



/* =========================================
   TEXT TO SPEECH
========================================= */

function speakChinese() {


    /*
     * Check browser support
     */

    if (
        !("speechSynthesis" in window)
    ) {

        alert(
            "Your browser does not support text-to-speech."
        );

        return;

    }



    /*
     * If already speaking,
     * stop speech
     */

    if (
        speechSynthesis.speaking
    ) {

        speechSynthesis.cancel();

        resetSoundButton();

        return;

    }



    /*
     * Create speech
     */

    const utterance =
        new SpeechSynthesisUtterance(
            currentCharacter
        );



    /*
     * Taiwan Mandarin
     */

    utterance.lang =
        "zh-TW";



    /*
     * Slower speed
     * for language learners
     */

    utterance.rate =
        0.75;


    utterance.pitch =
        1;



    /*
     * Speech starts
     */

    utterance.onstart =
        function() {

            setSpeakingButton();

        };



    /*
     * Speech ends
     */

    utterance.onend =
        function() {

            resetSoundButton();

        };



    /*
     * Speech error
     */

    utterance.onerror =
        function() {

            resetSoundButton();

        };



    /*
     * Stop previous speech
     */

    speechSynthesis.cancel();



    /*
     * Play
     */

    speechSynthesis.speak(
        utterance
    );

}



/* =========================================
   SPEAKING BUTTON
========================================= */

function setSpeakingButton() {

    const button =
        document.getElementById(
            "sound-btn"
        );


    const text =
        document.getElementById(
            "sound-text"
        );


    if (!button) {
        return;
    }


    button.classList.add(
        "speaking"
    );


    if (text) {

        text.textContent =
            "Speaking...";

    }

}



/* =========================================
   RESET SOUND BUTTON
========================================= */

function resetSoundButton() {

    const button =
        document.getElementById(
            "sound-btn"
        );


    const text =
        document.getElementById(
            "sound-text"
        );


    if (!button) {
        return;
    }


    button.classList.remove(
        "speaking"
    );


    if (text) {

        text.textContent =
            "Listen";

    }

}



/* =========================================
   PINYIN → ZHUYIN
========================================= */

function convertPinyinToZhuyin(
    pinyinStr
) {


    if (!pinyinStr) {
        return "";
    }


    pinyinStr =
        pinyinStr
            .toLowerCase()
            .trim();



    /* =====================================
       TONE MAP
    ===================================== */

    const toneMap = {

        "ā": "a1",
        "á": "a2",
        "ǎ": "a3",
        "à": "a4",

        "ē": "e1",
        "é": "e2",
        "ě": "e3",
        "è": "e4",

        "ī": "i1",
        "í": "i2",
        "ǐ": "i3",
        "ì": "i4",

        "ō": "o1",
        "ó": "o2",
        "ǒ": "o3",
        "ò": "o4",

        "ū": "u1",
        "ú": "u2",
        "ǔ": "u3",
        "ù": "u4",

        "ǖ": "ü1",
        "ǘ": "ü2",
        "ǚ": "ü3",
        "ǜ": "ü4"

    };



    /* =====================================
       ZHUYIN TONES
    ===================================== */

    const zhuyinTones = {

        "1": "",

        "2": "ˊ",

        "3": "ˇ",

        "4": "ˋ",

        "5": "˙"

    };


    let toneNum = "1";



    /* =====================================
       TONE NUMBER
    ===================================== */

    if (
        /[1-5]$/.test(
            pinyinStr
        )
    ) {

        toneNum =
            pinyinStr.slice(-1);


        pinyinStr =
            pinyinStr.slice(
                0,
                -1
            );

    }


    /* =====================================
       TONE MARK
    ===================================== */

    else {

        for (
            let char of pinyinStr
        ) {

            if (
                toneMap[char]
            ) {

                let converted =
                    toneMap[char];


                pinyinStr =
                    pinyinStr.replace(
                        char,
                        converted[0]
                    );


                toneNum =
                    converted[1];


                break;

            }

        }

    }



    const toneSymbol =
        zhuyinTones[toneNum] || "";



    /* =====================================
       INITIALS
    ===================================== */

    const initials = {

        "zh": "ㄓ",
        "ch": "ㄔ",
        "sh": "ㄕ",

        "b": "ㄅ",
        "p": "ㄆ",
        "m": "ㄇ",
        "f": "ㄈ",

        "d": "ㄉ",
        "t": "ㄊ",
        "n": "ㄋ",
        "l": "ㄌ",

        "g": "ㄍ",
        "k": "ㄎ",
        "h": "ㄏ",

        "j": "ㄐ",
        "q": "ㄑ",
        "x": "ㄒ",

        "r": "ㄖ",
        "z": "ㄗ",
        "c": "ㄘ",
        "s": "ㄙ"

    };



    /* =====================================
       FINALS
    ===================================== */

    const finals = {

        "a": "ㄚ",
        "o": "ㄛ",
        "e": "ㄜ",
        "er": "ㄦ",

        "ai": "ㄞ",
        "ei": "ㄟ",
        "ao": "ㄠ",
        "ou": "ㄡ",

        "an": "ㄢ",
        "en": "ㄣ",

        "ang": "ㄤ",
        "eng": "ㄥ",

        "i": "ㄧ",
        "u": "ㄨ",
        "ü": "ㄩ",

        "wa": "ㄨㄚ",
        "wo": "ㄨㄛ",
        "wai": "ㄨㄞ",
        "wei": "ㄨㄟ",

        "wan": "ㄨㄢ",
        "wen": "ㄨㄣ",

        "wang": "ㄨㄤ",
        "weng": "ㄨㄥ",

        "ya": "ㄧㄚ",
        "yo": "ㄧㄛ",
        "ye": "ㄧㄝ",

        "yao": "ㄧㄠ",
        "you": "ㄧㄡ",

        "yan": "ㄧㄢ",
        "yin": "ㄧㄣ",

        "yang": "ㄧㄤ",
        "ying": "ㄧㄥ",

        "wu": "ㄨ",
        "yi": "ㄧ",
        "yu": "ㄩ",

        "ia": "ㄧㄚ",
        "io": "ㄧㄛ",
        "ie": "ㄧㄝ",

        "iao": "ㄧㄠ",
        "iu": "ㄧㄡ",

        "ian": "ㄧㄢ",
        "in": "ㄧㄣ",

        "iang": "ㄧㄤ",
        "ing": "ㄧㄥ",

        "ua": "ㄨㄚ",
        "uo": "ㄨㄛ",

        "uai": "ㄨㄞ",
        "ui": "ㄨㄟ",

        "uan": "ㄨㄢ",
        "un": "ㄨㄣ",

        "uang": "ㄨㄤ",
        "ong": "ㄨㄥ",

        "üe": "ㄩㄝ",
        "üan": "ㄩㄢ",
        "ün": "ㄩㄣ",

        "iong": "ㄩㄥ"

    };



    let result = "";

    let initial = "";



    /* =====================================
       FIND INITIAL
    ===================================== */

    for (
        let key of Object.keys(initials)
    ) {

        if (
            pinyinStr.startsWith(key)
        ) {

            initial = key;

            break;

        }

    }



    if (initial) {

        result +=
            initials[initial];


        pinyinStr =
            pinyinStr.slice(
                initial.length
            );

    }



    /* =====================================
       FIND FINAL
    ===================================== */

    if (
        finals[pinyinStr]
    ) {

        result +=
            finals[pinyinStr];

    }

    else {

        result +=
            pinyinStr;

    }



    return result +
           toneSymbol;

}

</script>



<!-- Existing site script -->
<script src="script.js"></script>


</body>
</html>

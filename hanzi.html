        <!-- Search Card -->
        <div class="card">
            <h2>Hanzi Stroke Order Finder</h2>
            <div class="search-box">

            <div class="character-info" id="char-info">
    <p><strong>Hanzi:</strong> 學</p>
    <p><strong>Pinyin:</strong> xué</p>
    <p><strong>Zhuyin:</strong> ㄒㄩㄝˊ</p>
</div>

    <!-- JavaScript Implementation -->

    <script>
        // 1. Deteksi ukuran layar otomatis saat pertama kali halaman dibuka
        let initialWidth = window.innerWidth <= 768 ? 300 : 600;

        let writer = HanziWriter.create('character-target', '學', {
            width: initialWidth,
            height: 300,
            padding: 5,
            showOutline: true,
            showCharacter: true,
            strokeAnimationSpeed: 1,
            strokeColor: '#333333'
        });

        writer.animateCharacter();

        const inputField = document.getElementById('char-input');
        const searchButton = document.getElementById('search-btn');
        const infoBox = document.getElementById('char-info');

        function handleSearch() {
            const val = inputField.value.trim();

            if (val.length > 0) {
                const targetChar = val[0];
                writer = null;
                document.getElementById('character-target').innerHTML = "";

                // 2. Deteksi ukuran layar otomatis saat tombol search diklik
                let renderWidth = window.innerWidth <= 768 ? 300 : 600;

                try {
                    writer = HanziWriter.create(
                        'character-target',
                        targetChar,
                        {
                            width: renderWidth,
                            height: 300,
                            padding: 5,
                            showOutline: true,
                            showCharacter: true,
                            strokeAnimationSpeed: 1,
                            strokeColor: '#333333',

                            onLoadCharDataError: function() {
                                document.getElementById('character-target').innerHTML =
                                '<p style="color:red;font-size:12px;margin-top:80px;">Character not found.</p>';
                            }
                        }
                    );

                    writer.animateCharacter();

                    let pinyinResult = "-";
                    let zhuyinResult = "-";
                    
                    try {
                        pinyinResult = pinyinPro.pinyin(
                            targetChar,
                            { toneType: 'symbol' }
                        );
 
                        let numPinyin = pinyinPro.pinyin(
                            targetChar,
                            { 
                                toneType: 'number',
                                type: 'array'
                            }
                                
                        );

                        numPinyin = numPinyin[0];

                        zhuyinResult = convertPinyinToZhuyin(numPinyin);
                        
                    } catch(error) {
                        console.log(error);
                        pinyinResult = "-";
                        zhuyinResult = "-";
                    }

                    infoBox.innerHTML = `
                        <p><strong>Hanzi:</strong> ${targetChar}</p>
                        <p><strong>Pinyin:</strong> ${pinyinResult}</p>
                        <p><strong>Zhuyin:</strong> ${zhuyinResult}</p>
                    `;

                } catch(error) {
                    console.log(error);
                    infoBox.innerHTML = `
                        <p><strong>Hanzi:</strong> ${targetChar}</p>
                        <p><strong>Pinyin:</strong> -</p>
                        <p><strong>Zhuyin:</strong> -</p>
                    `;
                }
            }
        }

        searchButton.addEventListener('click', handleSearch);

        inputField.addEventListener('keypress', function(e) {
            if (e.key === "Enter") {
                handleSearch();
            }
        });

        // Fungsi helper untuk menerjemahkan teks Pinyin ke Zhuyin secara akurat
        function convertPinyinToZhuyin(pinyinStr) {
    if (!pinyinStr) return '';
    pinyinStr = pinyinStr.toLowerCase().trim();

    // Map accented pinyin vowels to base vowel + tone number
    const toneMap = {
        'ā':'a1','á':'a2','ǎ':'a3','à':'a4',
        'ē':'e1','é':'e2','ě':'e3','è':'e4',
        'ī':'i1','í':'i2','ǐ':'i3','ì':'i4',
        'ō':'o1','ó':'o2','ǒ':'o3','ò':'o4',
        'ū':'u1','ú':'u2','ǔ':'u3','ù':'u4',
        'ǖ':'ü1','ǘ':'ü2','ǚ':'ü3','ǜ':'ü4'
    };

    // Map tone numbers to Zhuyin tone symbols
    const zhuyinTones = {
        '1': '',   
        '2': 'ˊ',  
        '3': 'ˇ',  
        '4': 'ˋ',  
        '5': '˙'   
    };

    let toneNum = '1';

    // Check if input ends with a tone number (e.g., lai2)
    if (/[1-5]$/.test(pinyinStr)) {
        toneNum = pinyinStr.slice(-1);
        pinyinStr = pinyinStr.slice(0, -1);
    } 
    // Otherwise, check for tone symbols on vowels (e.g., lái)
    else {
        for (let char of pinyinStr) {
            if (toneMap[char]) {
                let converted = toneMap[char];
                pinyinStr = pinyinStr.replace(char, converted[0]);
                toneNum = converted[1];
                break;
            }
        }
    }

    // Get the correct Zhuyin tone symbol
    let toneSymbol = zhuyinTones[toneNum] || '';

    const initials = {
        'zh':'ㄓ', 'ch':'ㄔ', 'sh':'ㄕ',
        'b':'ㄅ', 'p':'ㄆ', 'm':'ㄇ', 'f':'ㄈ',
        'd':'ㄉ', 't':'ㄊ', 'n':'ㄋ', 'l':'ㄌ',
        'g':'ㄍ', 'k':'ㄎ', 'h':'ㄏ',
        'j':'ㄐ', 'q':'ㄑ', 'x':'ㄒ',
        'r':'ㄖ', 'z':'ㄗ', 'c':'ㄘ', 's':'ㄙ'
    };

    const finals = {
        'a':'ㄚ', 'o':'ㄛ', 'e':'ㄜ', 'er':'ㄦ',
        'ai':'ㄞ', 'ei':'ㄟ', 'ao':'ㄠ', 'ou':'ㄡ',
        'an':'ㄢ', 'en':'ㄣ', 'ang':'ㄤ', 'eng':'ㄥ',
        'i':'ㄧ', 'u':'ㄨ', 'ü':'ㄩ',
        'wa':'ㄨㄚ', 'wo':'ㄨㄛ', 'wai':'ㄨㄞ', 'wei':'ㄨㄟ',
        'wan':'ㄨㄢ', 'wen':'ㄨㄣ', 'wang':'ㄨㄤ', 'weng':'ㄨㄥ',
        'ya':'ㄧㄚ', 'yo':'ㄧㄛ', 'ye':'ㄧㄝ', 'yao':'ㄧㄠ', 'you':'ㄧㄡ',
        'yan':'ㄧㄢ', 'yin':'ㄧㄣ', 'yang':'ㄧㄤ', 'ying':'ㄧㄥ',
        'wu':'ㄨ', 'yi':'ㄧ', 'yu':'ㄩ',
        'ia':'ㄧㄚ', 'io':'ㄧㄛ', 'ie':'ㄧㄝ', 'iao':'ㄧㄠ', 'iu':'ㄧㄡ',
        'ian':'ㄧㄢ', 'in':'ㄧㄣ', 'iang':'ㄧㄤ', 'ing':'ㄧㄥ',
        'ua':'ㄨㄚ', 'uo':'ㄨㄛ', 'uai':'ㄨㄞ', 'ui':'ㄨㄟ',
        'uan':'ㄨㄢ', 'un':'ㄨㄣ', 'uang':'ㄨㄤ', 'ong':'ㄨㄥ',
        'üe':'ㄩㄝ', 'üan':'ㄩㄢ', 'ün':'ㄩㄣ', 'iong':'ㄩㄥ'
   };   

    let result = '';

    // Check initial consonant
    let initial = '';
    for (let key of Object.keys(initials)) {
        if (pinyinStr.startsWith(key)) {
            initial = key;
            break;
        }
    }

    if (initial) {
        result += initials[initial];
        pinyinStr = pinyinStr.slice(initial.length);
    }

    // Check final vowel
    if (finals[pinyinStr]) {
        result += finals[pinyinStr];
    } else {
        result += pinyinStr;
    }

    // Return combined result with the correct Zhuyin tone symbol
    return result + toneSymbol;
}

    </script>

    .character-info strong {

    }


    /* =========================================

    .meaning-text {

        max-width: 600px;

            0 auto 12px auto;

    .meaning-label {

    /* =========================================

    .sound-btn {

</head><body><div class="app-container"><!-- =========================================

<div id="sidebar-container"></div>

<div class="main-content">


    <!-- =====================================

    <div class="card">

        <h2>

        </h2>


        <div class="search-box">

                </p>

                </p>

                    </span>

</div><script>


/* =========================================
   CURRENT CHARACTERS
========================================= */

let currentCharacters = ["學"];


/* =========================================
   WRITER STORAGE
========================================= */

let writers = [];


/* =========================================
   HANZI WRITER SETTINGS
========================================= */

const strokeOptions = {

    padding: 5,

    showOutline: true,

    showCharacter: true,

    strokeAnimationSpeed: 1,

    strokeColor: "#333333"

};


/* =========================================
   ACJK TRADITIONAL DATA LOADER
========================================= */

function loadACJKTraditionalData(
    char,
    onComplete,
    onError
) {

    const url =
        "https://cdn.jsdelivr.net/npm/" +
        "hanzi-writer-data-acjk@latest/" +
        "animCJK/ZhHant/" +
        encodeURIComponent(char) +
        ".json";


    fetch(url)

        .then(function(response) {

            if (!response.ok) {

                throw new Error(
                    "ACJK Traditional data not found"
                );

            }

            return response.json();

        })

        .then(function(data) {

            console.log(
                "ACJK ZhHant loaded:",
                char
            );

            onComplete(data);

        })

        .catch(function(error) {

            console.log(
                "ACJK ZhHant failed:",
                char,
                error
            );


            /*
             * FALLBACK TO ORIGINAL
             * HANZI WRITER DATA
             */

            loadOriginalHanziWriterData(
                char,
                onComplete,
                onError
            );

        });

}



/* =========================================
   ORIGINAL HANZI WRITER FALLBACK
========================================= */

function loadOriginalHanziWriterData(
    char,
    onComplete,
    onError
) {

    const url =
        "https://cdn.jsdelivr.net/npm/" +
        "hanzi-writer-data@latest/" +
        encodeURIComponent(char) +
        ".json";


    fetch(url)

        .then(function(response) {

            if (!response.ok) {

                throw new Error(
                    "Original Hanzi Writer data not found"
                );

            }

            return response.json();

        })

        .then(function(data) {

            console.log(
                "Original Hanzi Writer data loaded:",
                char
            );

            onComplete(data);

        })

        .catch(function(error) {

            console.log(
                "Original data also failed:",
                char,
                error
            );


            if (onError) {

                onError(error);

            }

        });

}



/* =========================================
   CREATE HANZI WRITER
========================================= */

function createStrokeWriter(
    character,
    targetId
) {

    const target =
        document.getElementById(
            targetId
        );


    if (!target) {

        return null;

    }


    target.innerHTML = "";


    const renderWidth =
        window.innerWidth <= 768
            ? 300
            : 600;


    try {

        const writer =
            HanziWriter.create(
                targetId,
                character,
                {

                    width:
                        renderWidth,

                    height:
                        300,

                    padding:
                        strokeOptions.padding,

                    showOutline:
                        strokeOptions.showOutline,

                    showCharacter:
                        strokeOptions.showCharacter,

                    strokeAnimationSpeed:
                        strokeOptions.strokeAnimationSpeed,

                    strokeColor:
                        strokeOptions.strokeColor,


                    /*
                     * Traditional ACJK first,
                     * original dataset second.
                     */

                    charDataLoader:
                        function(
                            char,
                            onComplete,
                            onError
                        ) {

                            loadACJKTraditionalData(
                                char,
                                onComplete,
                                onError
                            );

                        },


                    onLoadCharDataSuccess:
                        function(data) {

                            console.log(
                                "Stroke data successfully loaded:",
                                character
                            );

                        },


                    onLoadCharDataError:
                        function(error) {

                            console.log(
                                "Final stroke data error:",
                                error
                            );


                            target.innerHTML = `

                                <p class="stroke-error">

                                    Stroke order data
                                    is not available
                                    for this character.

                                </p>

                            `;

                        }

                }
            );


        /*
         * Animate automatically
         */

        writer.animateCharacter();


        return writer;

    }

    catch(error) {

        console.log(
            "Hanzi Writer creation error:",
            error
        );


        target.innerHTML = `

            <p class="stroke-error">

                Unable to load stroke order.

            </p>

        `;


        return null;

    }

}



/* =========================================
   ELEMENTS
========================================= */

const inputField =
    document.getElementById(
        "char-input"
    );


const searchButton =
    document.getElementById(
        "search-btn"
    );


const resultsContainer =
    document.getElementById(
        "results-container"
    );



/* =========================================
   INITIAL CHARACTER
========================================= */

writers[0] =
    createStrokeWriter(
        "學",
        "character-target-0"
    );



/* =========================================
   CREATE RESULT CARD
========================================= */

function createCharacterCard(
    character,
    index
) {

    return `

        <div class="character-result">

            <div class="character-number">

                Character ${index + 1}

            </div>


            <div class="stroke-display">

                <div
                    class="character-target"
                    id="character-target-${index}"
                >

                    <p class="stroke-loading">

                        Loading...

                    </p>

                </div>

            </div>


            <div
                class="character-info"
                id="char-info-${index}"
            >

                <p>

                    <strong>Hanzi:</strong>

                    ${character}

                </p>


                <p>

                    <strong>Pinyin:</strong>

                    <span id="pinyin-value-${index}">

                        Loading...

                    </span>

                </p>


                <p>

                    <strong>Zhuyin:</strong>

                    <span id="zhuyin-value-${index}">

                        Loading...

                    </span>

                </p>


                <p class="meaning-text">

                    <span class="meaning-label">

                        Meaning:

                    </span>


                    <span
                        class="meaning-loading"
                        id="meaning-value-${index}"
                    >

                        Looking up...

                    </span>

                </p>


                <button
                    class="sound-btn"
                    id="sound-btn-${index}"
                    onclick="speakChinese(${index})"
                >

                    🔊

                    <span id="sound-text-${index}">

                        Listen

                    </span>

                </button>

            </div>

        </div>

    `;

}



/* =========================================
   SEARCH
========================================= */

async function handleSearch() {

    const val =
        inputField.value.trim();


    if (val.length === 0) {

        return;

    }


    /*
     * Take maximum 3 characters
     */

    const characters =
        Array.from(val).slice(0, 3);


    currentCharacters =
        characters;


    /*
     * Stop speech
     */

    if (
        "speechSynthesis" in window
    ) {

        speechSynthesis.cancel();

    }


    resetAllSoundButtons();


    /*
     * Clear old writers
     */

    writers = [];


    /*
     * Create cards
     */

    resultsContainer.innerHTML = "";


    characters.forEach(
        function(character, index) {

            resultsContainer.insertAdjacentHTML(
                "beforeend",
                createCharacterCard(
                    character,
                    index
                )
            );

        }
    );


    /*
     * Create stroke writers
     */

    characters.forEach(
        function(character, index) {

            writers[index] =
                createStrokeWriter(
                    character,
                    `character-target-${index}`
                );

        }
    );


    /*
     * Load dictionary information
     * independently for each character
     */

    const dictionaryPromises =
        characters.map(
            function(character, index) {

                return loadDictionaryData(
                    character,
                    index
                );

            }
        );


    await Promise.all(
        dictionaryPromises
    );

}



/* =========================================
   TAIWAN MANDARIN API
========================================= */

async function loadDictionaryData(
    targetChar,
    index
) {

    const encodedChar =
        encodeURIComponent(
            targetChar
        );


    const apiUrl =
        "https://api.taiwanmandarin.com/" +
        "characters/" +
        encodedChar;


    try {

        const response =
            await fetch(
                apiUrl
            );


        if (!response.ok) {

            throw new Error(
                "Character not found in dictionary"
            );

        }


        const data =
            await response.json();



        /*
         * Pinyin
         */

        let pinyinResult =
            data.pinyin || "-";



        /*
         * Zhuyin
         */

        let zhuyinResult =
            data.bopomofo || "-";



        /*
         * English
         */

        let meaningResult =
            data.english || "";



        /*
         * Update Pinyin
         */

        const pinyinElement =
            document.getElementById(
                `pinyin-value-${index}`
            );


        if (pinyinElement) {

            pinyinElement.textContent =
                pinyinResult;

        }



        /*
         * Update Zhuyin
         */

        const zhuyinElement =
            document.getElementById(
                `zhuyin-value-${index}`
            );


        if (zhuyinElement) {

            zhuyinElement.textContent =
                zhuyinResult;

        }



        /*
         * Update English meaning
         */

        const meaningElement =
            document.getElementById(
                `meaning-value-${index}`
            );


        if (meaningElement) {

            if (meaningResult) {

                meaningElement.textContent =
                    meaningResult;

                meaningElement.className =
                    "meaning-value";

            }

            else {

                meaningElement.textContent =
                    "Meaning not available yet.";

                meaningElement.className =
                    "meaning-unavailable";

            }

        }

    }

    catch(error) {

        console.log(
            "Taiwan Mandarin API error:",
            targetChar,
            error
        );


        /*
         * Pinyin Pro fallback
         */

        let pinyinResult = "-";

        let zhuyinResult = "-";


        try {

            pinyinResult =
                pinyinPro.pinyin(
                    targetChar,
                    {
                        toneType:
                            "symbol"
                    }
                );


            let numberPinyin =
                pinyinPro.pinyin(
                    targetChar,
                    {

                        toneType:
                            "number",

                        type:
                            "array"

                    }
                );


            numberPinyin =
                numberPinyin[0];


            zhuyinResult =
                convertPinyinToZhuyin(
                    numberPinyin
                );

        }

        catch(fallbackError) {

            console.log(
                "Pinyin fallback error:",
                fallbackError
            );

        }



        /*
         * Update fallback Pinyin
         */

        const pinyinElement =
            document.getElementById(
                `pinyin-value-${index}`
            );


        if (pinyinElement) {

            pinyinElement.textContent =
                pinyinResult;

        }



        /*
         * Update fallback Zhuyin
         */

        const zhuyinElement =
            document.getElementById(
                `zhuyin-value-${index}`
            );


        if (zhuyinElement) {

            zhuyinElement.textContent =
                zhuyinResult;

        }



        /*
         * Meaning unavailable
         */

        const meaningElement =
            document.getElementById(
                `meaning-value-${index}`
            );


        if (meaningElement) {

            meaningElement.textContent =
                "Meaning not available yet.";

            meaningElement.className =
                "meaning-unavailable";

        }

    }

}



/* =========================================
   SEARCH BUTTON
========================================= */

searchButton.addEventListener(
    "click",
    handleSearch
);



/* =========================================
   ENTER KEY
========================================= */

inputField.addEventListener(
    "keypress",
    function(event) {

        if (event.key === "Enter") {

            handleSearch();

        }

    }
);



/* =========================================
   TEXT TO SPEECH
========================================= */

function speakChinese(index) {

    if (
        !("speechSynthesis" in window)
    ) {

        alert(
            "Your browser does not support text-to-speech."
        );

        return;

    }


    /*
     * Stop if currently speaking
     */

    if (
        speechSynthesis.speaking
    ) {

        speechSynthesis.cancel();

        resetAllSoundButtons();

        return;

    }


    const character =
        currentCharacters[index];


    if (!character) {

        return;

    }


    /*
     * Create utterance
     */

    const utterance =
        new SpeechSynthesisUtterance(
            character
        );


    /*
     * Taiwan Mandarin
     */

    utterance.lang =
        "zh-TW";


    /*
     * Learning speed
     */

    utterance.rate =
        0.75;


    utterance.pitch =
        1;



    /*
     * Start
     */

    utterance.onstart =
        function() {

            setSpeakingButton(
                index
            );

        };



    /*
     * End

     */

    utterance.onend =
        function() {

            resetSoundButton(
                index
            );

        };



    /*
     * Error
     */

    utterance.onerror =
        function() {

            resetSoundButton(
                index
            );

        };


    speechSynthesis.cancel();


    speechSynthesis.speak(
        utterance
    );

}



/* =========================================
   SOUND BUTTON - PLAYING
========================================= */

function setSpeakingButton(
    index
) {

    const button =
        document.getElementById(
            `sound-btn-${index}`
        );


    const text =
        document.getElementById(
            `sound-text-${index}`
        );


    if (!button) {

        return;

    }


    button.classList.add(
        "speaking"
    );


    if (text) {

        text.textContent =
            "Speaking...";

    }

}



/* =========================================
   SOUND BUTTON - RESET
========================================= */

function resetSoundButton(
    index
) {

    const button =
        document.getElementById(
            `sound-btn-${index}`
        );


    const text =
        document.getElementById(
            `sound-text-${index}`
        );


    if (!button) {

        return;

    }


    button.classList.remove(
        "speaking"
    );


    if (text) {

        text.textContent =
            "Listen";

    }

}



/* =========================================
   RESET ALL SOUND BUTTONS
========================================= */

function resetAllSoundButtons() {

    document
        .querySelectorAll(
            ".sound-btn"
        )
        .forEach(
            function(button) {

                button.classList.remove(
                    "speaking"
                );

            }
        );


    document
        .querySelectorAll(
            "[id^='sound-text-']"
        )
        .forEach(
            function(text) {

                text.textContent =
                    "Listen";

            }
        );

}



/* =========================================
   PINYIN → ZHUYIN FALLBACK
========================================= */

function convertPinyinToZhuyin(
    pinyinStr
) {

    if (!pinyinStr) {

        return "";

    }


    pinyinStr =
        pinyinStr
            .toLowerCase()
            .trim();



    /*
     * Tone map
     */

    const toneMap = {

        "ā": "a1",
        "á": "a2",
        "ǎ": "a3",
        "à": "a4",

        "ē": "e1",
        "é": "e2",
        "ě": "e3",
        "è": "e4",

        "ī": "i1",
        "í": "i2",
        "ǐ": "i3",
        "ì": "i4",

        "ō": "o1",
        "ó": "o2",
        "ǒ": "o3",
        "ò": "o4",

        "ū": "u1",
        "ú": "u2",
        "ǔ": "u3",
        "ù": "u4",

        "ǖ": "ü1",
        "ǘ": "ü2",
        "ǚ": "ü3",
        "ǜ": "ü4"

    };



    /*
     * Zhuyin tone symbols
     */

    const zhuyinTones = {

        "1": "",

        "2": "ˊ",

        "3": "ˇ",

        "4": "ˋ",

        "5": "˙"

    };


    let toneNum = "1";



    /*
     * Tone number
     */

    if (
        /[1-5]$/.test(
            pinyinStr
        )
    ) {

        toneNum =
            pinyinStr.slice(-1);


        pinyinStr =
            pinyinStr.slice(
                0,
                -1
            );

    }


    /*
     * Tone mark
     */

    else {

        for (
            let char of pinyinStr
        ) {

            if (
                toneMap[char]
            ) {

                const converted =
                    toneMap[char];


                pinyinStr =
                    pinyinStr.replace(
                        char,
                        converted[0]
                    );


                toneNum =
                    converted[1];


                break;

            }

        }

    }



    const toneSymbol =
        zhuyinTones[toneNum] || "";



    /*
     * Initials
     */

    const initials = {

        "zh": "ㄓ",
        "ch": "ㄔ",
        "sh": "ㄕ",

        "b": "ㄅ",
        "p": "ㄆ",
        "m": "ㄇ",

        "q": "ㄑ",
        "x": "ㄒ",

        "r": "ㄖ",
        "z": "ㄗ",
        "c": "ㄘ",
        "s": "ㄙ"

    };



    /*
     * Finals
     */

    const finals = {

        "a": "ㄚ",
        "o": "ㄛ",
        "e": "ㄜ",
        "er": "ㄦ",

        "ai": "ㄞ",
        "ei": "ㄟ",

        "i": "ㄧ",

        "ü": "ㄩ",

        "wa": "ㄨㄚ",
        "wo": "ㄨㄛ",
        "wai": "ㄨㄞ",
        "wei": "ㄨㄟ",

        "wan": "ㄨㄢ",
        "wen": "ㄨㄣ",
        "wang": "ㄨㄤ",
        "weng": "ㄨㄥ",

        "ya": "ㄧㄚ",
        "yo": "ㄧㄛ",
        "ye": "ㄧㄝ",

        "yao": "ㄧㄠ",
        "you": "ㄧㄡ",

        "yan": "ㄧㄢ",
        "yin": "ㄧㄣ",

        "yang": "ㄧㄤ",
        "ying": "ㄧㄥ",

        "wu": "ㄨ",
        "yi": "ㄧ",
        "yu": "ㄩ",

        "ia": "ㄧㄚ",
        "io": "ㄧㄛ",
        "ie": "ㄧㄝ",

        "iu": "ㄧㄡ",

        "ian": "ㄧㄢ",
        "in": "ㄧㄣ",

        "ing": "ㄧㄥ",

        "ua": "ㄨㄚ",
        "uo": "ㄨㄛ",

        "uai": "ㄨㄞ",
        "ui": "ㄨㄟ",

        "uan": "ㄨㄢ",
        "un": "ㄨㄣ",

        "uang": "ㄨㄤ",
        "ong": "ㄨㄥ",

        "üe": "ㄩㄝ",
        "üan": "ㄩㄢ",
        "ün": "ㄩㄣ",

        "iong": "ㄩㄥ"

    };



    let result = "";

    let initial = "";



    /*
     * Find initial
     */

    for (
        let key of Object.keys(initials)
    ) {

        if (
            pinyinStr.startsWith(key)
        ) {

            initial = key;

            break;

        }

    }



    if (initial) {

        result +=
            initials[initial];


        pinyinStr =
            pinyinStr.slice(
                initial.length
            );

    }



    /*
     * Find final
     */

    if (
        finals[pinyinStr]
    ) {

        result +=
            finals[pinyinStr];

    }

    else {

        result +=
            pinyinStr;

    }



    return result +
           toneSymbol;

}

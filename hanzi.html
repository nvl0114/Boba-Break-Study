<!DOCTYPE html>
<html lang="en">

<head>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Boba Break Study - Stroke Order</title>


    <!-- =========================================
         HANZI WRITER
    ========================================== -->

    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>


    <!-- =========================================
         PINYIN PRO
    ========================================== -->

    <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.16.0/dist/index.js"></script>


    <!-- =========================================
         PINYIN → ZHUYIN
    ========================================== -->

    <script src="https://cdn.jsdelivr.net/npm/pinyin-to-bopomofo@latest/dist/index.umd.js"></script>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }


        body {
            background-color: #f8f9fa;
            display: flex;
            min-height: 100vh;
        }


        /* =========================================
           MAIN CONTENT
        ========================================== */

        .main-content {
            flex: 1;
            padding: 20px;
        }


        .card {
            width: 100%;

            background: #ffffff;

            border-radius: 12px;

            padding: 20px;

            margin-bottom: 20px;

            box-shadow:
                0 2px 5px rgba(0,0,0,0.03);

            border: 1px solid #eaeaea;
        }


        .card h2 {
            font-size: 20px;

            margin-bottom: 15px;

            color: #111;
        }


        /* =========================================
           SEARCH
        ========================================== */

        .search-box {
            display: flex;

            border: 1px solid #ddd;

            border-radius: 6px;

            overflow: hidden;

            margin-bottom: 8px;
        }


        .search-box input {
            flex: 1;

            padding: 10px 14px;

            border: none;

            outline: none;

            font-size: 14px;
        }


        .search-box button {
            background-color: #b5835a;

            color: white;

            border: none;

            padding: 0 20px;

            cursor: pointer;

            font-weight: bold;
        }


        .search-box button:hover {
            background-color: #9d704c;
        }


        .search-hint {
            font-size: 12px;

            color: #666;
        }


        /* =========================================
           STROKE DISPLAY
        ========================================== */

        .stroke-display {

            width: 100%;

            text-align: center;

            border: 1px solid #eaeaea;

            border-radius: 8px;

            padding: 20px;

            margin-bottom: 15px;

            background: #fff;

            display: flex;

            justify-content: center;

            align-items: center;

        }


        #character-target {

            width: 600px;

            height: 300px;

        }


        /* =========================================
           CHARACTER INFO
        ========================================== */

        .character-info {

            text-align: center;

            font-family:
                "Comic Sans MS",
                "Segoe UI",
                sans-serif;

            margin-top: 15px;

        }


        .character-info p {

            font-size: 20px;

            color: #333;

            margin-bottom: 10px;

            font-weight: 500;

        }


        .character-info strong {

            color: #b87333;

        }


        /* =========================================
           MEANING
        ========================================== */

        .meaning-text {

            max-width: 600px;

            margin:
                0 auto 12px auto;

            line-height: 1.5;

        }


        .meaning-label {

            color: #b87333;

            font-weight: bold;

        }


        .meaning-value {

            color: #333;

        }


        .meaning-loading {

            color: #888;

            font-size: 15px;

        }


        .meaning-unavailable {

            color: #999;

            font-size: 15px;

        }


        /* =========================================
           SOUND BUTTON
        ========================================== */

        .sound-btn {

            margin-top: 5px;

            padding: 9px 18px;

            border: none;

            border-radius: 25px;

            background-color: #b5835a;

            color: white;

            cursor: pointer;

            font-size: 14px;

            font-weight: bold;

            transition:
                background-color 0.2s ease,
                transform 0.15s ease,
                box-shadow 0.2s ease;

        }


        .sound-btn:hover {

            background-color: #9d704c;

            transform: translateY(-1px);

        }


        .sound-btn:active {

            transform: scale(0.96);

        }


        /* =========================================
           SOUND PLAYING
        ========================================== */

        .sound-btn.speaking {

            background-color: #765437;

            animation:
                soundPulse 1.2s infinite;

        }


        @keyframes soundPulse {

            0% {

                box-shadow:
                    0 0 0 0
                    rgba(181, 131, 90, 0.55);

            }

            70% {

                box-shadow:
                    0 0 0 12px
                    rgba(181, 131, 90, 0);

            }

            100% {

                box-shadow:
                    0 0 0 0
                    rgba(181, 131, 90, 0);

            }

        }


        /* =========================================
           STROKE LOADING
        ========================================== */

        .stroke-loading {

            color: #888;

            font-size: 13px;

            margin-top: 120px;

        }


        .stroke-error {

            color: #b44;

            font-size: 13px;

            margin-top: 120px;

        }


        /* =========================================
           MOBILE
        ========================================== */

        @media screen and (max-width: 768px) {

            .stroke-display {

                max-width: 300px;

                margin-left: auto;

                margin-right: auto;

                padding: 5px;

            }


            #character-target {

                width: 300px;

                height: 300px;

            }


            .character-info p {

                font-size: 18px;

            }

        }

    </style>

</head>


<body>


<div class="app-container">


    <!-- =========================================
         SIDEBAR
    ========================================== -->

    <div id="sidebar-container"></div>


    <!-- =========================================
         MAIN CONTENT
    ========================================== -->

    <div class="main-content">


        <!-- =====================================
             SEARCH CARD
        ====================================== -->

        <div class="card">

            <h2>
                Hanzi Stroke Order Finder
            </h2>


            <div class="search-box">

                <input
                    type="text"
                    id="char-input"
                    placeholder="Enter a traditional Hanzi character (e.g. 學)"
                    maxlength="1"
                >


                <button id="search-btn">
                    Search
                </button>

            </div>


            <p class="search-hint">

                Enter a traditional Hanzi character.

            </p>

        </div>



        <!-- =====================================
             RESULT CARD
        ====================================== -->

        <div class="card">


            <!-- =================================
                 STROKE ORDER
            ================================== -->

            <div class="stroke-display">

                <div id="character-target">

                    <p class="stroke-loading">
                        Loading...
                    </p>

                </div>

            </div>



            <!-- =================================
                 CHARACTER INFORMATION
            ================================== -->

            <div
                class="character-info"
                id="char-info"
            >

                <p>

                    <strong>Hanzi:</strong>

                    學

                </p>


                <p>

                    <strong>Pinyin:</strong>

                    xué

                </p>


                <p>

                    <strong>Zhuyin:</strong>

                    ㄒㄩㄝˊ

                </p>


                <p class="meaning-text">

                    <span class="meaning-label">

                        Meaning:

                    </span>


                    <span class="meaning-value">

                        to study; to learn

                    </span>

                </p>


                <button
                    class="sound-btn"
                    id="sound-btn"
                    onclick="speakChinese()"
                >

                    🔊

                    <span id="sound-text">

                        Listen

                    </span>

                </button>

            </div>


        </div>


    </div>

</div>



<script>


/* =========================================
   CURRENT CHARACTER
========================================= */

let currentCharacter = "學";


/* =========================================
   HANZI WRITER SETTINGS
========================================= */

const strokeOptions = {

    padding: 5,

    showOutline: true,

    showCharacter: true,

    strokeAnimationSpeed: 1,

    strokeColor: "#333333"

};



/* =========================================
   ACJK TRADITIONAL DATA LOADER
========================================= */

function loadACJKTraditionalData(
    char,
    onComplete,
    onError
) {

    const url =
        "https://cdn.jsdelivr.net/npm/" +
        "hanzi-writer-data-acjk@latest/" +
        "animCJK/ZhHant/" +
        encodeURIComponent(char) +
        ".json";


    fetch(url)

        .then(function(response) {

            if (!response.ok) {

                throw new Error(
                    "ACJK Traditional data not found"
                );

            }

            return response.json();

        })

        .then(function(data) {

            console.log(
                "ACJK ZhHant loaded:",
                char
            );

            onComplete(data);

        })

        .catch(function(error) {

            console.log(
                "ACJK ZhHant failed:",
                char,
                error
            );


            /*
             * FALLBACK TO ORIGINAL
             * HANZI WRITER DATA
             */

            loadOriginalHanziWriterData(
                char,
                onComplete,
                onError
            );

        });

}



/* =========================================
   ORIGINAL HANZI WRITER FALLBACK
========================================= */

function loadOriginalHanziWriterData(
    char,
    onComplete,
    onError
) {

    const url =
        "https://cdn.jsdelivr.net/npm/" +
        "hanzi-writer-data@latest/" +
        encodeURIComponent(char) +
        ".json";


    fetch(url)

        .then(function(response) {

            if (!response.ok) {

                throw new Error(
                    "Original Hanzi Writer data not found"
                );

            }

            return response.json();

        })

        .then(function(data) {

            console.log(
                "Original Hanzi Writer data loaded:",
                char
            );

            onComplete(data);

        })

        .catch(function(error) {

            console.log(
                "Original data also failed:",
                char,
                error
            );


            if (onError) {

                onError(error);

            }

        });

}



/* =========================================
   CREATE HANZI WRITER
========================================= */

function createStrokeWriter(
    character
) {

    const target =
        document.getElementById(
            "character-target"
        );


    target.innerHTML = "";


    const renderWidth =
        window.innerWidth <= 768
            ? 300
            : 600;


    try {

        const writer =
            HanziWriter.create(
                "character-target",
                character,
                {

                    width:
                        renderWidth,

                    height:
                        300,

                    padding:
                        strokeOptions.padding,

                    showOutline:
                        strokeOptions.showOutline,

                    showCharacter:
                        strokeOptions.showCharacter,

                    strokeAnimationSpeed:
                        strokeOptions.strokeAnimationSpeed,

                    strokeColor:
                        strokeOptions.strokeColor,


                    /*
                     * IMPORTANT:
                     * Traditional ACJK first,
                     * original dataset second.
                     */

                    charDataLoader:
                        function(
                            char,
                            onComplete,
                            onError
                        ) {

                            loadACJKTraditionalData(
                                char,
                                onComplete,
                                onError
                            );

                        },


                    onLoadCharDataSuccess:
                        function(data) {

                            console.log(
                                "Stroke data successfully loaded:",
                                character
                            );

                        },


                    onLoadCharDataError:
                        function(error) {

                            console.log(
                                "Final stroke data error:",
                                error
                            );


                            target.innerHTML = `

                                <p class="stroke-error">

                                    Stroke order data
                                    is not available
                                    for this character.

                                </p>

                            `;

                        }

                }
            );


        /*
         * Animate automatically
         */

        writer.animateCharacter();


        return writer;

    }

    catch(error) {

        console.log(
            "Hanzi Writer creation error:",
            error
        );


        target.innerHTML = `

            <p class="stroke-error">

                Unable to load stroke order.

            </p>

        `;


        return null;

    }

}



/* =========================================
   INITIAL CHARACTER
========================================= */

let writer =
    createStrokeWriter("學");



/* =========================================
   ELEMENTS
========================================= */

const inputField =
    document.getElementById(
        "char-input"
    );


const searchButton =
    document.getElementById(
        "search-btn"
    );


const infoBox =
    document.getElementById(
        "char-info"
    );



/* =========================================
   SEARCH
========================================= */

async function handleSearch() {

    const val =
        inputField.value.trim();


    if (val.length === 0) {

        return;

    }


    /*
     * First character only
     */

    const targetChar =
        val[0];


    currentCharacter =
        targetChar;



    /*
     * Stop speech
     */

    if (
        "speechSynthesis" in window
    ) {

        speechSynthesis.cancel();

    }


    resetSoundButton();



    /*
     * Create new stroke writer
     */

    writer = null;


    writer =
        createStrokeWriter(
            targetChar
        );



    /*
     * Show loading information
     */

    infoBox.innerHTML = `

        <p>

            <strong>Hanzi:</strong>

            ${targetChar}

        </p>


        <p>

            <strong>Pinyin:</strong>

            <span id="pinyin-value">

                Loading...

            </span>

        </p>


        <p>

            <strong>Zhuyin:</strong>

            <span id="zhuyin-value">

                Loading...

            </span>

        </p>


        <p class="meaning-text">

            <span class="meaning-label">

                Meaning:

            </span>


            <span
                class="meaning-loading"
                id="meaning-value"
            >

                Looking up...

            </span>

        </p>


        <button
            class="sound-btn"
            id="sound-btn"
            onclick="speakChinese()"
        >

            🔊

            <span id="sound-text">

                Listen

            </span>

        </button>

    `;



    /*
     * Get dictionary information
     */

    await loadDictionaryData(
        targetChar
    );

}



/* =========================================
   TAIWAN MANDARIN API
========================================= */

async function loadDictionaryData(
    targetChar
) {

    const encodedChar =
        encodeURIComponent(
            targetChar
        );


    const apiUrl =
        "https://api.taiwanmandarin.com/" +
        "characters/" +
        encodedChar;


    try {

        const response =
            await fetch(
                apiUrl
            );


        if (!response.ok) {

            throw new Error(
                "Character not found in dictionary"
            );

        }


        const data =
            await response.json();



        /*
         * Pinyin
         */

        let pinyinResult =
            data.pinyin || "-";



        /*
         * Zhuyin
         */

        let zhuyinResult =
            data.bopomofo || "-";



        /*
         * English
         */

        let meaningResult =
            data.english || "";



        /*
         * Update Pinyin
         */

        const pinyinElement =
            document.getElementById(
                "pinyin-value"
            );


        if (pinyinElement) {

            pinyinElement.textContent =
                pinyinResult;

        }



        /*
         * Update Zhuyin
         */

        const zhuyinElement =
            document.getElementById(
                "zhuyin-value"
            );


        if (zhuyinElement) {

            zhuyinElement.textContent =
                zhuyinResult;

        }



        /*
         * Update English meaning
         */

        const meaningElement =
            document.getElementById(
                "meaning-value"
            );


        if (meaningElement) {

            if (meaningResult) {

                meaningElement.textContent =
                    meaningResult;

                meaningElement.className =
                    "meaning-value";

            }

            else {

                meaningElement.textContent =
                    "Meaning not available yet.";

                meaningElement.className =
                    "meaning-unavailable";

            }

        }

    }

    catch(error) {

        console.log(
            "Taiwan Mandarin API error:",
            error
        );


        /*
         * Pinyin Pro fallback
         */

        let pinyinResult = "-";

        let zhuyinResult = "-";


        try {

            pinyinResult =
                pinyinPro.pinyin(
                    targetChar,
                    {
                        toneType:
                            "symbol"
                    }
                );


            let numberPinyin =
                pinyinPro.pinyin(
                    targetChar,
                    {

                        toneType:
                            "number",

                        type:
                            "array"

                    }
                );


            numberPinyin =
                numberPinyin[0];


            zhuyinResult =
                convertPinyinToZhuyin(
                    numberPinyin
                );

        }

        catch(fallbackError) {

            console.log(
                "Pinyin fallback error:",
                fallbackError
            );

        }



        /*
         * Update fallback Pinyin
         */

        const pinyinElement =
            document.getElementById(
                "pinyin-value"
            );


        if (pinyinElement) {

            pinyinElement.textContent =
                pinyinResult;

        }



        /*
         * Update fallback Zhuyin
         */

        const zhuyinElement =
            document.getElementById(
                "zhuyin-value"
            );


        if (zhuyinElement) {

            zhuyinElement.textContent =
                zhuyinResult;

        }



        /*
         * Meaning unavailable
         */

        const meaningElement =
            document.getElementById(
                "meaning-value"
            );


        if (meaningElement) {

            meaningElement.textContent =
                "Meaning not available yet.";

            meaningElement.className =
                "meaning-unavailable";

        }

    }

}



/* =========================================
   SEARCH BUTTON
========================================= */

searchButton.addEventListener(
    "click",
    handleSearch
);



/* =========================================
   ENTER KEY
========================================= */

inputField.addEventListener(
    "keypress",
    function(event) {

        if (event.key === "Enter") {

            handleSearch();

        }

    }
);



/* =========================================
   TEXT TO SPEECH
========================================= */

function speakChinese() {

    if (
        !("speechSynthesis" in window)
    ) {

        alert(
            "Your browser does not support text-to-speech."
        );

        return;

    }


    /*
     * Stop if currently speaking
     */

    if (
        speechSynthesis.speaking
    ) {

        speechSynthesis.cancel();

        resetSoundButton();

        return;

    }


    /*
     * Create utterance
     */

    const utterance =
        new SpeechSynthesisUtterance(
            currentCharacter
        );


    /*
     * Taiwan Mandarin
     */

    utterance.lang =
        "zh-TW";


    /*
     * Learning speed
     */

    utterance.rate =
        0.75;


    utterance.pitch =
        1;



    /*
     * Start
     */

    utterance.onstart =
        function() {

            setSpeakingButton();

        };



    /*
     * End
     */

    utterance.onend =
        function() {

            resetSoundButton();

        };



    /*
     * Error
     */

    utterance.onerror =
        function() {

            resetSoundButton();

        };


    speechSynthesis.cancel();


    speechSynthesis.speak(
        utterance
    );

}



/* =========================================
   SOUND BUTTON - PLAYING
========================================= */

function setSpeakingButton() {

    const button =
        document.getElementById(
            "sound-btn"
        );


    const text =
        document.getElementById(
            "sound-text"
        );


    if (!button) {

        return;

    }


    button.classList.add(
        "speaking"
    );


    if (text) {

        text.textContent =
            "Speaking...";

    }

}



/* =========================================
   SOUND BUTTON - RESET
========================================= */

function resetSoundButton() {

    const button =
        document.getElementById(
            "sound-btn"
        );


    const text =
        document.getElementById(
            "sound-text"
        );


    if (!button) {

        return;

    }


    button.classList.remove(
        "speaking"
    );


    if (text) {

        text.textContent =
            "Listen";

    }

}



/* =========================================
   PINYIN → ZHUYIN FALLBACK
========================================= */

function convertPinyinToZhuyin(
    pinyinStr
) {

    if (!pinyinStr) {

        return "";

    }


    pinyinStr =
        pinyinStr
            .toLowerCase()
            .trim();



    /*
     * Tone map
     */

    const toneMap = {

        "ā": "a1",
        "á": "a2",
        "ǎ": "a3",
        "à": "a4",

        "ē": "e1",
        "é": "e2",
        "ě": "e3",
        "è": "e4",

        "ī": "i1",
        "í": "i2",
        "ǐ": "i3",
        "ì": "i4",

        "ō": "o1",
        "ó": "o2",
        "ǒ": "o3",
        "ò": "o4",

        "ū": "u1",
        "ú": "u2",
        "ǔ": "u3",
        "ù": "u4",

        "ǖ": "ü1",
        "ǘ": "ü2",
        "ǚ": "ü3",
        "ǜ": "ü4"

    };



    /*
     * Zhuyin tone symbols
     */

    const zhuyinTones = {

        "1": "",

        "2": "ˊ",

        "3": "ˇ",

        "4": "ˋ",

        "5": "˙"

    };


    let toneNum = "1";



    /*
     * Tone number
     */

    if (
        /[1-5]$/.test(
            pinyinStr
        )
    ) {

        toneNum =
            pinyinStr.slice(-1);


        pinyinStr =
            pinyinStr.slice(
                0,
                -1
            );

    }


    /*
     * Tone mark
     */

    else {

        for (
            let char of pinyinStr
        ) {

            if (
                toneMap[char]
            ) {

                const converted =
                    toneMap[char];


                pinyinStr =
                    pinyinStr.replace(
                        char,
                        converted[0]
                    );


                toneNum =
                    converted[1];


                break;

            }

        }

    }



    const toneSymbol =
        zhuyinTones[toneNum] || "";



    /*
     * Initials
     */

    const initials = {

        "zh": "ㄓ",
        "ch": "ㄔ",
        "sh": "ㄕ",

        "b": "ㄅ",
        "p": "ㄆ",
        "m": "ㄇ",
        "f": "ㄈ",

        "d": "ㄉ",
        "t": "ㄊ",
        "n": "ㄋ",
        "l": "ㄌ",

        "g": "ㄍ",
        "k": "ㄎ",
        "h": "ㄏ",

        "j": "ㄐ",
        "q": "ㄑ",
        "x": "ㄒ",

        "r": "ㄖ",
        "z": "ㄗ",
        "c": "ㄘ",
        "s": "ㄙ"

    };



    /*
     * Finals
     */

    const finals = {

        "a": "ㄚ",
        "o": "ㄛ",
        "e": "ㄜ",
        "er": "ㄦ",

        "ai": "ㄞ",
        "ei": "ㄟ",
        "ao": "ㄠ",
        "ou": "ㄡ",

        "an": "ㄢ",
        "en": "ㄣ",

        "ang": "ㄤ",
        "eng": "ㄥ",

        "i": "ㄧ",
        "u": "ㄨ",
        "ü": "ㄩ",

        "wa": "ㄨㄚ",
        "wo": "ㄨㄛ",
        "wai": "ㄨㄞ",
        "wei": "ㄨㄟ",

        "wan": "ㄨㄢ",
        "wen": "ㄨㄣ",
        "wang": "ㄨㄤ",
        "weng": "ㄨㄥ",

        "ya": "ㄧㄚ",
        "yo": "ㄧㄛ",
        "ye": "ㄧㄝ",

        "yao": "ㄧㄠ",
        "you": "ㄧㄡ",

        "yan": "ㄧㄢ",
        "yin": "ㄧㄣ",

        "yang": "ㄧㄤ",
        "ying": "ㄧㄥ",

        "wu": "ㄨ",
        "yi": "ㄧ",
        "yu": "ㄩ",

        "ia": "ㄧㄚ",
        "io": "ㄧㄛ",
        "ie": "ㄧㄝ",

        "iao": "ㄧㄠ",
        "iu": "ㄧㄡ",

        "ian": "ㄧㄢ",
        "in": "ㄧㄣ",

        "iang": "ㄧㄤ",
        "ing": "ㄧㄥ",

        "ua": "ㄨㄚ",
        "uo": "ㄨㄛ",

        "uai": "ㄨㄞ",
        "ui": "ㄨㄟ",

        "uan": "ㄨㄢ",
        "un": "ㄨㄣ",

        "uang": "ㄨㄤ",
        "ong": "ㄨㄥ",

        "üe": "ㄩㄝ",
        "üan": "ㄩㄢ",
        "ün": "ㄩㄣ",

        "iong": "ㄩㄥ"

    };



    let result = "";

    let initial = "";



    /*
     * Find initial
     */

    for (
        let key of Object.keys(initials)
    ) {

        if (
            pinyinStr.startsWith(key)
        ) {

            initial = key;

            break;

        }

    }



    if (initial) {

        result +=
            initials[initial];


        pinyinStr =
            pinyinStr.slice(
                initial.length
            );

    }



    /*
     * Find final
     */

    if (
        finals[pinyinStr]
    ) {

        result +=
            finals[pinyinStr];

    }

    else {

        result +=
            pinyinStr;

    }



    return result +
           toneSymbol;

}


</script>
